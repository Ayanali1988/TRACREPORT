<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Inter',sans-serif; background:#F2F3F0; color:#1D2330; }
  :root { --bg:#F2F3F0; --panel:#FFFFFF; --ink:#1D2330; --muted:#6B7380; --line:#E2E4DE;
    --navy:#161B26; --steel:#2D6E8E; --green:#3E9C6E; --amber:#D98E3F; --red:#C1503F; }
  h1,h2,h3,.display { font-family:'Oswald',sans-serif; letter-spacing:0.02em; margin:0; }
  .mono { font-family:'Roboto Mono',monospace; font-weight:700; font-variant-numeric: tabular-nums; }
  .app { display:flex; min-height:100vh; }
  .sidebar { width:200px; background:var(--navy); color:#fff; display:flex; flex-direction:column; padding:18px 12px; flex-shrink:0; }
  .brand { display:flex; align-items:center; gap:8px; font-family:'Oswald',sans-serif; font-size:18px; font-weight:700; padding:0 6px 16px 6px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:12px; }
  .navbtn { display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:none; color:rgba(255,255,255,0.72); padding:9px 10px; border-radius:7px; font-size:13px; font-weight:500; cursor:pointer; margin-bottom:2px; }
  .nav-group-label { color:rgba(255,255,255,0.4); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; padding:14px 10px 4px; }
  .nav-group-label:first-child { padding-top:4px; }
  .navbtn:hover { background:rgba(255,255,255,0.06); color:#fff; }
  .navbtn.active { background:var(--steel); color:#fff; }
  .sidebar-footer { margin-top:auto; padding-top:12px; border-top:1px solid rgba(255,255,255,0.12); font-size:11px; color:rgba(255,255,255,0.5); }
  .content { flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 22px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .topbar .filters { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .field label { font-size:11px; color:var(--muted); display:block; margin-bottom:3px; text-transform:uppercase; letter-spacing:0.04em; }
  .field input, .field select { border:1px solid var(--line); border-radius:6px; padding:6px 9px; font-size:13px; box-sizing:border-box; }
  .actions { display:flex; gap:8px; }
  .btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; padding:7px 12px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink); }
  .btn:hover { border-color:var(--steel); color:var(--steel); }
  .btn.primary { background:var(--steel); border-color:var(--steel); color:#fff; }
  .btn.primary:hover { opacity:0.9; color:#fff; }
  .btn.danger { color:var(--red); border-color:var(--red); }
  .btn.small { padding:4px 9px; font-size:12px; }
  .main-scroll { flex:1; overflow:auto; padding:20px 22px; }
  .mobile-menu-btn { display:none; }
  .sidebar-overlay { display:none; }
  @media (max-width: 860px) {
    .app { position: relative; overflow-x: hidden; }
    .sidebar { position:fixed; top:0; bottom:0; left:-230px; width:210px; z-index:200; transition:left 0.2s ease; box-shadow: 2px 0 12px rgba(0,0,0,0.25); }
    .sidebar.mobile-open { left:0; }
    .sidebar-overlay.show { display:block; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:150; }
    .mobile-menu-btn { display:flex; align-items:center; justify-content:center; width:36px; height:36px; border:1px solid var(--line); background:#fff; border-radius:8px; font-size:18px; cursor:pointer; flex-shrink:0; }
    .topbar { padding:10px 14px; gap:8px; }
    .topbar .filters { width:100%; order:3; }
    .main-scroll { padding:14px; }
    .kpi-row { grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap:10px; }
    .grid-2 { grid-template-columns: 1fr; }
    .actions { flex-wrap:wrap; }
  }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .panel h3 { font-size:13.5px; margin:0 0 12px 0; display:flex; align-items:center; gap:7px; text-transform:uppercase; letter-spacing:0.04em; }
  .kpi-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:14px; margin-bottom:16px; }
  .kpi-card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:13px 15px; }
  .kpi-card .label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }
  .kpi-card .value { font-size:20px; }
  .kpi-card .sub { font-size:11.5px; margin-top:4px; }
  .kpi-card .sub.pos { color:var(--green); } .kpi-card .sub.neg { color:var(--red); }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.02em; padding:6px 7px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:5px 7px; border-bottom:1px solid #EEEFEA; white-space:nowrap; }
  tr.section-row td { font-weight:700; background:var(--navy); text-transform:uppercase; font-size:11.5px; letter-spacing:0.04em; color:#fff; padding:7px 8px; }
  tr.subtotal-row td { font-weight:700; background:#FBFAF6; }
  tr.totalexp-row td { font-weight:700; background:#EAE2D4; color:#7A5A1E; }
  tr.net-row td { font-weight:700; background:#EFF4F1; color:var(--steel); font-size:13.5px; }

  .num { font-family:'Roboto Mono',monospace; text-align:right; font-variant-numeric:tabular-nums; }
  td input { width:88px; border:1px solid var(--line); border-radius:5px; padding:4px 6px; font-size:12px; box-sizing:border-box; font-family:'Roboto Mono',monospace; text-align:right; }
  .badge { display:inline-flex; align-items:center; gap:4px; padding:2px 7px; border-radius:20px; font-size:11px; font-weight:600; }
  @keyframes pulse { 0%, 100% { opacity:1; } 50% { opacity:0.45; } }
  .badge.pos { background:rgba(62,156,110,0.12); color:var(--green); }
  .badge.neg { background:rgba(193,80,63,0.12); color:var(--red); }
  .empty-state { text-align:center; padding:50px 20px; color:var(--muted); }
  .chip { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:20px; padding:5px 11px; font-size:12.5px; cursor:pointer; background:#fff; }
  .chip.selected { background:var(--steel); color:#fff; border-color:var(--steel); }
  .add-row { display:flex; gap:6px; margin-top:6px; }
  .add-row input { flex:1; border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:12.5px; }
  .icon-btn { background:none; border:1px solid var(--line); cursor:pointer; color:var(--muted); padding:4px 7px; border-radius:5px; font-size:12px; }
  .icon-btn:hover { background:#F0F1EC; color:var(--red); border-color:var(--red); }
  .grid-2 { display:grid; grid-template-columns:1.3fr 1fr; gap:16px; }
  .bar-chart { display:flex; align-items:flex-end; gap:10px; height:200px; padding-top:10px; overflow-x:auto; }
  .bar-group { display:flex; flex-direction:column; align-items:center; min-width:56px; }
  .bar-set { display:flex; align-items:flex-end; gap:3px; height:160px; }
  .bar { width:16px; border-radius:3px 3px 0 0; }
  .bar-label { font-size:10.5px; color:var(--muted); margin-top:6px; text-align:center; }
  .hbar-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .hbar-track { flex:1; background:#EEEFEA; border-radius:4px; height:14px; overflow:hidden; }
  .hbar-fill { height:100%; border-radius:4px; }
  .hbar-name { width:150px; font-size:12px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; }
  .hbar-val { width:44px; text-align:right; font-size:11.5px; font-family:'Roboto Mono',monospace; flex-shrink:0; }
  .login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--navy); }
  .login-box { background:#fff; border-radius:12px; padding:34px; width:340px; text-align:center; }
  .login-box input { width:100%; border:1px solid var(--line); border-radius:7px; padding:10px 12px; font-size:14px; margin:14px 0; box-sizing:border-box; }
  .print-only { display:none; }
  @page { size: A4 landscape; margin: 10mm; }
  @media print {
    .no-print { display:none !important; }
    .main-scroll { display:none !important; }
    .print-only { display:block !important; }
    body { background:#fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; color-adjust: exact; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    .app { display:block; }
    .print-only table { border-collapse: collapse; width: 100%; font-size: 10.5px; }
    .print-only table th, .print-only table td { border: 1px solid #ccc !important; padding: 3px 6px !important; line-height: 1.2; }
    .print-only .panel { border: none; box-shadow: none; padding: 6px 0; margin-bottom: 8px !important; }
    .print-only .kpi-row { gap: 8px; margin-bottom: 10px !important; }
    .print-only .kpi-card { padding: 8px 10px; }
    .print-only .kpi-card .value { font-size: 15px; }
    .print-only h1 { font-size: 16px; margin: 0; }
    .print-only h3 { font-size: 11.5px; margin-bottom: 6px; }
    .print-only .chip { border: 1px solid #ccc; pointer-events: none; }
    .print-only tr.section-row td { padding: 4px 6px !important; }
  }
</style>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, Fragment } = React;

/* ---------------- chart of accounts defaults ---------------- */
const defaultLineItems = () => ({
  revenue: [
    { key: 'rentalDaily', label: 'Rental income - Daily basis' },
    { key: 'rentalMonthly', label: 'Rental income - Monthly basis' },
    { key: 'rentalSubLease', label: 'Rental income - Sub Lease' },
    { key: 'otherIncome', label: 'Other Income' },
  ],
  direct: [
    { key: 'subLeaseCharges', label: 'Sub lease charges' },
    { key: 'salaryCost', label: 'Salary cost' },
    { key: 'staffBenefits', label: 'Staff benefits' },
    { key: 'commissionOwn', label: 'Commission on our vehicles' },
    { key: 'commissionSub', label: 'Commission on subleased vehicles' },
    { key: 'registrationCost', label: 'Registration cost' },
    { key: 'trackingCharges', label: 'Tracking charges' },
    { key: 'insuranceCharges', label: 'Insurance charges' },
    { key: 'vehicleMaintenance', label: 'Vehicle maintenance' },
    { key: 'depreciationVehicles', label: 'Depreciation - vehicles' },
  ],
  indirect: [
    { key: 'rentOffice', label: 'Rent - Office' },
    { key: 'salaryOffice', label: 'Salary - Office' },
    { key: 'staffBenefitOffice', label: 'Staff benefit (Medical/Ticket)' },
    { key: 'gratuity', label: 'Gratuity & Leave Salary' },
    { key: 'visaRenewal', label: 'Visa Renewal Staff' },
    { key: 'licenseRenewal', label: 'License Renewal Fee' },
    { key: 'utilities', label: 'Communication / Utility Bills' },
    { key: 'softwareRenewal', label: 'Software Renewal' },
    { key: 'auditFee', label: 'Annual Audit Fee' },
    { key: 'advertisement', label: 'Advertisement & Promotion' },
    { key: 'printing', label: 'Printing and Stationery' },
    { key: 'officeExpenses', label: 'Office Expenses' },
    { key: 'badDebts', label: 'Provision for Bad Debts' },
  ],
  interest: [
    { key: 'interestLoan', label: 'Interest / Loan / Financing' },
    { key: 'bankCharges', label: 'Bank Charges' },
  ],
  belowLine: [
    { key: 'profitOnSale', label: 'Profit on Sale of Vehicles' },
  ],
});

// Role-based tab access, enforced in the sidebar and as a safety fallback on login/role change.
// Admin sees everything; Manager loses Settings/Financing/Feasibility/Personal Finance;
// Viewer loses every entry/setup screen and sees only report-style tabs.
const ADMIN_ONLY_TABS = ['settings'];
const ADMIN_MANAGER_TABS = ['pnl-entry', 'occ-entry', 'veh-revenue', 'agreements', 'vehicles', 'chart-of-accounts', 'import', 'notes', 'insurance'];
const VIEWER_HIDDEN_TABS = [...ADMIN_ONLY_TABS, ...ADMIN_MANAGER_TABS, 'financing', 'feasibility'];
function TAB_GROUPS_FOR_ROLE(role) {
  const all = ['dashboard', 'quick-review', 'pnl-compare', 'occ-report', 'model-compare', 'financing', 'fleet-data-report', 'investors-fleet', 'pnl-entry', 'occ-entry', 'veh-revenue', 'agreements', 'feasibility', 'insurance', 'vehicles', 'chart-of-accounts', 'import', 'notes', 'personal-finance', 'settings'];
  if (role === 'admin') return all;
  if (role === 'manager') return all.filter(t => !ADMIN_ONLY_TABS.includes(t) && t !== 'financing' && t !== 'feasibility' && t !== 'personal-finance');
  return all.filter(t => !VIEWER_HIDDEN_TABS.includes(t) && t !== 'personal-finance');
}

const SECTION_META = {
  revenue: { title: 'Revenue', kind: 'income' },
  direct: { title: 'Direct Expenses', kind: 'expense' },
  indirect: { title: 'Indirect Expenses', kind: 'expense' },
  interest: { title: 'Interest & Bank Charges', kind: 'expense' },
  belowLine: { title: 'Other Income (Profit on Sale, etc.)', kind: 'income' },
};

const COLORS = ['#2D6E8E', '#3E9C6E', '#D98E3F', '#8C6BB1', '#C1503F', '#4E5D78'];

const CAR_COLOR_OPTIONS = ['Black', 'White', 'Pearl White', 'Silver', 'Grey', 'Charcoal', 'Blue', 'Navy Blue', 'Red', 'Maroon', 'Green', 'Gold', 'Bronze', 'Brown', 'Beige', 'Orange', 'Yellow', 'Purple'];
const CAR_COLOR_HEX = {
  'Black': '#1A1A1A', 'White': '#F5F5F5', 'Pearl White': '#F0F0EA', 'Silver': '#C0C0C0', 'Grey': '#808080',
  'Charcoal': '#36454F', 'Blue': '#1E5AA8', 'Navy Blue': '#1B2A4A', 'Red': '#C1503F', 'Maroon': '#6B2737',
  'Green': '#3E9C6E', 'Gold': '#D4AF37', 'Bronze': '#8C6239', 'Brown': '#6B4423', 'Beige': '#E8DCC4',
  'Orange': '#D98E3F', 'Yellow': '#E8C547', 'Purple': '#7B4B94',
};
function carColorHex(name) { return CAR_COLOR_HEX[name] || '#9AA0A6'; }

function uid(p) { return p + '_' + Math.random().toString(36).slice(2, 9); }
function num(v) { const n = Number(v); return isNaN(n) ? 0 : n; }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

// Allows typing a simple arithmetic expression (e.g. "6500+2522") directly into a number
// cell; evaluated on blur. Restricted to digits/operators/parens only — never passed to
// eval() on unsanitized input, and rejected outright if it contains anything else.
function evalExpr(str) {
  if (typeof str !== 'string') return null;
  const trimmed = str.trim();
  if (!trimmed) return null;
  if (!/^[0-9+\-*/().\s]+$/.test(trimmed)) return null;
  if (!/[+\-*/]/.test(trimmed)) return null;
  try {
    const result = Function('"use strict"; return (' + trimmed + ')')();
    return typeof result === 'number' && isFinite(result) ? result : null;
  } catch (e) {
    return null;
  }
}
function monthsOf(year) { return Array.from({ length: 12 }, (_, i) => year + '-' + String(i + 1).padStart(2, '0')); }
function periodsBetween(from, to) {
  if (!from || !to || from > to) return [];
  const result = [];
  let [y, m] = from.split('-').map(Number);
  const [ey, em] = to.split('-').map(Number);
  let guard = 0;
  while ((y < ey || (y === ey && m <= em)) && guard < 600) {
    result.push(y + '-' + String(m).padStart(2, '0'));
    m++; if (m > 12) { m = 1; y++; }
    guard++;
  }
  return result;
}

// Sums the monthly-allocated cost of every insurance policy active during `period` (a
// policy's premium is split evenly across the whole months it covers).
function insuranceMonthlyTotal(period, insurancePolicies) {
  let total = 0;
  (insurancePolicies || []).forEach(p => {
    if (!p.startDate || !p.endDate) return;
    const months = periodsBetween(p.startDate.slice(0, 7), p.endDate.slice(0, 7));
    if (!months.includes(period)) return;
    total += num(p.premiumAmount) / (months.length || 1);
  });
  return total;
}

// ---------------- Agreement-based Occupancy/Income system ----------------

function findVehicleByPlate(vehicles, plate) {
  const norm = (plate || '').trim().toLowerCase();
  return vehicles.find(v => (v.plate || '').trim().toLowerCase() === norm);
}

// Registration and Insurance expiry alerts, shared by the app-wide banner and Fleet Data
// Report. Registration: a daily countdown warning from 7 days out, escalating to a
// persistent/critical alert from 1 day before expiry through however long it stays
// unrenewed. Insurance: a week's heads-up to process the renewal in time, escalating to
// critical once it actually lapses.
function vehicleExpiryAlerts(vehicles, insurancePolicies, today) {
  const alerts = [];
  const todayDate = new Date(today);
  function daysUntil(dateStr) {
    if (!dateStr) return null;
    return Math.round((new Date(dateStr) - todayDate) / 86400000);
  }
  function daysLabel(d) {
    if (d < 0) return `expired ${Math.abs(d)} day${Math.abs(d) === 1 ? '' : 's'} ago`;
    if (d === 0) return 'expires today';
    return `${d} day${d === 1 ? '' : 's'} left`;
  }
  vehicles.forEach(v => {
    const regDays = daysUntil(v.registrationExpiry);
    if (regDays !== null && regDays <= 7) {
      alerts.push({ vehicleId: v.id, vehicleName: v.name, type: 'registration', daysLeft: regDays, message: `${v.name} (${v.plate}) registration ${daysLabel(regDays)}`, severity: regDays <= 1 ? 'critical' : 'warning' });
    }
    const list = (insurancePolicies || []).filter(p => p.vehicleId === v.id).sort((a, b) => (b.endDate || '').localeCompare(a.endDate || ''));
    const latest = list[0];
    const insDays = latest ? daysUntil(latest.endDate) : null;
    if (insDays !== null && insDays <= 7) {
      alerts.push({ vehicleId: v.id, vehicleName: v.name, type: 'insurance', daysLeft: insDays, message: `${v.name} (${v.plate}) insurance ${daysLabel(insDays)} — process the renewal now`, severity: insDays < 0 ? 'critical' : 'warning' });
    }
  });
  return alerts;
}

function agreementEffectiveEnd(agreement) {
  if ((agreement.status === 'closed' || agreement.status === 'replaced') && agreement.closeDate) return agreement.closeDate;
  return todayStr(); // still open: provisional, counted through today
}

function agreementTotalDays(agreement) {
  if (agreement.daysOverride !== undefined && agreement.daysOverride !== '') return num(agreement.daysOverride);
  if (!agreement.startDate) return 0;
  const start = new Date(agreement.startDate);
  const end = new Date(agreementEffectiveEnd(agreement));
  const days = Math.round((end - start) / 86400000) + 1;
  return Math.max(0, days);
}

function agreementDailyRate(agreement) {
  return agreement.type === 'monthly' ? num(agreement.rate) / 30 : num(agreement.rate);
}

function agreementTotalRevenue(agreement) {
  if (agreement.revenueOverride !== undefined && agreement.revenueOverride !== '') return num(agreement.revenueOverride);
  // Monthly-type agreements price by a standardized 30-day month, so the total must be
  // based on that same 30-day-per-month model — not the real calendar day count — or a
  // full month's share would drift above/below the quoted monthly rate.
  const days = agreement.type === 'monthly' ? agreementTotalDaysForSplit(agreement) : agreementTotalDays(agreement);
  return days * agreementDailyRate(agreement);
}

function agreementDaysInMonth(agreement, period) {
  if (!agreement.startDate) return 0;
  const [y, m] = period.split('-').map(Number);
  const monthStart = new Date(y, m - 1, 1);
  const monthEnd = new Date(y, m, 0);
  const start = new Date(agreement.startDate);
  const end = new Date(agreementEffectiveEnd(agreement));
  const rangeStart = start > monthStart ? start : monthStart;
  const rangeEnd = end < monthEnd ? end : monthEnd;
  if (rangeEnd < rangeStart) return 0;

  if (agreement.type === 'monthly') {
    // Standardized 30-day-month convention (matches how the monthly Rate itself is
    // quoted): a full calendar month always counts as exactly 30 days, regardless of
    // whether the real month has 28-31 days. A partial month (the agreement's first or
    // last month) is prorated by day-of-month position on that same 30-day basis.
    const isFullMonth = rangeStart.getTime() === monthStart.getTime() && rangeEnd.getTime() === monthEnd.getTime();
    if (isFullMonth) return 30;
    const startDay = rangeStart.getDate();
    const endDay = Math.min(rangeEnd.getDate(), 30);
    return Math.max(0, endDay - startDay + 1);
  }
  return Math.round((rangeEnd - rangeStart) / 86400000) + 1;
}

function agreementMonthsSpanned(agreement) {
  if (!agreement.startDate) return [];
  const endStr = agreementEffectiveEnd(agreement);
  if (agreement.startDate.slice(0, 7) > endStr.slice(0, 7)) return [];
  return periodsBetween(agreement.startDate.slice(0, 7), endStr.slice(0, 7));
}

// For 'monthly' agreements, this sums the standardized 30-day-per-month figures across
// every month spanned — used as the denominator so revenue splits proportionally in a way
// that's consistent with the flat 30-day model, including when a final total has been
// manually overridden at closing. For 'daily' agreements this is just the real total days.
function agreementTotalDaysForSplit(agreement) {
  if (agreement.type === 'monthly') {
    return agreementMonthsSpanned(agreement).reduce((s, period) => s + agreementDaysInMonth(agreement, period), 0);
  }
  return agreementTotalDays(agreement);
}

// Aggregates all agreements into { [period]: { [vehicleId]: { days, revenue } } } — only for
// agreements matched to a fleet vehicle (Sub-Lease/unmatched plates are excluded from the
// owned-fleet occupancy/revenue totals, tracked separately instead).
function aggregateAgreements(agreements, vehicles) {
  const out = {};
  (agreements || []).forEach(a => {
    if (a.status === 'void') return; // voided agreements are fully excluded from all totals
    const vehicle = a.vehicleId ? vehicles.find(v => v.id === a.vehicleId) : findVehicleByPlate(vehicles, a.plate);
    if (!vehicle) return; // Sub-Lease / unmatched — excluded from fleet totals
    const totalRevenue = agreementTotalRevenue(a);
    const totalDaysForSplit = agreementTotalDaysForSplit(a);
    agreementMonthsSpanned(a).forEach(period => {
      const monthDays = agreementDaysInMonth(a, period);
      if (monthDays <= 0) return;
      const monthRevenue = totalDaysForSplit > 0 ? totalRevenue * (monthDays / totalDaysForSplit) : 0;
      out[period] = out[period] || {};
      out[period][vehicle.id] = out[period][vehicle.id] || { days: 0, revenue: 0 };
      out[period][vehicle.id].days += monthDays;
      out[period][vehicle.id].revenue += monthRevenue;
    });
  });
  return out;
}

function monthLabel(period) {
  const [y, m] = period.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleString('default', { month: 'short' }) + '-' + String(y).slice(2);
}
function fmt(n, currency) {
  const rounded = Math.round(num(n));
  if (rounded === 0) return '-';
  return currency + ' ' + rounded.toLocaleString('en-US');
}
function pctStr(n) { return isFinite(n) ? (n * 100).toFixed(1) + '%' : '—'; }

// Any line item can have sub-accounts (e.g. "Utility Expense" -> Electricity/Water/Internet).
// When it does, its own Budget/Actual is always the sum of its sub-accounts, not a stored
// value of its own — this is the single point that enforces that everywhere.
function itemFieldValue(item, monthlyData, period, field) {
  const md = monthlyData[period] || {};
  if (item.subAccounts && item.subAccounts.length) {
    return item.subAccounts.reduce((s, sub) => s + num((md[sub.key] || {})[field]), 0);
  }
  return num((md[item.key] || {})[field]);
}

function computeMonth(period, monthlyData, lineItems) {
  const sumSec = (arr, field) => arr.reduce((s, item) => s + itemFieldValue(item, monthlyData, period, field), 0);
  const res = {};
  ['budget', 'actual'].forEach(f => {
    res['income_' + f] = sumSec(lineItems.revenue, f);
    res['direct_' + f] = sumSec(lineItems.direct, f);
    res['gross_' + f] = res['income_' + f] - res['direct_' + f];
    res['indirect_' + f] = sumSec(lineItems.indirect, f);
    res['ebitda_' + f] = res['gross_' + f] - res['indirect_' + f];
    res['interest_' + f] = sumSec(lineItems.interest, f);
    res['belowline_' + f] = sumSec(lineItems.belowLine, f);
    res['totalexp_' + f] = res['direct_' + f] + res['indirect_' + f] + res['interest_' + f];
    res['netprofit_' + f] = res['ebitda_' + f] - res['interest_' + f] + res['belowline_' + f];
    res['grossPct_' + f] = res['income_' + f] ? res['gross_' + f] / res['income_' + f] : 0;
    res['netPct_' + f] = res['income_' + f] ? res['netprofit_' + f] / res['income_' + f] : 0;
  });
  return res;
}

function rangeAggregate(monthKeys, monthlyData, lineItems) {
  const totals = {};
  monthKeys.forEach(p => {
    const c = computeMonth(p, monthlyData, lineItems);
    Object.keys(c).forEach(k => {
      if (k.endsWith('Pct_budget') || k.endsWith('Pct_actual')) return;
      totals[k] = (totals[k] || 0) + c[k];
    });
  });
  totals.grossPct_budget = totals.income_budget ? totals.gross_budget / totals.income_budget : 0;
  totals.grossPct_actual = totals.income_actual ? totals.gross_actual / totals.income_actual : 0;
  totals.netPct_budget = totals.income_budget ? totals.netprofit_budget / totals.income_budget : 0;
  totals.netPct_actual = totals.income_actual ? totals.netprofit_actual / totals.income_actual : 0;
  return totals;
}

function rowVariance(budget, actual, kind) {
  const variance = kind === 'expense' ? (budget - actual) : (actual - budget);
  const pct = budget !== 0 ? variance / Math.abs(budget) : null;
  return { variance, pct, favorable: variance >= 0 };
}

function buildOccDistributionRows(rangeMonths, vehicles, occupancy, baseDays) {

function computeQuickReview(rangeMonths, monthlyData, lineItems, vehicles, occupancy, baseDays) {
  const totals = rangeAggregate(rangeMonths, monthlyData, lineItems);
  const incomeVariance = rowVariance(totals.income_budget, totals.income_actual, 'income');
  const directVariance = rowVariance(totals.direct_budget, totals.direct_actual, 'expense');
  const netVariance = rowVariance(totals.netprofit_budget, totals.netprofit_actual, 'income');

  let topRevenue = null;
  (lineItems.revenue || []).forEach(item => {
    const val = rangeMonths.reduce((s, p) => s + num(((monthlyData[p] || {})[item.key] || {}).actual), 0);
    if (!topRevenue || val > topRevenue.value) topRevenue = { label: item.label, value: val };
  });
  const topRevenueSharePct = topRevenue && totals.income_actual ? topRevenue.value / totals.income_actual : null;

  const occRows = vehicles.map(v => {
    const pcts = rangeMonths.map(p => { const d = (occupancy[p] || {})[v.id]; return d === undefined || d === '' ? null : num(d) / baseDays; }).filter(x => x !== null);
    const avg = pcts.length ? pcts.reduce((a, b) => a + b, 0) / pcts.length : null;
    return { vehicle: v, avg };
  });
  const withData = occRows.filter(r => r.avg !== null);
  const fleetAvgOcc = withData.length ? withData.reduce((s, r) => s + r.avg, 0) / withData.length : 0;
  const above50 = withData.filter(r => r.avg >= 0.5).length;

  const modelGroups = {};
  withData.forEach(r => {
    const key = r.vehicle.name;
    if (!modelGroups[key]) modelGroups[key] = { name: key, sum: 0, count: 0 };
    modelGroups[key].sum += r.avg; modelGroups[key].count++;
  });
  const topModels = Object.values(modelGroups).map(g => ({ name: g.name, avg: g.sum / g.count, units: g.count }))
    .sort((a, b) => b.avg - a.avg).slice(0, 3);

  return { totals, incomeVariance, directVariance, netVariance, topRevenue, topRevenueSharePct, fleetAvgOcc, above50, totalWithData: withData.length, topModels };
}

function DonutGauge({ pct, size = 150, color = '#2D6E8E' }) {
  const r = size / 2 - 13;
  const c = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(1, pct));
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#EEEFEA" strokeWidth="14" />
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth="14"
        strokeDasharray={c} strokeDashoffset={c * (1 - clamped)} strokeLinecap="round"
        transform={`rotate(-90 ${size / 2} ${size / 2})`} />
      <text x="50%" y="50%" textAnchor="middle" dominantBaseline="middle" fontSize={size * 0.22} fontWeight="700" fill="#1D2330">{Math.round(pct * 100)}%</text>
    </svg>
  );
}

function vehicleUsefulLife(v, defaultUsefulLife) {
  const override = num(v.usefulLifeOverride);
  return override > 0 ? override : num(defaultUsefulLife) || 4;

function requiredMonthlyIncome(v, defaultUsefulLife) {
  const life = vehicleUsefulLife(v, defaultUsefulLife);
  const pv = num(v.purchaseValue);
  return life > 0 ? pv / (life * 12) : 0;
}
function vehicleRoiStats(v, rangeMonths, vehicleRevenue, defaultUsefulLife) {
  let total = 0, monthsWithData = 0;
  rangeMonths.forEach(p => {
    const val = (vehicleRevenue[p] || {})[v.id];
    if (val !== undefined && val !== '') { total += num(val); monthsWithData++; }
  });
  const avgMonthly = monthsWithData ? total / monthsWithData : 0;
  const required = requiredMonthlyIncome(v, defaultUsefulLife);
  const coverage = required > 0 ? avgMonthly / required : null;
  let verdict = 'No Benchmark';
  if (coverage !== null) verdict = coverage >= 1 ? 'Good' : coverage >= 0.8 ? 'Marginal' : 'Underperforming';
  return { total, monthsWithData, avgMonthly, required, coverage, verdict, usefulLife: vehicleUsefulLife(v, defaultUsefulLife) };
}

function vehicleLifetimeStats(v, vehicleRevenue) {
  const purchaseMonth = v.purchaseDate ? v.purchaseDate.slice(0, 7) : null;
  if (!purchaseMonth) return { monthsElapsed: 0, totalIncome: 0 };
  const today = new Date();
  const todayMonth = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
  const cutoffMonth = v.saleDate ? v.saleDate.slice(0, 7) : todayMonth;
  const months = purchaseMonth <= cutoffMonth ? periodsBetween(purchaseMonth, cutoffMonth) : [];
  let totalIncome = 0;
  months.forEach(p => { totalIncome += num((vehicleRevenue[p] || {})[v.id]); });
  return { monthsElapsed: months.length, totalIncome };
}

/* ---------------- Feasibility Study calculations ---------------- */

function calcEMI(principal, annualRatePct, termMonths) {
  // Flat-rate method: Balance (Car Value − Down Payment) + total interest for the whole
  // financing period (annual rate × number of years financed), all divided evenly across
  // the months — not a reducing-balance/amortized calculation.
  const p = num(principal);
  const months = num(termMonths);
  if (!p || !months) return 0;
  const years = months / 12;
  const totalInterest = p * (num(annualRatePct) / 100) * years;
  return (p + totalInterest) / months;
}

/* ---------------- Vehicle Financing ---------------- */

function addMonths(dateStr, delta) {
  const parts = String(dateStr).split('-').map(Number);
  const y = parts[0], m = parts[1], d = parts.length >= 3 ? parts[2] : 1;
  const totalMonths = (m - 1) + delta;
  const targetYear = y + Math.floor(totalMonths / 12);
  const targetMonth = ((totalMonths % 12) + 12) % 12; // 0-based, always positive
  const daysInTargetMonth = new Date(targetYear, targetMonth + 1, 0).getDate();
  const clampedDay = Math.min(d, daysInTargetMonth);
  const mm = String(targetMonth + 1).padStart(2, '0');
  if (parts.length >= 3) return `${targetYear}-${mm}-${String(clampedDay).padStart(2, '0')}`;
  return `${targetYear}-${mm}`;
}

function fullDateLabel(dateStr) {
  if (!dateStr) return '—';
  const parts = String(dateStr).split('-').map(Number);
  if (parts.length < 3) return monthLabel(dateStr); // legacy month-only data
  const [y, m, d] = parts;
  return new Date(y, m - 1, d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function parseFlexibleDate(str) {
  str = String(str || '').trim();
  str = str.split(' ')[0]; // drop any trailing time-of-day (e.g. "13/11/2025 16:45" -> "13/11/2025")
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  if (/^\d{4}-\d{2}$/.test(str)) return str + '-01';
  const m = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); // DD/MM/YYYY
  if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  return str;
}

    interestRate: '', termUnit: 'months', termValue: 36,
    startDate: new Date().toISOString().slice(0, 10),
    schedule: [], deferments: [],
  };
}

function loanAmount(loan) {
  return Math.max(0, num(loan.carValue) - num(loan.downPayment) + (loan.includeFeeInLoan ? num(loan.processingFee) : 0));
}
function loanTermMonths(loan) { return loan.termUnit === 'years' ? num(loan.termValue) * 12 : num(loan.termValue); }

function generateSchedule(loan) {
  const principal = loanAmount(loan);
  const months = loanTermMonths(loan);
  if (!months) return [];
  const years = months / 12;
  const rate = num(loan.interestRate);
  const totalInterest = principal * (rate / 100) * years;
  const monthlyPrincipal = principal / months;
  const monthlyInterest = totalInterest / months;
  const rows = [];
  let principalSum = 0, interestSum = 0;
  for (let i = 1; i <= months; i++) {
    let p = Math.round(monthlyPrincipal * 100) / 100;
    let it = Math.round(monthlyInterest * 100) / 100;
    if (i === months) {
      // last installment absorbs any rounding drift so totals match exactly
      p = Math.round((principal - principalSum) * 100) / 100;
      it = Math.round((totalInterest - interestSum) * 100) / 100;
    }
    principalSum += p; interestSum += it;
    rows.push({
      id: uid('inst'), number: i,
      dueDate: addMonths(loan.startDate, i - 1),
      principal: p,
      interest: it,
      paid: false, paidDate: '',
    });
  }
  return rows;
}

function applyDeferment(schedule, fromNumber, months) {
  return schedule.map(row => row.number >= fromNumber ? { ...row, dueDate: addMonths(row.dueDate, months) } : row);
}

function loanStats(loan) {
  const schedule = loan.schedule || [];
  const totalPrincipal = schedule.reduce((s, r) => s + num(r.principal), 0);
  const totalInterest = schedule.reduce((s, r) => s + num(r.interest), 0);
  const paidRows = schedule.filter(r => r.paid);
  const paidPrincipal = paidRows.reduce((s, r) => s + num(r.principal), 0);
  const paidInterest = paidRows.reduce((s, r) => s + num(r.interest), 0);
  const balancePrincipal = totalPrincipal - paidPrincipal;
  const balanceInterest = totalInterest - paidInterest;
  const unpaid = schedule.filter(r => !r.paid).sort((a, b) => a.number - b.number);
  const nextDue = unpaid[0] || null;
  const payoffDate = schedule.length ? schedule[schedule.length - 1].dueDate : null;
  const today = new Date().toISOString().slice(0, 10);
  const overdue = !!(nextDue && nextDue.dueDate < today);
  const monthlyEMI = schedule.length ? (num(schedule[0].principal) + num(schedule[0].interest)) : 0;
  const totalAmount = totalPrincipal + totalInterest;
  const paidAmount = paidPrincipal + paidInterest;
  const balanceAmount = totalAmount - paidAmount;
  const paidPct = totalAmount ? paidAmount / totalAmount : 0;
  const principalPaidPct = totalPrincipal ? paidPrincipal / totalPrincipal : 0;
  const interestPaidPct = totalInterest ? paidInterest / totalInterest : 0;
  const installmentsPaid = paidRows.length;
  const installmentsTotal = schedule.length;
  return { totalPrincipal, totalInterest, paidPrincipal, paidInterest, balancePrincipal, balanceInterest, nextDue, payoffDate, overdue, monthlyEMI, totalAmount, paidAmount, balanceAmount, paidPct, principalPaidPct, interestPaidPct, installmentsPaid, installmentsTotal };
}

function computeFeasibility(study) {
  const netAmount = num(study.totalPrice) - num(study.downPayment);
  const years = num(study.usefulLifeYears) || 1;
  const months = years * 12;
  const workingDaysMonth = num(study.workingDaysPerMonth) || 22;
  const totalWorkingDays = workingDaysMonth * months;
  const annualExpenseTotal = (study.costLines || []).reduce((s, c) => s + num(c.annualAmount), 0);
  const lifeExpenseTotal = annualExpenseTotal * years;
  const costBase = netAmount + lifeExpenseTotal;
  const profitTotal = (num(study.profitPercent) / 100) * costBase * years;
  const grandTotal = costBase + profitTotal;
  const requiredDailyRate = totalWorkingDays ? grandTotal / totalWorkingDays : 0;
  const emi = calcEMI(netAmount, study.loanInterestRate, num(study.loanTermMonths) || months);
  const scenarios = [1, 0.75, 0.5].map(occ => {
    const days = occ * workingDaysMonth;
    return { occPct: occ, days, requiredAmount: days * requiredDailyRate, marketAmount: days * num(study.marketDailyRate) };
  });
  const marketRate = num(study.marketDailyRate);
  const gapPct = requiredDailyRate ? (marketRate - requiredDailyRate) / requiredDailyRate : null;
  const verdict = !marketRate ? 'No Market Rate Set' : marketRate >= requiredDailyRate ? 'Feasible' : (marketRate >= requiredDailyRate * 0.9 ? 'Marginal' : 'Not Feasible');
  return { netAmount, months, workingDaysMonth, totalWorkingDays, annualExpenseTotal, lifeExpenseTotal, costBase, profitTotal, grandTotal, requiredDailyRate, emi, scenarios, gapPct, verdict };
}

function fmtCompact(v) {

  const abs = Math.abs(n);
  if (abs >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (abs >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';

}

function niceAxisMax(max) {
  if (max <= 0) return 1;
  const magnitude = Math.pow(10, Math.floor(Math.log10(max)));
  const normalized = max / magnitude;
  let niceNormalized;
  if (normalized <= 1) niceNormalized = 1;
  else if (normalized <= 2) niceNormalized = 2;
  else if (normalized <= 5) niceNormalized = 5;
  else niceNormalized = 10;
  return niceNormalized * magnitude;
}

function GroupedBarChart({ data, series, height = 200 }) {
  const rawMax = Math.max(1, ...data.flatMap(d => series.map(s => Math.abs(d[s.key]) || 0)));
  const niceMax = niceAxisMax(rawMax);
  const gridLines = 4;
  const barWidth = 18;
  const barGap = 4;
  const groupGap = 26;
  const groupWidth = series.length * barWidth + (series.length - 1) * barGap;
  const axisLeft = 52;
  const axisBottom = 26;
  const plotHeight = height;
  const plotWidth = Math.max(240, data.length * (groupWidth + groupGap));
  const totalWidth = axisLeft + plotWidth + 14;
  const totalHeight = plotHeight + axisBottom + 14;

  return (
    <div style={{ overflowX: 'auto' }}>
      <svg width={totalWidth} height={totalHeight} style={{ minWidth: totalWidth }}>
        {Array.from({ length: gridLines + 1 }).map((_, gi) => {
          const val = (niceMax / gridLines) * gi;
          const y = plotHeight - (val / niceMax) * plotHeight + 8;
          return (
            <g key={gi}>
              <line x1={axisLeft} y1={y} x2={totalWidth - 4} y2={y} stroke="#E2E4DE" strokeWidth="1" />
              <text x={axisLeft - 8} y={y + 3.5} fontSize="10" fill="#6B7380" textAnchor="end">{fmtCompact(val)}</text>
            </g>
          );
        })}
        {data.map((d, i) => {
          const groupX = axisLeft + i * (groupWidth + groupGap) + groupGap / 2;
          return (
            <g key={i}>
              {series.map((s, j) => {
                const v = Math.abs(d[s.key]) || 0;
                const barH = v > 0 ? Math.max(1.5, (v / niceMax) * plotHeight) : 0;
                const barX = groupX + j * (barWidth + barGap);
                const barY = plotHeight - barH + 8;
                return (
                  <g key={j}>
                    <rect x={barX} y={barY} width={barWidth} height={barH} fill={s.color} rx="2" />
                    {v > 0 && <text x={barX + barWidth / 2} y={barY - 4} fontSize="8.5" fill="#4E5D78" textAnchor="middle">{fmtCompact(v)}</text>}
                  </g>
                );
              })}
              <text x={groupX + groupWidth / 2} y={plotHeight + 22} fontSize="10" fill="#6B7380" textAnchor="middle">{d.label}</text>
            </g>
          );
        })}
      </svg>
      <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginTop: 4, fontSize: 11, color: 'var(--muted)' }}>
        {series.map((s, i) => (
          <span key={i} style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
            <span style={{ display: 'inline-block', width: 10, height: 10, borderRadius: 2, background: s.color }} /> {s.label}
          </span>
        ))}
      </div>
    </div>
  );
}

function HBarList({ data, maxVal }) {
  const max = maxVal || Math.max(1, ...data.map(d => d.value));
  return (
    <div>
      {data.map((d, i) => (
        <div className="hbar-row" key={i}>
          <div className="hbar-name" title={d.name}>{d.name}</div>
          <div className="hbar-track"><div className="hbar-fill" style={{ width: (d.value / max * 100) + '%', background: d.color || '#2D6E8E' }} /></div>
          <div className="hbar-val">{d.display !== undefined ? d.display : d.value}</div>
        </div>
      ))}
    </div>
  );
}

function LineTrendSVG({ data, series, width = 640, height = 240 }) {
  const allVals = data.flatMap(d => series.map(s => d[s.key] || 0));
  const rawMax = Math.max(...allVals, 0);
  const rawMin = Math.min(...allVals, 0);
  const niceMax = niceAxisMax(Math.max(Math.abs(rawMax), Math.abs(rawMin), 1));
  const max = rawMax >= 0 ? niceMax : 0;
  const min = rawMin < 0 ? -niceMax : 0;
  const range = (max - min) || 1;
  const n = Math.max(data.length - 1, 1);
  const axisLeft = 54;
  const axisBottom = 26;
  const plotW = width - axisLeft - 14;
  const plotH = height - axisBottom - 10;
  const toXY = (i, v) => [axisLeft + (i / n) * plotW, 10 + plotH - ((v - min) / range) * plotH];
  const gridLines = 4;
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`} style={{ overflow: 'visible' }}>
      {Array.from({ length: gridLines + 1 }).map((_, gi) => {
        const val = min + (range / gridLines) * gi;
        const y = 10 + plotH - ((val - min) / range) * plotH;
        return (
          <g key={gi}>
            <line x1={axisLeft} y1={y} x2={width - 6} y2={y} stroke="#E9EBE5" strokeWidth="1" />
            <text x={axisLeft - 8} y={y + 3.5} fontSize="10" fill="#6B7380" textAnchor="end">{fmtCompact(val)}</text>
          </g>
        );
      })}
      {series.map((s, si) => {
        const pts = data.map((d, i) => toXY(i, d[s.key] || 0).join(',')).join(' ');
        return <polyline key={si} points={pts} fill="none" stroke={s.color} strokeWidth={s.dashed ? 2 : 3} strokeDasharray={s.dashed ? '5,4' : '0'} strokeLinejoin="round" strokeLinecap="round" />;
      })}
      {!series.some(s => s.dashed) && data.map((d, i) => series.map((s, si) => {
        const [x, y] = toXY(i, d[s.key] || 0);
        return <circle key={si + '-' + i} cx={x} cy={y} r="3" fill={s.color} />;
      }))}
      {data.map((d, i) => {
        const [x] = toXY(i, 0);
        return <text key={i} x={x} y={height - 4} fontSize="10" fill="#6B7380" textAnchor="middle">{d.label}</text>;
      })}
    </svg>
  );
}

  useEffect(() => {

    const nextOcc = { ...occupancy };
    const nextRev = { ...vehicleRevenue };
    Object.keys(agg).forEach(period => {
      Object.keys(agg[period]).forEach(vehicleId => {

        const roundedRevenue = Math.round(revenue * 100) / 100;
        if (num((nextOcc[period] || {})[vehicleId]) !== roundedDays) {
          nextOcc[period] = { ...(nextOcc[period] || {}), [vehicleId]: roundedDays };
          occChanged = true;
        }
        if (num((nextRev[period] || {})[vehicleId]) !== roundedRevenue) {

    // since monthlyData is keyed by item id, not by position.
    const defaults = defaultLineItems();
    setLineItems(prev => {
      const next = {};
      Object.keys(prev).forEach(sec => {
        const defaultLabels = (defaults[sec] || []).map(d => d.label.toLowerCase().trim());
        const matched = [];

        prev[sec].forEach(item => {
          const idx = defaultLabels.indexOf(String(item.label).toLowerCase().trim());

        matched.sort((a, b) => a.idx - b.idx);
        next[sec] = [...matched.map(m => m.item), ...custom];

        if (data.monthlyRemarks) setMonthlyRemarks(data.monthlyRemarks);
        if (data.users) setUsers(data.users);
        if (data.adminNotes) setAdminNotes(data.adminNotes);
        if (data.insurancePolicies) setInsurancePolicies(data.insurancePolicies);
        if (data.insuranceOverrides) setInsuranceOverrides(data.insuranceOverrides);
        if (data.personalLoans) setPersonalLoans(data.personalLoans);
        if (data.personalCards) setPersonalCards(data.personalCards);
        if (data.dashboardWidgets) setDashboardWidgets(data.dashboardWidgets);
        if (data.agreements) setAgreements(data.agreements);
        if (data.agreementPeriod) setAgreementPeriod(data.agreementPeriod);
        if (data.lastAgreementReview) setLastAgreementReview(data.lastAgreementReview);
        window.alert('Backup restored successfully.');
      } catch (e) {
        window.alert('Could not read this file — make sure it is a backup .json file downloaded from this app.');
      }
    };

  function exportExcelCumulative() {
    const wb = XLSX.utils.book_new();
    const totals = rangeAggregate(rangeMonths, monthlyData, lineItems);

    const summaryRows = [
      ['Company', companyName], ['Period', rangeMonths.map(monthLabel).join(', ')], [],
      ['Metric', 'Budget', 'Actual', 'Variance'],
      ['Total Income', totals.income_budget, totals.income_actual, totals.income_actual - totals.income_budget],
      ['Total Direct Expenses', totals.direct_budget, totals.direct_actual, totals.direct_budget - totals.direct_actual],
      ['Gross Profit', totals.gross_budget, totals.gross_actual, totals.gross_actual - totals.gross_budget],
      ['Total Indirect Expenses', totals.indirect_budget, totals.indirect_actual, totals.indirect_budget - totals.indirect_actual],
      ['EBITDA', totals.ebitda_budget, totals.ebitda_actual, totals.ebitda_actual - totals.ebitda_budget],
      ['Total Interest & Bank Charges', totals.interest_budget, totals.interest_actual, totals.interest_budget - totals.interest_actual],
      ['Net Profit', totals.netprofit_budget, totals.netprofit_actual, totals.netprofit_actual - totals.netprofit_budget],
      ['Gross Margin %', pctStr(totals.grossPct_budget), pctStr(totals.grossPct_actual), ''],
      ['Net Margin %', pctStr(totals.netPct_budget), pctStr(totals.netPct_actual), ''],
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'Summary');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildPnlDetailRows(rangeMonths, lineItems, monthlyData)), 'PnL Detail');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildOccMatrixRows(rangeMonths, vehicles, occupancy, baseDays)), 'Occupancy Matrix');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildOccDistributionRows(rangeMonths, vehicles, occupancy, baseDays)), 'Occupancy Distribution');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildRoiRows(vehicles, rangeMonths, vehicleRevenue, defaultUsefulLife)), 'Vehicle ROI');

    if (feasibilityStudies.length) {
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildFeasibilityRows(feasibilityStudies)), 'Feasibility Studies');
    }
    if (loans.length) {
      const { summaryRows: loanSummaryRows, scheduleRows: loanScheduleRows } = buildLoanRows(loans);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(loanSummaryRows), 'Loan Summary');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(loanScheduleRows), 'Loan Schedules');
    }

    XLSX.writeFile(wb, `${companyName.replace(/[^a-z0-9]+/gi, '-')}-cumulative-report-${reportFrom}_to_${reportTo}.xlsx`);
  }

    ? `To cover total costs and expenses of ${fmt(c.costBase, currency)} and achieve your target profit, this vehicle must generate ${fmt(c.grandTotal, currency)} over its useful life — a minimum daily rate of ${fmt(c.requiredDailyRate, currency)} is needed to hit that goal.`
    : 'No Total Price/Useful Life set for this study.';
  return (
    <div style={{ padding: 24 }}>
      <PrintHeader companyName={companyName} logoDataUrl={logoDataUrl} subtitle={`Feasibility Study — ${study.name || '(unnamed)'}`} />
      <table style={{ border: '1px solid #ccc', marginBottom: 14 }}>
        <tbody>
          <tr><td style={{ border: '1px solid #ccc' }}>Total Price</td><td style={{ border: '1px solid #ccc' }} className="num">{fmt(study.totalPrice, currency)}</td>
              <td style={{ border: '1px solid #ccc' }}>Down Payment</td><td style={{ border: '1px solid #ccc' }} className="num">{fmt(study.downPayment, currency)}</td></tr>
          <tr><td style={{ border: '1px solid #ccc' }}>Useful Life</td><td style={{ border: '1px solid #ccc' }} className="num">{study.usefulLifeYears || 1} yrs</td>

        </tbody>
      </table>
      <table style={{ border: '1px solid #ccc', marginBottom: 14 }}>
        <thead><tr>{['Cost Line', 'Annual Amount', 'Total over Life'].map(h => <th key={h} style={{ border: '1px solid #ccc' }}>{h}</th>)}</tr></thead>
        <tbody>
          {(study.costLines || []).map(cl => (
            <tr key={cl.id}><td style={{ border: '1px solid #ccc' }}>{cl.label}</td><td style={{ border: '1px solid #ccc' }} className="num">{fmt(cl.annualAmount, currency)}</td><td style={{ border: '1px solid #ccc' }} className="num">{fmt(num(cl.annualAmount) * (num(study.usefulLifeYears) || 1), currency)}</td></tr>

        <div className="kpi-card"><div className="label">Grand Total (Required Revenue)</div><div className="value mono">{fmt(c.grandTotal, currency)}</div></div>
        <div className="kpi-card"><div className="label">Required Daily Rate</div><div className="value mono">{fmt(c.requiredDailyRate, currency)}</div></div>
        <div className="kpi-card"><div className="label">Market Daily Rate</div><div className="value mono">{study.marketDailyRate ? fmt(study.marketDailyRate, currency) : '—'}</div></div>
      </div>
      <table style={{ border: '1px solid #ccc', marginTop: 14 }}>
        <thead><tr>{['Occupancy', 'Days/Month', 'Required Monthly Income', 'At Market Rate'].map(h => <th key={h} style={{ border: '1px solid #ccc' }}>{h}</th>)}</tr></thead>
        <tbody>
          {c.scenarios.map((s, i) => (
            <tr key={i}><td style={{ border: '1px solid #ccc' }}>{(s.occPct * 100).toFixed(0)}%</td><td style={{ border: '1px solid #ccc' }} className="num">{s.days}</td><td style={{ border: '1px solid #ccc' }} className="num">{fmt(s.requiredAmount, currency)}</td><td style={{ border: '1px solid #ccc' }} className="num">{study.marketDailyRate ? fmt(s.marketAmount, currency) : '—'}</td></tr>

function FinancingPrintReport({ loans, currency, companyName, logoDataUrl }) {

    acc.interestBalance += s.balanceInterest;
    acc.totalFinanced += s.totalAmount;
    acc.totalPaid += s.paidAmount;
    return acc;
  }, { principalBalance: 0, interestBalance: 0, totalFinanced: 0, totalPaid: 0 });
  const fleetPaidPct = fleetTotals.totalFinanced ? fleetTotals.totalPaid / fleetTotals.totalFinanced : 0;
  const barData = loans.map(l => { const s = loanStats(l); return { label: l.modelName || '(unnamed)', total: s.totalAmount, paid: s.paidAmount }; });

  return (
    <div style={{ padding: 24 }}>
      <PrintHeader companyName={companyName} logoDataUrl={logoDataUrl} subtitle={`Vehicle Financing Overview — ${loans.map(l => l.modelName || '(unnamed)').join(', ') || 'No cars selected'}`} />

      <div className="kpi-row">

        <div className="kpi-card"><div className="label">Total Paid</div><div className="value mono" style={{ color: 'var(--green)' }}>{fmt(fleetTotals.totalPaid, currency)}</div></div>
        <div className="kpi-card"><div className="label">Total Balance</div><div className="value mono">{fmt(fleetTotals.principalBalance + fleetTotals.interestBalance, currency)}</div></div>
        <div className="kpi-card"><div className="label">Total Interest Remaining</div><div className="value mono">{fmt(fleetTotals.interestBalance, currency)}</div></div>
      </div>

      <div className="grid-2">
        <div className="panel" style={{ textAlign: 'center' }}>
          <h3>Overall Paid %</h3>
          <DonutGauge pct={fleetPaidPct} color={fleetPaidPct >= 1 ? '#3E9C6E' : '#2D6E8E'} />
        </div>
        <div className="panel">
          <h3>Loan Amount vs Paid, by Vehicle</h3>
          <GroupedBarChart data={barData} series={[{ key: 'total', label: 'Loan Amount', color: '#D9C8B9' }, { key: 'paid', label: 'Paid', color: '#2D6E8E' }]} height={160} />
        </div>
      </div>

      <table style={{ border: '1px solid #ccc' }}>
        <thead><tr>{['Vehicle', 'Loan Amount', 'Paid', 'Balance', 'Interest Balance', '% Paid'].map(h => <th key={h} style={{ border: '1px solid #ccc' }}>{h}</th>)}</tr></thead>
        <tbody>
          {loans.map(l => {
            const s = loanStats(l);
            return (
              <tr key={l.id}>
                <td style={{ border: '1px solid #ccc' }}>{l.modelName}</td>
                <td style={{ border: '1px solid #ccc' }} className="num">{fmt(s.totalAmount, currency)}</td>
                <td style={{ border: '1px solid #ccc' }} className="num">{fmt(s.paidAmount, currency)}</td>
                <td style={{ border: '1px solid #ccc' }} className="num">{fmt(s.balanceAmount, currency)}</td>
                <td style={{ border: '1px solid #ccc' }} className="num">{fmt(s.balanceInterest, currency)}</td>
                <td style={{ border: '1px solid #ccc' }} className="num">{pctStr(s.paidPct)}</td>
              </tr>
            );
          })}
          {loans.length === 0 && <tr><td colSpan={6} style={{ border: '1px solid #ccc', textAlign: 'center', color: 'var(--muted)' }}>No loans added yet.</td></tr>}
        </tbody>
      </table>
    </div>
  );
}

function MonthNavigator({ period, setPeriod }) {
  function shift(delta) {
    const [y, m] = period.split('-').map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    setPeriod(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 16, padding: '6px 0' }}>
      <button className="btn" onClick={() => shift(-1)} title="Previous month">◀ Back</button>
      <div style={{ textAlign: 'center', minWidth: 160 }}>
        <div style={{ fontSize: 21, fontWeight: 700, color: 'var(--navy)', letterSpacing: '0.01em' }}>{monthLabel(period)}</div>
        <input type="month" value={period} onChange={e => setPeriod(e.target.value)} style={{ marginTop: 4 }} />
      </div>
      <button className="btn" onClick={() => shift(1)} title="Next month">Next ▶</button>
    </div>
  );
}

function KpiCard({ label, value, sub, diff, rawValue, signColor }) {
  const valueStyle = signColor ? { fontWeight: 700, color: rawValue >= 0 ? '#1E5AA8' : '#C1503F' } : undefined;
  return (
    <div className="kpi-card">
      <div className="label">{label}</div>
      <div className="value mono" style={valueStyle}>{value}</div>
      <div className={`sub ${diff >= 0 ? 'pos' : 'neg'}`}>{diff >= 0 ? '▲' : '▼'} {sub}</div>
    </div>
  );
}
