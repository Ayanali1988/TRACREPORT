/* ---------------- Vehicle Financing ---------------- */

function FinancingPanel({ loans, setLoans, vehicles, currency, deletePin, onPrintLoan, selectedLoanIds, onToggleLoanSelect, onSelectAllLoans, onSelectOnlyLoan }) {
  const [selectedId, setSelectedId] = useState(loans[0] ? loans[0].id : null);

  // When the Report Selection chips narrow down to exactly one car, show that same car's
  // full detail below — otherwise clicking a chip filters the table but leaves whichever
  // loan was previously open showing, which looks like a mismatch/glitch.
  useEffect(() => {
    if (selectedLoanIds.length === 1) {
      setSelectedId(selectedLoanIds[0]);
    }
  }, [selectedLoanIds]);

  function addLoan() {
    const l = emptyLoan();
    setLoans([...loans, l]);
    setSelectedId(l.id);
    onSelectOnlyLoan(l.id);
  }
  function deleteLoan(loan) {
    if (!confirmDelete(loan.modelName || 'this loan', deletePin)) return;
    setLoans(loans.filter(l => l.id !== loan.id));
    if (selectedId === loan.id) setSelectedId(null);
  }
  function updateLoan(id, patch) {
    setLoans(loans.map(l => l.id === id ? { ...l, ...patch } : l));
  }

  const selected = loans.find(l => l.id === selectedId);
  const displayLoans = selectedLoanIds.length ? loans.filter(l => selectedLoanIds.includes(l.id)) : loans;

  const fleetTotals = displayLoans.reduce((acc, l) => {
    const s = loanStats(l);
    acc.principalBalance += s.balancePrincipal;
    acc.interestBalance += s.balanceInterest;
    acc.monthlyEMI += s.monthlyEMI;
    acc.totalFinanced += s.totalAmount;
    acc.totalPaid += s.paidAmount;
    if (s.overdue) acc.overdueCount++;
    return acc;
  }, { principalBalance: 0, interestBalance: 0, monthlyEMI: 0, overdueCount: 0, totalFinanced: 0, totalPaid: 0 });
  const fleetPaidPct = fleetTotals.totalFinanced ? fleetTotals.totalPaid / fleetTotals.totalFinanced : 0;

  const isSingleCarView = selectedLoanIds.length === 1;
  const aggStats = displayLoans.reduce((acc, l) => {
    const s = loanStats(l);
    acc.totalPrincipal += s.totalPrincipal;
    acc.totalInterest += s.totalInterest;
    acc.paidPrincipal += s.paidPrincipal;
    acc.paidInterest += s.paidInterest;
    acc.totalAmount += s.totalAmount;
    acc.paidAmount += s.paidAmount;
    return acc;
  }, { totalPrincipal: 0, totalInterest: 0, paidPrincipal: 0, paidInterest: 0, totalAmount: 0, paidAmount: 0 });
  const aggPaidPct = aggStats.totalAmount ? aggStats.paidAmount / aggStats.totalAmount : 0;

  return (
    <div>
      {loans.length > 0 && (
        <div className="panel">
          <h3>Report Selection <span style={{ fontWeight: 400, color: 'var(--muted)', fontSize: 12, textTransform: 'none' }}>— filters this whole tab (totals, chart, table) and what Export Excel / Export PDF include</span></h3>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <div className={`chip ${selectedLoanIds.length === 0 ? 'selected' : ''}`} onClick={onSelectAllLoans}>All Cars</div>
            {loans.map(l => (
              <div key={l.id} className={`chip ${selectedLoanIds.includes(l.id) ? 'selected' : ''}`} onClick={() => onToggleLoanSelect(l.id)}>{l.modelName || '(unnamed)'}</div>
            ))}
          </div>
        </div>
      )}

      <div className="kpi-row">
        <div className="kpi-card"><div className="label">Total Loan Amount (Payable)</div><div className="value mono">{fmt(fleetTotals.totalFinanced, currency)}</div></div>
        <div className="kpi-card"><div className="label">Total Paid</div><div className="value mono" style={{ color: 'var(--green)' }}>{fmt(fleetTotals.totalPaid, currency)}</div><div className="sub" style={{ color: 'var(--muted)' }}>{pctStr(fleetPaidPct)} of total</div></div>
        <div className="kpi-card"><div className="label">Total Remaining</div><div className="value mono">{fmt(fleetTotals.principalBalance + fleetTotals.interestBalance, currency)}</div></div>
        <div className="kpi-card"><div className="label">Total Interest</div><div className="value mono">{fmt(fleetTotals.interestBalance, currency)}</div><div className="sub" style={{ color: 'var(--muted)' }}>remaining, of {fmt(displayLoans.reduce((a, l) => a + loanStats(l).totalInterest, 0), currency)} total</div></div>
        <div className="kpi-card"><div className="label">Overdue Loans</div><div className="value mono" style={{ color: fleetTotals.overdueCount ? 'var(--red)' : 'var(--ink)' }}>{fleetTotals.overdueCount}</div></div>
      </div>

      {displayLoans.length > 0 && (
        <div className="panel">
          <h3>Payment Progress by Vehicle</h3>
          <HBarList data={displayLoans.map(l => { const s = loanStats(l); return { name: l.modelName || '(unnamed)', value: Math.round(s.paidPct * 100), display: pctStr(s.paidPct) + ' · ' + fmt(s.paidAmount, currency), color: s.paidPct >= 1 ? '#3E9C6E' : '#2D6E8E' }; })} maxVal={100} />
        </div>
      )}

      <div className="panel">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
          <h3 style={{ margin: 0 }}>Vehicle Loans {selectedLoanIds.length > 0 ? `(${displayLoans.length} of ${loans.length} shown)` : ''}</h3>
          <button className="btn primary" onClick={addLoan}>+ Add Loan</button>
        </div>
        {loans.length === 0 ? (
          <p style={{ color: 'var(--muted)', fontSize: 13 }}>Add a loan for each financed vehicle — enter the car value, down payment, interest rate, fees, and term, then generate the payment schedule.</p>
        ) : (
          <table>
            <thead><tr><th>Vehicle</th><th>Lender</th><th className="num">Loan Amount</th><th className="num">Monthly EMI</th><th className="num">Paid</th><th className="num">Principal Balance</th><th className="num">Interest Balance</th><th>Next Due</th><th></th></tr></thead>
            <tbody>
              {displayLoans.map(l => {
                const s = loanStats(l);
                return (
                  <tr key={l.id} style={{ background: l.id === selectedId ? '#EFF4F1' : undefined, cursor: 'pointer' }} onClick={() => { setSelectedId(l.id); onSelectOnlyLoan(l.id); }}>
                    <td>{l.modelName || '(unnamed)'}</td>
                    <td>{l.lender || '—'}</td>
                    <td className="num">{fmt(loanAmount(l), currency)}</td>
                    <td className="num">{fmt(s.monthlyEMI, currency)}</td>
                    <td className="num">{pctStr(s.paidPct)}</td>
                    <td className="num">{fmt(s.balancePrincipal, currency)}</td>
                    <td className="num">{fmt(s.balanceInterest, currency)}</td>
                    <td>{s.nextDue ? <span className={`badge ${s.overdue ? 'neg' : 'pos'}`}>{fullDateLabel(s.nextDue.dueDate)}{s.overdue ? ' overdue' : ''}</span> : <span className="badge pos">Paid off</span>}</td>
                    <td style={{ textAlign: 'right' }}><button className="icon-btn" onClick={e => { e.stopPropagation(); deleteLoan(l); }}>✕</button></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {isSingleCarView && selected ? (
        <FinancingDetail loan={selected} vehicles={vehicles} onChange={patch => updateLoan(selected.id, patch)} currency={currency} onPrint={() => onPrintLoan(selected.id)} deletePin={deletePin} />
      ) : displayLoans.length > 0 ? (
        <>
          <div className="panel">
            <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: 0 }}>
              {displayLoans.length} cars selected — showing combined figures below. Individual loan details, schedules, and the defer/paid tools are only shown when exactly one car is selected in Report Selection above, to avoid mixing up separate loans.
            </p>
          </div>
          <div className="grid-2">
            <div className="panel" style={{ textAlign: 'center' }}>
              <h3>Combined Payment Progress</h3>
              <DonutGauge pct={aggPaidPct} color={aggPaidPct >= 1 ? '#3E9C6E' : '#2D6E8E'} />
              <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: 8 }}>across {displayLoans.length} selected car{displayLoans.length > 1 ? 's' : ''}</p>
            </div>
            <div className="panel">
              <h3>Combined Total vs Paid</h3>
              <GroupedBarChart data={[
                { label: 'Principal', total: aggStats.totalPrincipal, paid: aggStats.paidPrincipal },
                { label: 'Interest', total: aggStats.totalInterest, paid: aggStats.paidInterest },
                { label: 'Total', total: aggStats.totalAmount, paid: aggStats.paidAmount },
              ]} series={[{ key: 'total', label: 'Total', color: '#D9C8B9' }, { key: 'paid', label: 'Paid', color: '#2D6E8E' }]} height={160} />
            </div>
          </div>
        </>
      ) : null}
    </div>
  );
}

function FinancingDetail({ loan, vehicles, onChange, currency, onPrint, deletePin }) {
  const stats = loanStats(loan);
  const [deferFrom, setDeferFrom] = useState(stats.nextDue ? stats.nextDue.number : 1);
  const [deferMonths, setDeferMonths] = useState(1);
  const [bulkText, setBulkText] = useState('');
  const [markPaidUpTo, setMarkPaidUpTo] = useState('');
  const [showDetails, setShowDetails] = useState(loan.schedule.length === 0);
  const [showImport, setShowImport] = useState(false);

  function regenerate() {
    if (loan.schedule.some(r => r.paid) && !confirmDelete('this loan\'s ENTIRE schedule, including its paid installment history', deletePin)) return;
    onChange({ schedule: generateSchedule(loan) });
  }

  function updateRow(id, field, value) {
    onChange({ schedule: loan.schedule.map(r => r.id === id ? { ...r, [field]: value } : r) });
  }
  function togglePaid(id) {
    onChange({
      schedule: loan.schedule.map(r => r.id === id ? { ...r, paid: !r.paid, paidDate: !r.paid ? new Date().toISOString().slice(0, 10) : '' } : r)
    });
  }

  function applyDefer() {
    const fromN = num(deferFrom);
    const months = num(deferMonths);
    if (!fromN || !months) return;
    const newSchedule = applyDeferment(loan.schedule, fromN, months);
    const newDeferments = [...(loan.deferments || []), { id: uid('def'), fromNumber: fromN, months, appliedOn: new Date().toISOString().slice(0, 10) }];
    onChange({ schedule: newSchedule, deferments: newDeferments });
  }

  function markPaidThrough() {
    if (!markPaidUpTo) return;
    onChange({ schedule: loan.schedule.map(r => r.dueDate.slice(0, 7) <= markPaidUpTo ? { ...r, paid: true, paidDate: r.paidDate || r.dueDate } : r) });
  }

  function applyBulk() {
    if (loan.schedule.some(r => r.paid) && !confirmDelete('this loan\'s ENTIRE schedule, including its paid installment history', deletePin)) return;
    const parseAmt = (v) => {
      if (v === undefined || v === null) return 0;
      let s = String(v).trim();
      if (!s || s === '-' || s === '—') return 0;
      let neg = false;
      if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
      s = s.replace(/,/g, '').replace(/[^0-9.\-]/g, '');
      if (!s) return 0;
      const n = parseFloat(s);
      if (isNaN(n)) return 0;
      return neg ? -Math.abs(n) : n;
    };
    const lines = bulkText.split('\n').map(l => l.replace(/\r$/, '')).filter(l => l.trim() !== '');
    const rows = lines.map(line => {
      // Prefer splitting on tabs (how Excel/Sheets pastes columns) so commas inside
      // numbers like "4,923.88" are never mistaken for a column separator.
      const parts = (line.includes('\t') ? line.split('\t') : line.split(',')).map(p => p.trim());
      let number, dateStr, principal, interest, paid = false;
      if (parts.length >= 9) {
        // Inst No, Due Date, Principal Amount, Profit Amount, Total EMI, Payable, Paid, Balance, Status
        number = parts[0]; dateStr = parts[1]; principal = parseAmt(parts[2]); interest = parseAmt(parts[3]);
        const paidAmt = parseAmt(parts[6]);
        const statusText = String(parts[8] || '').trim().toLowerCase();
        paid = statusText === 'paid' || paidAmt > 0;
      } else if (parts.length >= 6) {
        // Bank format: Inst.No, Date, EMI, Principal Balance, Principal Component, Profit/Interest Component, [Rate]
        number = parts[0]; dateStr = parts[1]; principal = parseAmt(parts[4]); interest = parseAmt(parts[5]);
      } else {
        // Simple format: Number, Date, Principal, Interest
        number = parts[0]; dateStr = parts[1]; principal = parseAmt(parts[2]); interest = parseAmt(parts[3]);
      }
      const dueDate = parseFlexibleDate(dateStr);
      return { id: uid('inst'), number: num(number), dueDate, principal, interest, paid, paidDate: paid ? dueDate : '' };
    }).filter(r => r.number).sort((a, b) => a.number - b.number);
    onChange({ schedule: rows });
    setBulkText('');
  }

  return (
    <div>
      <div className="panel">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <h3 style={{ margin: 0 }}>Loan Details {!showDetails && <span style={{ fontWeight: 400, color: 'var(--muted)', fontSize: 12, textTransform: 'none' }}>— {loan.modelName || '(unnamed)'}, {fmt(loanAmount(loan), currency)} at {loan.interestRate || 0}%</span>}</h3>
          <button className="btn small" onClick={() => setShowDetails(!showDetails)}>{showDetails ? 'Hide' : 'Edit Loan Details'}</button>
        </div>
        {showDetails && (
        <>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginTop: 12 }}>
          <div className="field" style={{ flex: '1 1 180px' }}><label>Vehicle / Model</label><input value={loan.modelName} onChange={e => onChange({ modelName: e.target.value })} placeholder="Nissan Patrol" /></div>
          <div className="field" style={{ flex: '1 1 160px' }}><label>Link to Fleet Vehicle (optional)</label>
            <select value={loan.vehicleId} onChange={e => onChange({ vehicleId: e.target.value })}>
              <option value="">— not linked —</option>
              {vehicles.map(v => <option key={v.id} value={v.id}>{v.name} ({v.plate})</option>)}
            </select>
          </div>
          <div className="field" style={{ flex: '1 1 160px' }}><label>Lender / Bank</label><input value={loan.lender} onChange={e => onChange({ lender: e.target.value })} /></div>
        </div>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginTop: 10 }}>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Car Value ({currency})</label><input type="number" value={loan.carValue} onChange={e => onChange({ carValue: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Down Payment ({currency})</label><input type="number" value={loan.downPayment} onChange={e => onChange({ downPayment: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Processing / Other Fee</label><input type="number" value={loan.processingFee} onChange={e => onChange({ processingFee: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 160px', display: 'flex', alignItems: 'flex-end', gap: 6 }}>
            <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12.5 }}>
              <input type="checkbox" checked={loan.includeFeeInLoan} onChange={e => onChange({ includeFeeInLoan: e.target.checked })} /> Finance fee into loan
            </label>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginTop: 10 }}>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Interest Rate % / Year</label><input type="number" value={loan.interestRate} onChange={e => onChange({ interestRate: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 100px' }}><label>Term</label><input type="number" value={loan.termValue} onChange={e => onChange({ termValue: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 110px' }}><label>Unit</label>
            <select value={loan.termUnit} onChange={e => onChange({ termUnit: e.target.value })}>
              <option value="months">Months</option>
              <option value="years">Years</option>
            </select>
          </div>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Start Date (exact auto-debit day)</label><input type="date" value={loan.startDate && loan.startDate.length === 7 ? loan.startDate + '-01' : loan.startDate} onChange={e => onChange({ startDate: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Loan Amount</label><input disabled value={fmt(loanAmount(loan), currency)} /></div>
        </div>

        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginTop: 10, background: '#F7F8F5', border: '1px solid var(--line)', borderRadius: 8, padding: 12 }}>
          <div style={{ flex: '1 1 160px' }}>
            <div style={{ fontSize: 11, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.04em' }}>Estimated Monthly EMI</div>
            <div className="mono" style={{ fontSize: 18 }}>{fmt(calcEMI(loanAmount(loan), loan.interestRate, loanTermMonths(loan)), currency)}</div>
          </div>
          <div style={{ flex: '1 1 200px' }}>
            <div style={{ fontSize: 11, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.04em' }}>Estimated Total Payable (Loan + Interest)</div>
            <div className="mono" style={{ fontSize: 18 }}>{fmt(calcEMI(loanAmount(loan), loan.interestRate, loanTermMonths(loan)) * loanTermMonths(loan), currency)}</div>
          </div>
          <div style={{ fontSize: 11.5, color: 'var(--muted)', alignSelf: 'flex-end' }}>= (Loan Amount + Interest Rate × Years Financed) ÷ months. Generate the schedule below for exact figures.</div>
        </div>

        <button className="btn primary" style={{ marginTop: 10 }} onClick={regenerate}>{loan.schedule.length ? 'Regenerate Schedule' : 'Generate Schedule'}</button>
        </>
        )}
      </div>

      {loan.schedule.length > 0 && (
        <>
          <div className="kpi-row">
            <div className="kpi-card"><div className="label">Monthly EMI</div><div className="value mono">{fmt(stats.monthlyEMI, currency)}</div></div>
            <div className="kpi-card"><div className="label">Total Payable (Loan + Interest)</div><div className="value mono">{fmt(stats.totalAmount, currency)}</div></div>
            <div className="kpi-card"><div className="label">Principal Balance</div><div className="value mono">{fmt(stats.balancePrincipal, currency)}</div></div>
            <div className="kpi-card"><div className="label">Interest Balance</div><div className="value mono">{fmt(stats.balanceInterest, currency)}</div></div>
            <div className="kpi-card"><div className="label">Payoff Date</div><div className="value mono" style={{ fontSize: 18 }}>{stats.payoffDate ? fullDateLabel(stats.payoffDate) : '—'}</div></div>
            {stats.overdue && <div className="kpi-card" style={{ borderLeft: '4px solid var(--red)' }}><div className="label">Status</div><div className="value mono" style={{ color: 'var(--red)', fontSize: 16 }}>Overdue</div></div>}
          </div>

          <div className="grid-2">
            <div className="panel" style={{ textAlign: 'center' }}>
              <h3>Payment Progress</h3>
              <DonutGauge pct={stats.paidPct} color={stats.paidPct >= 1 ? '#3E9C6E' : '#2D6E8E'} />
              <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: 8 }}>{stats.installmentsPaid} of {stats.installmentsTotal} installments paid</p>
            </div>
            <div className="panel">
              <h3>Total vs Paid</h3>
              <GroupedBarChart data={[
                { label: 'Principal', total: stats.totalPrincipal, paid: stats.paidPrincipal },
                { label: 'Interest', total: stats.totalInterest, paid: stats.paidInterest },
                { label: 'Total', total: stats.totalAmount, paid: stats.paidAmount },
              ]} series={[{ key: 'total', label: 'Total', color: '#D9C8B9' }, { key: 'paid', label: 'Paid', color: '#2D6E8E' }]} height={160} />
            </div>
          </div>

          <div className="panel">
            <table>
              <thead><tr><th>Category</th><th className="num">Total</th><th className="num">Paid</th><th className="num">Balance</th><th className="num">% Paid</th></tr></thead>
              <tbody>
                <tr><td>Principal</td><td className="num">{fmt(stats.totalPrincipal, currency)}</td><td className="num">{fmt(stats.paidPrincipal, currency)}</td><td className="num">{fmt(stats.balancePrincipal, currency)}</td><td className="num">{pctStr(stats.principalPaidPct)}</td></tr>
                <tr><td>Interest</td><td className="num">{fmt(stats.totalInterest, currency)}</td><td className="num">{fmt(stats.paidInterest, currency)}</td><td className="num">{fmt(stats.balanceInterest, currency)}</td><td className="num">{pctStr(stats.interestPaidPct)}</td></tr>
                <tr className="net-row"><td>Total</td><td className="num">{fmt(stats.totalAmount, currency)}</td><td className="num">{fmt(stats.paidAmount, currency)}</td><td className="num">{fmt(stats.balanceAmount, currency)}</td><td className="num">{pctStr(stats.paidPct)}</td></tr>
              </tbody>
            </table>
          </div>

          <div className="panel">
            <h3>Defer / Postpone Payment</h3>
            <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -6 }}>Push a due date forward — e.g. a 2-month deferment shifts that installment and every one after it two months later (payoff date moves out too).</p>
            <div style={{ display: 'flex', gap: 10, alignItems: 'flex-end', flexWrap: 'wrap' }}>
              <div className="field"><label>Defer from installment #</label><input type="number" min="1" value={deferFrom} onChange={e => setDeferFrom(e.target.value)} style={{ width: 100 }} /></div>
              <div className="field"><label>Months to defer</label><input type="number" min="1" value={deferMonths} onChange={e => setDeferMonths(e.target.value)} style={{ width: 100 }} /></div>
              <button className="btn primary" onClick={applyDefer}>Apply Deferment</button>
            </div>
            {loan.deferments && loan.deferments.length > 0 && (
              <div style={{ marginTop: 10 }}>
                {loan.deferments.map(d => (
                  <div key={d.id} style={{ fontSize: 12, color: 'var(--muted)' }}>• Deferred {d.months} month{d.months > 1 ? 's' : ''} starting from installment #{d.fromNumber} — applied {d.appliedOn}</div>
                ))}
              </div>
            )}
          </div>

          <div className="panel">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10, flexWrap: 'wrap', gap: 10 }}>
              <h3 style={{ margin: 0 }}>Payment Schedule</h3>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                <span style={{ fontSize: 12, color: 'var(--muted)' }}>Mark all installments due through</span>
                <input type="month" value={markPaidUpTo} onChange={e => setMarkPaidUpTo(e.target.value)} style={{ padding: '4px 8px', border: '1px solid var(--line)', borderRadius: 5, fontSize: 12.5 }} />
                <button className="btn small" onClick={markPaidThrough}>as Paid</button>
                <button className="btn small" onClick={onPrint}>🖨 Print Schedule</button>
              </div>
            </div>
            <div style={{ maxHeight: 420, overflowY: 'auto' }}>
              <table>
                <thead><tr><th>#</th><th>Due Date</th><th className="num">Principal</th><th className="num">Interest</th><th className="num">Total</th><th>Paid</th><th>Paid Date</th></tr></thead>
                <tbody>
                  {loan.schedule.map(r => (
                    <tr key={r.id} style={{ background: !r.paid && r.dueDate < new Date().toISOString().slice(0, 10) ? '#FDEDEC' : undefined }}>
                      <td>{r.number}</td>
                      <td><input type="date" value={r.dueDate && r.dueDate.length === 7 ? r.dueDate + '-01' : r.dueDate} onChange={e => updateRow(r.id, 'dueDate', e.target.value)} style={{ width: 130 }} /></td>
                      <td className="num"><input type="number" value={r.principal} onChange={e => updateRow(r.id, 'principal', e.target.value)} /></td>
                      <td className="num"><input type="number" value={r.interest} onChange={e => updateRow(r.id, 'interest', e.target.value)} /></td>
                      <td className="num">{fmt(num(r.principal) + num(r.interest), currency)}</td>
                      <td><input type="checkbox" checked={r.paid} onChange={() => togglePaid(r.id)} /></td>
                      <td>
                        {r.paid ? (
                          <input type="date" value={r.paidDate && r.paidDate.length === 7 ? r.paidDate + '-01' : r.paidDate} onChange={e => updateRow(r.id, 'paidDate', e.target.value)} style={{ width: 130 }} />
                        ) : '—'}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </>
      )}

      <div className="panel">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <h3 style={{ margin: 0 }}>Import / Paste Your Own Schedule</h3>
          <button className="btn small" onClick={() => setShowImport(!showImport)}>{showImport ? 'Hide' : 'Import / Paste Schedule'}</button>
        </div>
        {showImport && (
          <>
            <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: 10 }}>Copy the rows straight out of your bank's spreadsheet (including a "Status"/"Paid" column if it has one) and paste them below — no need to reformat dates or retype anything. This replaces the schedule above entirely. Supported layouts, auto-detected:</p>
            <ul style={{ fontSize: 12, color: 'var(--muted)', marginTop: -4, paddingLeft: 18 }}>
              <li><code>Inst No, Due Date, Principal, Profit, Total EMI, Payable, Paid, Balance, Status</code> — paid status is read from the Status/Paid columns automatically</li>
              <li><code>Inst No, Date, EMI, Principal Balance, Principal, Profit, Rate</code></li>
              <li><code>Number, Date, Principal, Interest</code></li>
            </ul>
            <textarea value={bulkText} onChange={e => setBulkText(e.target.value)} rows={4}
              style={{ width: '100%', border: '1px solid var(--line)', borderRadius: 6, padding: 8, fontSize: 12.5, boxSizing: 'border-box', fontFamily: 'Roboto Mono, monospace' }}
              placeholder={"1, 2026-08, 5200.00, 1030.05\n2, 2026-09, 5240.85, 989.21"} />
            <button className="btn primary" style={{ marginTop: 8 }} onClick={applyBulk}>Replace Schedule with Pasted Data</button>
          </>
        )}
      </div>
    </div>
  );
}

function VehiclesPanel({ vehicles, setVehicles, deletePin, currency }) {
  const [form, setForm] = useState({ name: '', plate: '', category: '', color: '', purchaseValue: '', usefulLifeOverride: '', purchaseDate: '', registrationExpiry: '', ownershipType: 'owned', investorCommissionPct: '', investorName: '' });
  const [bulkText, setBulkText] = useState('');
  const [search, setSearch] = useState('');
  const [editId, setEditId] = useState(null);
  const [saleModalId, setSaleModalId] = useState(null);
  const [saleDateInput, setSaleDateInput] = useState('');
  const [saleValueInput, setSaleValueInput] = useState('');
  const CATEGORY_PRESETS = ['Economy Cars', 'Luxury Cars', 'Small Cars', 'Office Use Cars'];
  const emptyForm = { name: '', plate: '', category: '', color: '', purchaseValue: '', usefulLifeOverride: '', purchaseDate: '', registrationExpiry: '', ownershipType: 'owned', investorCommissionPct: '', investorName: '' };

  function addVehicle() {
    if (!form.name.trim()) return;
    if (editId) {
      setVehicles(vehicles.map(v => v.id === editId ? { ...v, ...form } : v));
      setEditId(null);
    } else {
      setVehicles([...vehicles, { id: uid('veh'), ...form }]);
    }
    setForm(emptyForm);
  }
  function editVehicle(v) { setEditId(v.id); setForm({ name: v.name, plate: v.plate, category: v.category || '', color: v.color || '', purchaseValue: v.purchaseValue || '', usefulLifeOverride: v.usefulLifeOverride || '', purchaseDate: v.purchaseDate || '', registrationExpiry: v.registrationExpiry || '', ownershipType: v.ownershipType || 'owned', investorCommissionPct: v.investorCommissionPct || '', investorName: v.investorName || '' }); }
  function deleteVehicle(v) { if (!confirmDelete(v.name, deletePin)) return; setVehicles(vehicles.filter(x => x.id !== v.id)); }
  function bulkAdd() {
    const lines = bulkText.split('\n').map(l => l.trim()).filter(Boolean);
    const nv = lines.map(line => { const parts = line.split(',').map(p => p.trim()); return { id: uid('veh'), name: parts[0] || 'Unnamed', plate: parts[1] || '', category: parts[2] || '', purchaseValue: parts[3] || '', color: '' }; });
    setVehicles([...vehicles, ...nv]); setBulkText('');
  }
  function openSaleModal(v) { setSaleModalId(v.id); setSaleDateInput(todayStr()); setSaleValueInput(''); }
  function confirmSale() {
    if (!saleDateInput || !saleValueInput) { window.alert('Both Sale Date and Sale Value are required.'); return; }
    if (!confirmDelete('this vehicle as SOLD (marks it Inactive going forward)', deletePin)) return;
    setVehicles(vehicles.map(v => v.id === saleModalId ? { ...v, saleDate: saleDateInput, saleValue: saleValueInput } : v));
    setSaleModalId(null);
  }
  function reactivateVehicle(v) {
    if (!confirmDelete('reversing the sale — this vehicle becomes Active again', deletePin)) return;
    setVehicles(vehicles.map(x => x.id === v.id ? { ...x, saleDate: '', saleValue: '' } : x));
  }
  const filtered = vehicles.filter(v => !search || v.name.toLowerCase().includes(search.toLowerCase()) || v.plate.toLowerCase().includes(search.toLowerCase()));

  return (
    <div>
      {saleModalId && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center' }} onClick={() => setSaleModalId(null)}>
          <div className="panel" style={{ width: 360, background: '#fff' }} onClick={e => e.stopPropagation()}>
            <h3>Mark Vehicle as Sold</h3>
            <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -6 }}>Both fields are required — this gives a complete purchase-to-sale history.</p>
            <div className="field"><label>Sale Date</label><input type="date" value={saleDateInput} onChange={e => setSaleDateInput(e.target.value)} /></div>
            <div className="field"><label>Sale Value ({currency})</label><input type="number" value={saleValueInput} onChange={e => setSaleValueInput(e.target.value)} /></div>
            <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
              <button className="btn primary" onClick={confirmSale}>Confirm Sale</button>
              <button className="btn" onClick={() => setSaleModalId(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}
      <div className="panel">
        <h3>{editId ? 'Edit Vehicle' : 'Add Vehicle'}</h3>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <div className="field" style={{ flex: '1 1 160px' }}><label>Model / Vehicle Name</label><input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Nissan Sunny" /></div>
          <div className="field" style={{ flex: '1 1 120px' }}><label>Plate</label><input value={form.plate} onChange={e => setForm({ ...form, plate: e.target.value })} placeholder="9182-G" /></div>
          <div className="field" style={{ flex: '1 1 160px' }}>
            <label>Category</label>
            <input value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} placeholder="Economy Cars" list="category-presets" />
            <datalist id="category-presets">{CATEGORY_PRESETS.map(c => <option key={c} value={c} />)}</datalist>
          </div>
          <div className="field" style={{ flex: '1 1 130px' }}>
            <label>Car Color</label>
            <select value={form.color} onChange={e => setForm({ ...form, color: e.target.value })}>
              <option value="">Select color…</option>
              {CAR_COLOR_OPTIONS.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Purchase Value ({currency})</label><input type="number" value={form.purchaseValue} onChange={e => setForm({ ...form, purchaseValue: e.target.value })} placeholder="50000" /></div>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Useful Life Override (yrs, optional)</label><input type="number" value={form.usefulLifeOverride} onChange={e => setForm({ ...form, usefulLifeOverride: e.target.value })} placeholder="uses 4-yr default" /></div>
          <div className="field" style={{ flex: '1 1 150px' }}><label>Purchase Date</label><input type="date" value={form.purchaseDate} onChange={e => setForm({ ...form, purchaseDate: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 150px' }}><label>Registration Expiry</label><input type="date" value={form.registrationExpiry} onChange={e => setForm({ ...form, registrationExpiry: e.target.value })} /></div>
        </div>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginTop: 10, background: '#F7F8F5', border: '1px solid var(--line)', borderRadius: 8, padding: 10 }}>
          <div className="field" style={{ flex: '1 1 160px' }}>
            <label>Ownership Type</label>
            <select value={form.ownershipType} onChange={e => setForm({ ...form, ownershipType: e.target.value })}>
              <option value="owned">Owned</option>
              <option value="sublease">Sub-Lease (borrowed)</option>
              <option value="investor">Investor Vehicle</option>
            </select>
          </div>
          {form.ownershipType === 'investor' && (
            <>
              <div className="field" style={{ flex: '1 1 140px' }}><label>Company Commission %</label><input type="number" value={form.investorCommissionPct} onChange={e => setForm({ ...form, investorCommissionPct: e.target.value })} placeholder="20-30" /></div>
              <div className="field" style={{ flex: '1 1 160px' }}><label>Investor Name / Contact</label><input value={form.investorName} onChange={e => setForm({ ...form, investorName: e.target.value })} /></div>
            </>
          )}
        </div>
        <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
          <button className="btn primary" onClick={addVehicle}>{editId ? 'Update Vehicle' : '+ Add Vehicle'}</button>
          {editId && <button className="btn" onClick={() => { setEditId(null); setForm(emptyForm); }}>Cancel</button>}
        </div>
      </div>
      <div className="panel">
        <h3>Bulk Add</h3>
        <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -4 }}>One vehicle per line: <code>Name, Plate, Category (optional), Purchase Value (optional)</code> — chart color defaults to steel blue; edit individually to customize.</p>
        <textarea value={bulkText} onChange={e => setBulkText(e.target.value)} rows={5} style={{ width: '100%', border: '1px solid var(--line)', borderRadius: 6, padding: 8, fontSize: 13, boxSizing: 'border-box', fontFamily: 'Roboto Mono, monospace' }} placeholder={"Nissan Sunny, 9182-G, Economy Cars, 45000\nGMC Yukon, 9185-G, Luxury Cars, 120000"} />
        <button className="btn primary" style={{ marginTop: 10 }} onClick={bulkAdd}>+ Add All</button>
      </div>
      <div className="panel">
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 10 }}>
          <h3 style={{ margin: 0 }}>Fleet ({vehicles.length})</h3>
          <input placeholder="Search" value={search} onChange={e => setSearch(e.target.value)} style={{ border: '1px solid var(--line)', borderRadius: 7, padding: '5px 10px', fontSize: 12.5 }} />
        </div>
        <table>
          <thead><tr><th>Model / Name</th><th>Plate</th><th>Category</th><th>Ownership</th><th>Color</th><th>Status</th><th className="num">Purchase Value</th><th className="num">Useful Life</th><th></th></tr></thead>
          <tbody>
            {filtered.map(v => {
              const isSold = !!v.saleDate;
              return (
              <tr key={v.id} style={isSold ? { opacity: 0.7 } : undefined}>
                <td>{v.name}</td><td>{v.plate}</td><td>{v.category || '—'}</td>
                <td>{v.ownershipType === 'sublease' ? <span className="badge" style={{ background: '#F2F3F0', color: 'var(--muted)' }}>Sub-Lease</span> : v.ownershipType === 'investor' ? <span className="badge" style={{ background: '#FFF6E8', color: 'var(--amber)' }}>Investor</span> : <span className="badge" style={{ background: '#EFF4F1', color: 'var(--green)' }}>Owned</span>}</td>
                <td><span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}><span style={{ display: 'inline-block', width: 14, height: 14, borderRadius: 4, background: v.color ? carColorHex(v.color) : '#e5e5e5', border: '1px solid var(--line)' }} />{v.color || '—'}</span></td>
                <td>
                  {isSold
                    ? <span className="badge neg" title={`Sold ${v.saleDate} for ${fmt(v.saleValue, currency)}`}>Sold</span>
                    : <span className="badge pos">Active</span>}
                </td>
                <td className="num">{v.purchaseValue ? num(v.purchaseValue).toLocaleString('en-US') : '—'}</td>
                <td className="num">{v.usefulLifeOverride ? v.usefulLifeOverride + ' yrs' : '4 yrs (default)'}</td>
                <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                  <button className="icon-btn" onClick={() => editVehicle(v)}>✎</button>{' '}
                  {isSold
                    ? <button className="icon-btn" title="Reactivate" onClick={() => reactivateVehicle(v)}>↺</button>
                    : <button className="icon-btn" title="Mark as Sold" onClick={() => openSaleModal(v)}>$</button>}{' '}
                  <button className="icon-btn" onClick={() => deleteVehicle(v)}>✕</button>
                </td>
              </tr>
              );
            })}
            {filtered.length === 0 && <tr><td colSpan={8} style={{ textAlign: 'center', color: 'var(--muted)', padding: 20 }}>No vehicles yet.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function addMonthsToDate(dateStr, delta) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const target = new Date(y, m - 1 + delta, d);
  return target.getFullYear() + '-' + String(target.getMonth() + 1).padStart(2, '0') + '-' + String(target.getDate()).padStart(2, '0');
}

function addDaysToDate(dateStr, days) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const target = new Date(y, m - 1, d + days);
  return target.getFullYear() + '-' + String(target.getMonth() + 1).padStart(2, '0') + '-' + String(target.getDate()).padStart(2, '0');
}

function PersonalFinancePanel({ loans, setLoans, cards, setCards, currency, deletePin }) {
  const [tab, setTab] = useState('loans');
  const [selectedLoanId, setSelectedLoanId] = useState(loans[0] ? loans[0].id : null);
  const [selectedCardId, setSelectedCardId] = useState(cards[0] ? cards[0].id : null);

  function addLoan() {
    const l = emptyLoan();
    l.modelName = 'New Personal Loan';
    setLoans([...loans, l]);
    setSelectedLoanId(l.id);
  }
  function deleteLoan(loan) { if (!confirmDelete(loan.modelName || 'this loan', deletePin)) return; setLoans(loans.filter(l => l.id !== loan.id)); if (selectedLoanId === loan.id) setSelectedLoanId(null); }
  function updateLoan(id, patch) { setLoans(loans.map(l => l.id === id ? { ...l, ...patch } : l)); }

  function addCard() {
    const c = { id: uid('card'), name: 'New Credit Card', creditLimit: '', entries: [] };
    setCards([...cards, c]);
    setSelectedCardId(c.id);
  }
  function deleteCard(card) { if (!confirmDelete(card.name, deletePin)) return; setCards(cards.filter(c => c.id !== card.id)); if (selectedCardId === card.id) setSelectedCardId(null); }
  function updateCard(id, patch) { setCards(cards.map(c => c.id === id ? { ...c, ...patch } : c)); }

  const selectedLoan = loans.find(l => l.id === selectedLoanId);
  const selectedCard = cards.find(c => c.id === selectedCardId);

  return (
    <div>
      <div className="panel">
        <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: 0 }}>Your own personal credit cards and loans — kept entirely separate from the business's Vehicle Financing, visible only to Admin.</p>
        <div style={{ display: 'flex', gap: 8 }}>
          <div className={`chip ${tab === 'loans' ? 'selected' : ''}`} onClick={() => setTab('loans')}>Personal Loans</div>
          <div className={`chip ${tab === 'cards' ? 'selected' : ''}`} onClick={() => setTab('cards')}>Credit Cards</div>
        </div>
      </div>

      {tab === 'loans' && (
        <>
          <div className="panel">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
              <h3 style={{ margin: 0 }}>Personal Loans</h3>
              <button className="btn primary" onClick={addLoan}>+ Add Loan</button>
            </div>
            {loans.length === 0 ? <p style={{ color: 'var(--muted)', fontSize: 13 }}>No personal loans added yet.</p> : (
              <table>
                <thead><tr><th>Description</th><th>Lender</th><th className="num">Loan Amount</th><th className="num">Monthly EMI</th><th className="num">Paid</th><th></th></tr></thead>
                <tbody>
                  {loans.map(l => {
                    const s = loanStats(l);
                    return (
                      <tr key={l.id} style={{ background: l.id === selectedLoanId ? '#EFF4F1' : undefined, cursor: 'pointer' }} onClick={() => setSelectedLoanId(l.id)}>
                        <td>{l.modelName}</td><td>{l.lender || '—'}</td>
                        <td className="num">{fmt(loanAmount(l), currency)}</td>
                        <td className="num">{fmt(s.monthlyEMI, currency)}</td>
                        <td className="num">{pctStr(s.paidPct)}</td>
                        <td style={{ textAlign: 'right' }}><button className="icon-btn" onClick={e => { e.stopPropagation(); deleteLoan(l); }}>✕</button></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
          </div>
          {selectedLoan && <FinancingDetail loan={selectedLoan} vehicles={[]} onChange={patch => updateLoan(selectedLoan.id, patch)} currency={currency} deletePin={deletePin} />}
        </>
      )}

      {tab === 'cards' && (
        <>
          <div className="panel">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
              <h3 style={{ margin: 0 }}>Credit Cards</h3>
              <button className="btn primary" onClick={addCard}>+ Add Card</button>
            </div>
            {cards.length === 0 ? <p style={{ color: 'var(--muted)', fontSize: 13 }}>No credit cards added yet.</p> : (
              <table>
                <thead><tr><th>Card</th><th className="num">Credit Limit</th><th className="num">Current Balance</th><th className="num">Available</th><th></th></tr></thead>
                <tbody>
                  {cards.map(c => {
                    const balance = (c.entries || []).reduce((a, e) => a + num(e.charge) - num(e.payment), 0);
                    return (
                      <tr key={c.id} style={{ background: c.id === selectedCardId ? '#EFF4F1' : undefined, cursor: 'pointer' }} onClick={() => setSelectedCardId(c.id)}>
                        <td>{c.name}</td>
                        <td className="num">{fmt(c.creditLimit, currency)}</td>
                        <td className="num">{fmt(balance, currency)}</td>
                        <td className="num">{fmt(num(c.creditLimit) - balance, currency)}</td>
                        <td style={{ textAlign: 'right' }}><button className="icon-btn" onClick={e => { e.stopPropagation(); deleteCard(c); }}>✕</button></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
          </div>
          {selectedCard && <CreditCardDetail card={selectedCard} onChange={patch => updateCard(selectedCard.id, patch)} currency={currency} deletePin={deletePin} />}
        </>
      )}
    </div>
  );
}

function CreditCardDetail({ card, onChange, currency, deletePin }) {
  const [entryDate, setEntryDate] = useState(todayStr());
  const [entryCharge, setEntryCharge] = useState('');
  const [entryPayment, setEntryPayment] = useState('');
  const [entryNote, setEntryNote] = useState('');

  const entries = card.entries || [];
  const balance = entries.reduce((a, e) => a + num(e.charge) - num(e.payment), 0);
  const available = num(card.creditLimit) - balance;
  const utilizationPct = num(card.creditLimit) ? balance / num(card.creditLimit) : 0;

  function addEntry() {
    if (!entryCharge && !entryPayment) return;
    onChange({ entries: [...entries, { id: uid('cce'), date: entryDate, charge: entryCharge, payment: entryPayment, note: entryNote }] });
    setEntryCharge(''); setEntryPayment(''); setEntryNote('');
  }
  function deleteEntry(id) {
    if (!confirmDelete('this entry', deletePin)) return;
    onChange({ entries: entries.filter(e => e.id !== id) });
  }

  return (
    <div>
      <div className="panel">
        <h3>Card Details</h3>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
          <div className="field" style={{ flex: '1 1 200px' }}><label>Card Name</label><input value={card.name} onChange={e => onChange({ name: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 160px' }}><label>Credit Limit ({currency})</label><input type="number" value={card.creditLimit} onChange={e => onChange({ creditLimit: e.target.value })} /></div>
        </div>
        <div className="kpi-row" style={{ marginTop: 14 }}>
          <div className="kpi-card"><div className="label">Current Balance</div><div className="value mono">{fmt(balance, currency)}</div></div>
          <div className="kpi-card"><div className="label">Available Credit</div><div className="value mono">{fmt(available, currency)}</div></div>
          <div className="kpi-card"><div className="label">Utilization</div><div className="value mono" style={{ color: utilizationPct > 0.7 ? 'var(--red)' : 'var(--ink)' }}>{pctStr(utilizationPct)}</div></div>
        </div>
        <div className="panel" style={{ marginTop: 10, background: '#F7F8F5' }}>
          <HBarList data={[{ name: 'Utilization', value: Math.round(utilizationPct * 100), display: pctStr(utilizationPct), color: utilizationPct > 0.9 ? '#C1503F' : utilizationPct > 0.7 ? '#D98E3F' : '#3E9C6E' }]} maxVal={100} />
        </div>
      </div>

      <div className="panel">
        <h3>Add Charge / Payment</h3>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Date</label><input type="date" value={entryDate} onChange={e => setEntryDate(e.target.value)} /></div>
          <div className="field" style={{ flex: '1 1 120px' }}><label>Charge ({currency})</label><input type="number" value={entryCharge} onChange={e => setEntryCharge(e.target.value)} /></div>
          <div className="field" style={{ flex: '1 1 120px' }}><label>Payment ({currency})</label><input type="number" value={entryPayment} onChange={e => setEntryPayment(e.target.value)} /></div>
          <div className="field" style={{ flex: '1 1 160px' }}><label>Note</label><input value={entryNote} onChange={e => setEntryNote(e.target.value)} /></div>
        </div>
        <button className="btn primary" style={{ marginTop: 8 }} onClick={addEntry}>+ Add Entry</button>
      </div>

      <div className="panel">
        <h3>History</h3>
        <table>
          <thead><tr><th>Date</th><th>Note</th><th className="num">Charge</th><th className="num">Payment</th><th></th></tr></thead>
          <tbody>
            {entries.slice().sort((a, b) => b.date.localeCompare(a.date)).map(e => (
              <tr key={e.id}>
                <td>{e.date}</td><td>{e.note || '—'}</td>
                <td className="num">{e.charge ? fmt(e.charge, currency) : '—'}</td>
                <td className="num">{e.payment ? fmt(e.payment, currency) : '—'}</td>
                <td style={{ textAlign: 'right' }}><button className="icon-btn" onClick={() => deleteEntry(e.id)}>✕</button></td>
              </tr>
            ))}
            {entries.length === 0 && <tr><td colSpan={5} style={{ textAlign: 'center', color: 'var(--muted)', padding: 14 }}>No entries yet.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function InvestorsFleetPanel({ vehicles, vehicleRevenue, rangeMonths, currency }) {
  const investorVehicles = vehicles.filter(v => v.ownershipType === 'investor');

  const rows = investorVehicles.map(v => {
    let revenue = 0;
    rangeMonths.forEach(p => { revenue += num((vehicleRevenue[p] || {})[v.id]); });
    const commissionPct = num(v.investorCommissionPct) / 100;
    const commission = revenue * commissionPct;
    const payout = revenue - commission;
    return { v, revenue, commission, payout };
  });
  const totals = rows.reduce((a, r) => ({ revenue: a.revenue + r.revenue, commission: a.commission + r.commission, payout: a.payout + r.payout }), { revenue: 0, commission: 0, payout: 0 });

  if (investorVehicles.length === 0) {
    return <div className="empty-state"><h2>No Investor Vehicles yet</h2><p>Mark a vehicle's Ownership Type as "Investor Vehicle" in the Vehicles tab, with a Commission % and investor name, to see it here.</p></div>;
  }

  return (
    <div>
      <div className="kpi-row">
        <div className="kpi-card"><div className="label">Total Revenue (Investor Cars)</div><div className="value mono">{fmt(totals.revenue, currency)}</div></div>
        <div className="kpi-card"><div className="label">Company's Commission</div><div className="value mono">{fmt(totals.commission, currency)}</div></div>
        <div className="kpi-card"><div className="label">Investors' Payout</div><div className="value mono">{fmt(totals.payout, currency)}</div></div>
      </div>
      <div className="panel" style={{ overflowX: 'auto' }}>
        <h3>Investors Fleet — {rangeMonths.map(monthLabel).join(' – ')}</h3>
        <table>
          <thead><tr><th>Vehicle</th><th>Investor</th><th className="num">Commission %</th><th className="num">Total Revenue</th><th className="num">Company's Commission</th><th className="num">Investor's Payout</th></tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.v.id}>
                <td>{r.v.name} ({r.v.plate})</td>
                <td>{r.v.investorName || '—'}</td>
                <td className="num">{r.v.investorCommissionPct || 0}%</td>
                <td className="num">{fmt(r.revenue, currency)}</td>
                <td className="num">{fmt(r.commission, currency)}</td>
                <td className="num">{fmt(r.payout, currency)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function FleetDataReportPanel({ vehicles, setVehicles, insurancePolicies, setInsurancePolicies, currency }) {
  const today = todayStr();

  function latestPolicyFor(vehicleId) {
    const list = insurancePolicies.filter(p => p.vehicleId === vehicleId).sort((a, b) => (b.endDate || '').localeCompare(a.endDate || ''));
    return list[0] || null;
  }

  function statusFor(regExpiry, insExpiry) {
    const dates = [regExpiry, insExpiry].filter(Boolean);
    if (dates.length === 0) return { label: 'No Data', color: '#6B7380' };
    const earliest = dates.sort()[0];
    const daysUntil = Math.round((new Date(earliest) - new Date(today)) / 86400000);
    if (daysUntil < 0) return { label: 'Expired', color: '#C1503F' };
    if (daysUntil <= 30) return { label: 'Expiring Next Month', color: '#D98E3F' };
    return { label: 'Ok', color: '#3E9C6E' };
  }

  function renewVehicle(v) {
    const latest = latestPolicyFor(v.id);
    const newInsuranceStart = latest && latest.endDate ? addDaysToDate(latest.endDate, 1) : today;
    const newInsuranceEnd = addMonthsToDate(newInsuranceStart, 13);
    const newRegExpiry = v.registrationExpiry ? addMonthsToDate(v.registrationExpiry, 12) : addMonthsToDate(today, 12);
    setInsurancePolicies([...insurancePolicies, { id: uid('ins'), vehicleId: v.id, vehicleValue: '', premiumAmount: '', startDate: newInsuranceStart, endDate: newInsuranceEnd }]);
    setVehicles(vehicles.map(x => x.id === v.id ? { ...x, registrationExpiry: newRegExpiry } : x));
    window.alert(`Renewed. New Registration Expiry: ${newRegExpiry}. New Insurance Policy created for ${newInsuranceStart} to ${newInsuranceEnd} — both dates are editable if the actual renewal differs slightly. Vehicle Value and Premium are left blank on purpose: go to Insurance Policies and enter this year's insured value and premium (they typically change year to year as the car ages), rather than carrying forward last year's figures.`);
  }

  const rows = vehicles.map((v, i) => {
    const latest = latestPolicyFor(v.id);
    const insExpiry = latest ? latest.endDate : '';
    const monthsCovered = latest && latest.startDate && latest.endDate ? periodsBetween(latest.startDate.slice(0, 7), latest.endDate.slice(0, 7)).length : 0;
    const monthlyPremium = latest ? num(latest.premiumAmount) / (monthsCovered || 1) : 0;
    const status = statusFor(v.registrationExpiry, insExpiry);
    const regExpired = v.registrationExpiry && v.registrationExpiry < today;
    return { sno: i + 1, v, insExpiry, premium: latest ? latest.premiumAmount : '', monthlyPremium, status, regExpired };
  });

  return (
    <div>
      <div className="panel" style={{ overflowX: 'auto' }}>
        <h3>Fleet Data Report / Vehicle Information Summary</h3>
        <table>
          <thead><tr><th>S.No</th><th>Car</th><th>Category</th><th>Color</th><th>Registration Expiry</th><th>Insurance Expiry</th><th className="num">Insurance Premium</th><th className="num">Monthly Premium</th><th>Status</th><th></th></tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.v.id}>
                <td>{r.sno}</td>
                <td>{r.v.name} ({r.v.plate})</td>
                <td>{r.v.category || '—'}</td>
                <td>{r.v.color || '—'}</td>
                <td>{r.v.registrationExpiry || '—'}</td>
                <td>{r.insExpiry || '—'}</td>
                <td className="num">{r.premium ? fmt(r.premium, currency) : '—'}</td>
                <td className="num">{r.monthlyPremium ? fmt(r.monthlyPremium, currency) : '—'}</td>
                <td>
                  <span className="badge" style={{ background: r.status.color + '20', color: r.status.color, fontWeight: r.status.label !== 'Ok' ? 700 : 400, animation: r.status.label === 'Expired' ? 'pulse 1.5s infinite' : 'none' }}>{r.status.label}</span>
                </td>
                <td>{r.regExpired && <button className="btn small primary" onClick={() => renewVehicle(r.v)}>Renew Vehicle</button>}</td>
              </tr>
            ))}
            {rows.length === 0 && <tr><td colSpan={10} style={{ textAlign: 'center', color: 'var(--muted)', padding: 16 }}>No vehicles yet.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function emptyAgreement() {
  return {
    id: uid('agr'), raNumber: '', plate: '', vehicleId: '', customerName: '',
    type: 'daily', startDate: todayStr(), closeDate: '', status: 'open',
    rate: '', daysOverride: '', revenueOverride: '',
    replacementPlate: '', notes: '', parentRaNumber: '',
  };
}

// Given a base RA# (e.g. "15706"), finds the next replacement-chain letter suffix by
// checking which of -A, -B, -C… already exist among the current agreements.
function nextReplacementSuffix(baseRaNumber, agreements) {
  const used = agreements.filter(a => a.parentRaNumber === baseRaNumber).map(a => (a.raNumber || '').slice(baseRaNumber.length + 1));
  for (let i = 0; i < 26; i++) {
    const letter = String.fromCharCode(65 + i);
    if (!used.includes(letter)) return letter;
  }
  return 'X';
}

function AgreementsPanel({ agreements, setAgreements, vehicles, currency, deletePin }) {
  const emptyForm = emptyAgreement();
  const [form, setForm] = useState(emptyForm);
  const [view, setView] = useState('open'); // 'open' | 'all' | 'add' | 'import'
  const [closingId, setClosingId] = useState(null);
  const [closeDateInput, setCloseDateInput] = useState(todayStr());
  const [closeRateInput, setCloseRateInput] = useState('');
  const [closeDaysInput, setCloseDaysInput] = useState('');
  const [closeRevenueInput, setCloseRevenueInput] = useState('');
  const [bulkText, setBulkText] = useState('');
  const [search, setSearch] = useState('');

  function plateStatus(plate, excludeId) {
    const norm = (plate || '').trim().toLowerCase();
    const conflict = agreements.find(a => a.id !== excludeId && a.status === 'open' && (a.plate || '').trim().toLowerCase() === norm);
    return conflict;
  }

  function addAgreement() {
    if (!form.plate || !form.startDate || !form.rate) { window.alert('Vehicle Plate, Start Date, and Rate are all required.'); return; }
    const conflict = plateStatus(form.plate);
    if (conflict) {
      window.alert(`Cannot add: "${form.plate}" already has an open agreement (RA# ${conflict.raNumber || conflict.id}). Close or resolve that agreement first before opening a new one for the same vehicle.`);
      return;
    }
    const vehicle = findVehicleByPlate(vehicles, form.plate);
    setAgreements([...agreements, { ...form, vehicleId: vehicle ? vehicle.id : '' }]);
    setForm(emptyAgreement());
    setView('open');
  }

  function openCloseModal(a) {
    setClosingId(a.id);
    setCloseDateInput(todayStr());
    setCloseRateInput(a.rate);
    setCloseDaysInput('');
    setCloseRevenueInput('');
  }
  const closingAgreement = agreements.find(a => a.id === closingId);
  const previewDaysReal = closingAgreement ? (() => {
    const start = new Date(closingAgreement.startDate);
    const end = new Date(closeDateInput);
    return Math.max(0, Math.round((end - start) / 86400000) + 1);
  })() : 0;
  const previewDays = closeDaysInput !== '' ? num(closeDaysInput) : previewDaysReal;
  const previewRate = closeRateInput !== '' ? num(closeRateInput) : (closingAgreement ? num(closingAgreement.rate) : 0);
  const previewDailyRate = closingAgreement && closingAgreement.type === 'monthly' ? previewRate / 30 : previewRate;
  // For Monthly agreements, revenue is priced on a standardized 30-day month, so the
  // preview here must use the same 30-day-per-month model that actually gets recorded on
  // save — not the real calendar day count — or this number would silently differ from
  // what shows up afterward in reports.
  const previewRevenue = closeRevenueInput !== '' ? num(closeRevenueInput)
    : closingAgreement && closingAgreement.type === 'monthly' && closeDaysInput === ''
      ? agreementTotalDaysForSplit({ ...closingAgreement, status: 'closed', closeDate: closeDateInput }) * previewDailyRate
      : previewDays * previewDailyRate;

  function confirmClose() {
    setAgreements(agreements.map(a => a.id === closingId ? {
      ...a, status: 'closed', closeDate: closeDateInput, rate: closeRateInput !== '' ? closeRateInput : a.rate,
      daysOverride: closeDaysInput !== '' ? closeDaysInput : '', revenueOverride: closeRevenueInput !== '' ? closeRevenueInput : '',
    } : a));
    setClosingId(null);
  }

  function reopenAgreement(a) {
    if (!confirmDelete('reopening this closed agreement', deletePin)) return;
    setAgreements(agreements.map(x => x.id === a.id ? { ...x, status: 'open', closeDate: '' } : x));
  }
  function voidAgreement(a) {
    if (!confirmDelete(`voiding agreement ${a.raNumber || a.id} (removes it from all occupancy/revenue calculations)`, deletePin)) return;
    setAgreements(agreements.map(x => x.id === a.id ? { ...x, status: 'void' } : x));
  }
  function deleteAgreement(a) {
    if (!confirmDelete(`permanently deleting agreement ${a.raNumber || a.id}`, deletePin)) return;
    setAgreements(agreements.filter(x => x.id !== a.id));
  }

  // Vehicle Replacement: closes the current agreement leg as of the swap date, and opens a
  // linked "-A"/"-B"… sub-agreement for the new vehicle, so occupancy/income for each car
  // is tracked precisely for the days it was actually the one in use.
  const [replacingId, setReplacingId] = useState(null);
  const [replaceDateInput, setReplaceDateInput] = useState(todayStr());
  const [replacePlateInput, setReplacePlateInput] = useState('');
  const [replaceRateInput, setReplaceRateInput] = useState('');
  function openReplaceModal(a) {
    setReplacingId(a.id);
    setReplaceDateInput(todayStr());
    setReplacePlateInput('');
    setReplaceRateInput(a.rate);
  }
  const replacingAgreement = agreements.find(a => a.id === replacingId);
  function confirmReplace() {
    if (!replacePlateInput) { window.alert('Enter the replacement vehicle plate.'); return; }
    const conflict = plateStatus(replacePlateInput);
    if (conflict) { window.alert(`Cannot replace: "${replacePlateInput}" already has an open agreement (RA# ${conflict.raNumber || conflict.id}). Resolve that first.`); return; }
    const baseRa = replacingAgreement.parentRaNumber || replacingAgreement.raNumber || replacingAgreement.id;
    const suffix = nextReplacementSuffix(baseRa, agreements);
    const newVehicle = findVehicleByPlate(vehicles, replacePlateInput);
    const subAgreement = {
      id: uid('agr'), raNumber: `${baseRa}-${suffix}`, parentRaNumber: baseRa,
      plate: replacePlateInput, vehicleId: newVehicle ? newVehicle.id : '',
      customerName: replacingAgreement.customerName, type: replacingAgreement.type,
      startDate: replaceDateInput, closeDate: '', status: 'open',
      rate: replaceRateInput !== '' ? replaceRateInput : replacingAgreement.rate,
      daysOverride: '', revenueOverride: '', replacementPlate: '', notes: `Replacement for ${replacingAgreement.raNumber || replacingAgreement.id}`,
    };
    setAgreements(agreements.map(a => a.id === replacingId ? { ...a, status: 'replaced', closeDate: replaceDateInput } : a).concat(subAgreement));
    setReplacingId(null);
  }

  function parseBulk() {
    const lines = bulkText.split('\n').map(l => l.trim()).filter(Boolean);
    let added = 0, updated = 0, conflicts = [];
    let next = [...agreements];
    lines.forEach(line => {
      const cols = (line.includes('\t') ? line.split('\t') : line.split(',')).map(c => c.trim());
      // Matches your export layout exactly: Agreement No, Type, Vehicle, Permanent Vehicle,
      // Customer, Customer Code, Contact No, Driver, Driver Code, Driver Nationality,
      // Start Date, End Date, Rental Days, Additional Notes, Notes, PO No, Status, Rate,
      // Taxable Amount, VAT, Total Amount.
      const [raNumber, type, plate, , customerName, , , , , , startDateRaw, endDateRaw, , , , , status, rateRaw] = cols;
      if (!plate) return;
      const isOpen = (status || '').trim().toLowerCase() === 'open';
      // Rental Days, Taxable Amount, VAT, and Total Amount are all ignored on purpose: Days
      // is computed fresh from Start/Close so it's never stale, and Rate (net of VAT) is
      // what income is calculated from, never the VAT-inclusive Total.
      const rate = (rateRaw || '').replace(/\/\s*(Month|Day)/i, '').trim();
      const vehicle = findVehicleByPlate(vehicles, plate);
      const parsedAgreement = {
        raNumber: raNumber || '', plate, vehicleId: vehicle ? vehicle.id : '', customerName: customerName || '',
        type: (type || '').toLowerCase().includes('month') ? 'monthly' : 'daily',
        startDate: parseFlexibleDate(startDateRaw) || todayStr(),
        // An End Date is only meaningful once the contract is actually Closed — while a
        // contract is still Open, any End Date present is just an expected/estimated return
        // date, not a real one, so it's ignored entirely.
        closeDate: !isOpen ? parseFlexibleDate(endDateRaw) : '',
        status: isOpen ? 'open' : 'closed',
        rate: rate || '0',
      };
      // Dedup: if this RA# already exists, update it in place rather than adding a duplicate.
      const existingIdx = raNumber ? next.findIndex(a => a.raNumber === raNumber) : -1;
      if (existingIdx >= 0) {
        next[existingIdx] = { ...next[existingIdx], ...parsedAgreement, daysOverride: next[existingIdx].daysOverride, revenueOverride: next[existingIdx].revenueOverride };
        updated++;
        return;
      }
      // Double-booking check: skip (don't import) any new Open agreement for a plate that's
      // already open elsewhere, and flag it for the user to resolve manually.
      if (parsedAgreement.status === 'open') {
        const conflict = next.find(a => a.status === 'open' && (a.plate || '').trim().toLowerCase() === plate.trim().toLowerCase());
        if (conflict) { conflicts.push(`${raNumber || '(no RA#)'} — ${plate} already open under RA# ${conflict.raNumber || conflict.id}`); return; }
      }
      next.push({ ...emptyAgreement(), ...parsedAgreement, daysOverride: '', revenueOverride: '', replacementPlate: '', notes: '', parentRaNumber: '' });
      added++;
    });
    setAgreements(next);
    setBulkText('');
    setView('all');
    window.alert(`Import complete: ${added} added, ${updated} updated (matched by RA#).${conflicts.length ? `\n\nSkipped ${conflicts.length} due to a vehicle already being open elsewhere — resolve and re-paste these:\n` + conflicts.join('\n') : ''}`);
  }

  const openAgreements = agreements.filter(a => a.status === 'open');
  const filtered = agreements.filter(a => !search || (a.raNumber || '').toLowerCase().includes(search.toLowerCase()) || (a.plate || '').toLowerCase().includes(search.toLowerCase()) || (a.customerName || '').toLowerCase().includes(search.toLowerCase()));

  return (
    <div>
      {closingId && closingAgreement && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center' }} onClick={() => setClosingId(null)}>
          <div className="panel" style={{ width: 420, background: '#fff' }} onClick={e => e.stopPropagation()}>
            <h3>Close Agreement — {closingAgreement.raNumber || closingAgreement.plate}</h3>
            <div className="field"><label>Close Date</label><input type="date" value={closeDateInput} onChange={e => setCloseDateInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') confirmClose(); }} /></div>
            <div style={{ display: 'flex', gap: 10 }}>
              <div className="field" style={{ flex: 1 }}><label>Days (auto, editable)</label><input type="number" value={closeDaysInput} onChange={e => setCloseDaysInput(e.target.value)} placeholder={previewDays} /></div>
              <div className="field" style={{ flex: 1 }}><label>Rate ({currency}, editable)</label><input type="number" value={closeRateInput} onChange={e => setCloseRateInput(e.target.value)} /></div>
            </div>
            <div className="field"><label>Total Revenue (auto, editable)</label><input type="number" value={closeRevenueInput} onChange={e => setCloseRevenueInput(e.target.value)} placeholder={previewRevenue.toFixed(2)} /></div>
            <div className="panel" style={{ background: '#F7F8F5', marginTop: 4 }}>
              <p style={{ margin: 0, fontSize: 13.5 }}>
                <b>Summary:</b> {previewDays} calendar day{previewDays === 1 ? '' : 's'}{closingAgreement && closingAgreement.type === 'monthly' && closeDaysInput === '' && closeRevenueInput === '' ? ` (${agreementTotalDaysForSplit({ ...closingAgreement, status: 'closed', closeDate: closeDateInput })} on the standard 30-day-month basis)` : ''} × {fmt(previewDailyRate, currency)}/day = <b>{fmt(previewRevenue, currency)}</b>
              </p>
            </div>
            <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
              <button className="btn primary" onClick={confirmClose}>Confirm Close</button>
              <button className="btn" onClick={() => setClosingId(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {replacingId && replacingAgreement && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center' }} onClick={() => setReplacingId(null)}>
          <div className="panel" style={{ width: 440, background: '#fff' }} onClick={e => e.stopPropagation()}>
            <h3>Replace Vehicle — {replacingAgreement.raNumber || replacingAgreement.plate}</h3>
            <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -6 }}>Closes {replacingAgreement.plate} as of the replacement date, and opens a new linked agreement for the replacement car — same customer, tracked independently from here.</p>
            <div className="field"><label>Replacement Date</label><input type="date" value={replaceDateInput} onChange={e => setReplaceDateInput(e.target.value)} /></div>
            <div className="field">
              <label>New Vehicle Plate</label>
              <input value={replacePlateInput} onChange={e => setReplacePlateInput(e.target.value)} list="fleet-plates-replace" placeholder="e.g. 9182-G" />
              <datalist id="fleet-plates-replace">{vehicles.map(v => <option key={v.id} value={v.plate} />)}</datalist>
            </div>
            <div className="field"><label>Rate for New Vehicle ({currency}{replacingAgreement.type === 'monthly' ? '/month' : '/day'}, editable)</label><input type="number" value={replaceRateInput} onChange={e => setReplaceRateInput(e.target.value)} /></div>
            <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
              <button className="btn primary" onClick={confirmReplace}>Confirm Replacement</button>
              <button className="btn" onClick={() => setReplacingId(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      <div className="panel">
        <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: 0 }}>Rental Agreements drive both Occupancy and Vehicle Income automatically — enter a contract once, and it feeds every report. RA# and Vehicle Plate are the core tracking keys. Cars whose plate isn't in your Vehicles list are automatically treated as Sub-Lease and excluded from your owned-fleet totals.</p>
        <div style={{ display: 'flex', gap: 8 }}>
          <div className={`chip ${view === 'open' ? 'selected' : ''}`} onClick={() => setView('open')}>Open Agreements ({openAgreements.length})</div>
          <div className={`chip ${view === 'all' ? 'selected' : ''}`} onClick={() => setView('all')}>All Agreements ({agreements.length})</div>
          <div className={`chip ${view === 'add' ? 'selected' : ''}`} onClick={() => setView('add')}>+ Add Agreement</div>
          <div className={`chip ${view === 'import' ? 'selected' : ''}`} onClick={() => setView('import')}>Import / Paste</div>
        </div>
      </div>

      {view === 'add' && (
        <div className="panel">
          <h3>Add Agreement</h3>
          <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
            <div className="field" style={{ flex: '1 1 140px' }}><label>RA# (Agreement No)</label><input value={form.raNumber} onChange={e => setForm({ ...form, raNumber: e.target.value })} /></div>
            <div className="field" style={{ flex: '1 1 180px' }}><label>Customer Name</label><input value={form.customerName} onChange={e => setForm({ ...form, customerName: e.target.value })} /></div>
            <div className="field" style={{ flex: '1 1 140px' }}>
              <label>Vehicle Plate</label>
              <input value={form.plate} onChange={e => setForm({ ...form, plate: e.target.value })} list="fleet-plates" placeholder="e.g. 9182-G" />
              <datalist id="fleet-plates">{vehicles.map(v => <option key={v.id} value={v.plate} />)}</datalist>
            </div>
            <div className="field" style={{ flex: '1 1 120px' }}>
              <label>Type</label>
              <select value={form.type} onChange={e => setForm({ ...form, type: e.target.value })}>
                <option value="daily">Daily</option>
                <option value="monthly">Monthly</option>
              </select>
            </div>
            <div className="field" style={{ flex: '1 1 150px' }}><label>Start Date</label><input type="date" value={form.startDate} onChange={e => setForm({ ...form, startDate: e.target.value })} /></div>
            <div className="field" style={{ flex: '1 1 140px' }}><label>Rate ({currency}{form.type === 'monthly' ? '/month' : '/day'})</label><input type="number" value={form.rate} onChange={e => setForm({ ...form, rate: e.target.value })} /></div>
          </div>
          {form.plate && !findVehicleByPlate(vehicles, form.plate) && (
            <p style={{ fontSize: 12, color: 'var(--amber)', marginTop: 6 }}>⚠ This plate isn't in your fleet — will be tracked as a Sub-Lease vehicle, excluded from owned-fleet occupancy/revenue totals.</p>
          )}
          {form.plate && plateStatus(form.plate) && (
            <p style={{ fontSize: 12, color: 'var(--red)', marginTop: 6 }}>⚠ Vehicle is already on an open agreement (RA# {plateStatus(form.plate).raNumber || plateStatus(form.plate).id}).</p>
          )}
          <button className="btn primary" style={{ marginTop: 10 }} onClick={addAgreement}>+ Add Agreement</button>
        </div>
      )}

      {view === 'import' && (
        <div className="panel">
          <h3>Import / Paste Agreements</h3>
          <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -6 }}>Paste rows directly from your agreement report — same column layout: <code>Agreement No, Type, Vehicle, Permanent Vehicle, Customer, Customer Code, Contact No, Driver, Driver Code, Driver Nationality, Start Date, End Date, Rental Days, Additional Notes, Notes, PO No, Status, Rate, Taxable Amount, VAT, Total Amount</code>. Rental Days, Taxable Amount, VAT, and Total Amount are all ignored on purpose — Days is always computed fresh, and Rate (not the VAT-inclusive Total) is what income is calculated from. An End Date is ignored while Status is Open (it's just an expected return date until the contract is actually closed). Re-pasting the same Agreement No updates that agreement instead of duplicating it. Plates not in your fleet are auto-flagged as Sub-Lease.</p>
          <textarea value={bulkText} onChange={e => setBulkText(e.target.value)} rows={6}
            style={{ width: '100%', border: '1px solid var(--line)', borderRadius: 6, padding: 8, fontSize: 12.5, boxSizing: 'border-box', fontFamily: 'Roboto Mono, monospace' }}
            placeholder={"Paste tab-separated rows here, straight from your export…"} />
          <button className="btn primary" style={{ marginTop: 8 }} onClick={parseBulk}>Import Agreements</button>
        </div>
      )}

      {view === 'open' && (
        <div className="panel" style={{ overflowX: 'auto' }}>
          <h3>Open Agreements — Weekly Review</h3>
          <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -6 }}>Review this list weekly — confirm which are still genuinely active before finalizing the month's occupancy. Close any that have actually ended.</p>
          <table>
            <thead><tr><th>RA#</th><th>Customer</th><th>Plate</th><th>Vehicle</th><th>Type</th><th>Start Date</th><th className="num">Days So Far</th><th></th></tr></thead>
            <tbody>
              {openAgreements.map(a => {
                const vehicle = a.vehicleId ? vehicles.find(v => v.id === a.vehicleId) : null;
                return (
                  <tr key={a.id}>
                    <td>{a.raNumber || '—'}</td><td>{a.customerName || '—'}</td><td>{a.plate}</td>
                    <td>{vehicle ? vehicle.name : <span className="badge" style={{ background: '#F2F3F0', color: 'var(--muted)' }}>Sub-Lease</span>}</td>
                    <td>{a.type === 'monthly' ? 'Monthly' : 'Daily'}</td><td>{a.startDate}</td>
                    <td className="num">{agreementTotalDays(a)}</td>
                    <td style={{ textAlign: 'right' }}>
                      <button className="btn small primary" onClick={() => openCloseModal(a)}>Close</button>{' '}
                      <button className="btn small" onClick={() => openReplaceModal(a)}>Replace Vehicle</button>{' '}
                      <button className="icon-btn" onClick={() => voidAgreement(a)} title="Void">⊘</button>
                    </td>
                  </tr>
                );
              })}
              {openAgreements.length === 0 && <tr><td colSpan={8} style={{ textAlign: 'center', color: 'var(--muted)', padding: 16 }}>No open agreements.</td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {view === 'all' && (
        <div className="panel" style={{ overflowX: 'auto' }}>

                  <td>{a.startDate}</td><td>{a.closeDate || '—'}</td>
                  <td><span className={`badge ${a.status === 'open' ? 'pos' : a.status === 'void' ? 'neg' : ''}`} style={a.status === 'closed' ? { background: '#EFF4F1', color: 'var(--green)' } : a.status === 'replaced' ? { background: '#F0EAF7', color: '#7A5EA8' } : undefined}>{a.status}</span></td>
                  <td className="num">{agreementTotalDays(a)}</td>
                  <td className="num">{fmt(agreementTotalRevenue(a), currency)}</td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    {a.status === 'closed' && <button className="icon-btn" title="Reopen" onClick={() => reopenAgreement(a)}>↺</button>}{' '}
                    <button className="icon-btn" onClick={() => deleteAgreement(a)}>✕</button>
                  </td>

              ))}
