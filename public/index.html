<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fleet Financial Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Inter',sans-serif; background:#F2F3F0; color:#1D2330; }
  :root { --bg:#F2F3F0; --panel:#FFFFFF; --ink:#1D2330; --muted:#6B7380; --line:#E2E4DE;
    --navy:#161B26; --steel:#2D6E8E; --green:#3E9C6E; --amber:#D98E3F; --red:#C1503F; }
  h1,h2,h3,.display { font-family:'Oswald',sans-serif; letter-spacing:0.02em; margin:0; }
  .mono { font-family:'Roboto Mono',monospace; font-weight:700; font-variant-numeric: tabular-nums; }
  .app { display:flex; min-height:100vh; }
  .sidebar { width:200px; background:var(--navy); color:#fff; display:flex; flex-direction:column; padding:18px 12px; flex-shrink:0; }
  .brand { display:flex; align-items:center; gap:8px; font-family:'Oswald',sans-serif; font-size:18px; font-weight:700; padding:0 6px 16px 6px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:12px; }
  .navbtn { display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:none; color:rgba(255,255,255,0.72); padding:9px 10px; border-radius:7px; font-size:13px; font-weight:500; cursor:pointer; margin-bottom:2px; }
  .navbtn:hover { background:rgba(255,255,255,0.06); color:#fff; }
  .navbtn.active { background:var(--steel); color:#fff; }
  .sidebar-footer { margin-top:auto; padding-top:12px; border-top:1px solid rgba(255,255,255,0.12); font-size:11px; color:rgba(255,255,255,0.5); }
  .content { flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 22px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .topbar .filters { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .field label { font-size:11px; color:var(--muted); display:block; margin-bottom:3px; text-transform:uppercase; letter-spacing:0.04em; }
  .field input, .field select { border:1px solid var(--line); border-radius:6px; padding:6px 9px; font-size:13px; box-sizing:border-box; }
  .actions { display:flex; gap:8px; }
  .btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; padding:7px 12px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink); }
  .btn:hover { border-color:var(--steel); color:var(--steel); }
  .btn.primary { background:var(--steel); border-color:var(--steel); color:#fff; }
  .btn.primary:hover { opacity:0.9; color:#fff; }
  .btn.danger { color:var(--red); border-color:var(--red); }
  .btn.small { padding:4px 9px; font-size:12px; }
  .main-scroll { flex:1; overflow:auto; padding:20px 22px; }
  .mobile-menu-btn { display:none; }
  .sidebar-overlay { display:none; }
  @media (max-width: 860px) {
    .app { position: relative; overflow-x: hidden; }
    .sidebar { position:fixed; top:0; bottom:0; left:-230px; width:210px; z-index:200; transition:left 0.2s ease; box-shadow: 2px 0 12px rgba(0,0,0,0.25); }
    .sidebar.mobile-open { left:0; }
    .sidebar-overlay.show { display:block; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:150; }
    .mobile-menu-btn { display:flex; align-items:center; justify-content:center; width:36px; height:36px; border:1px solid var(--line); background:#fff; border-radius:8px; font-size:18px; cursor:pointer; flex-shrink:0; }
    .topbar { padding:10px 14px; gap:8px; }
    .topbar .filters { width:100%; order:3; }
    .main-scroll { padding:14px; }
    .kpi-row { grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap:10px; }
    .grid-2 { grid-template-columns: 1fr; }
    .actions { flex-wrap:wrap; }
  }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .panel h3 { font-size:13.5px; margin:0 0 12px 0; display:flex; align-items:center; gap:7px; text-transform:uppercase; letter-spacing:0.04em; }
  .kpi-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:14px; margin-bottom:16px; }
  .kpi-card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:13px 15px; }
  .kpi-card .label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }
  .kpi-card .value { font-size:20px; }
  .kpi-card .sub { font-size:11.5px; margin-top:4px; }
  .kpi-card .sub.pos { color:var(--green); } .kpi-card .sub.neg { color:var(--red); }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.02em; padding:6px 7px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:5px 7px; border-bottom:1px solid #EEEFEA; white-space:nowrap; }
  tr.section-row td { font-weight:700; background:#F7F8F5; text-transform:uppercase; font-size:11px; letter-spacing:0.03em; color:var(--steel); }
  tr.subtotal-row td { font-weight:700; background:#FBFAF6; }
  tr.net-row td { font-weight:700; background:#EFF4F1; color:var(--steel); font-size:13.5px; }
  .num { font-family:'Roboto Mono',monospace; text-align:right; font-variant-numeric:tabular-nums; }
  td input { width:88px; border:1px solid var(--line); border-radius:5px; padding:4px 6px; font-size:12px; box-sizing:border-box; font-family:'Roboto Mono',monospace; text-align:right; }
  .badge { display:inline-flex; align-items:center; gap:4px; padding:2px 7px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge.pos { background:rgba(62,156,110,0.12); color:var(--green); }
  .badge.neg { background:rgba(193,80,63,0.12); color:var(--red); }
  .empty-state { text-align:center; padding:50px 20px; color:var(--muted); }
  .chip { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:20px; padding:5px 11px; font-size:12.5px; cursor:pointer; background:#fff; }
  .chip.selected { background:var(--steel); color:#fff; border-color:var(--steel); }
  .add-row { display:flex; gap:6px; margin-top:6px; }
  .add-row input { flex:1; border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:12.5px; }
  .icon-btn { background:none; border:1px solid var(--line); cursor:pointer; color:var(--muted); padding:4px 7px; border-radius:5px; font-size:12px; }
  .icon-btn:hover { background:#F0F1EC; color:var(--red); border-color:var(--red); }
  .grid-2 { display:grid; grid-template-columns:1.3fr 1fr; gap:16px; }
  .bar-chart { display:flex; align-items:flex-end; gap:10px; height:200px; padding-top:10px; overflow-x:auto; }
  .bar-group { display:flex; flex-direction:column; align-items:center; min-width:56px; }
  .bar-set { display:flex; align-items:flex-end; gap:3px; height:160px; }
  .bar { width:16px; border-radius:3px 3px 0 0; }
  .bar-label { font-size:10.5px; color:var(--muted); margin-top:6px; text-align:center; }
  .hbar-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .hbar-track { flex:1; background:#EEEFEA; border-radius:4px; height:14px; overflow:hidden; }
  .hbar-fill { height:100%; border-radius:4px; }
  .hbar-name { width:150px; font-size:12px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; }
  .hbar-val { width:44px; text-align:right; font-size:11.5px; font-family:'Roboto Mono',monospace; flex-shrink:0; }
  .login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--navy); }
  .login-box { background:#fff; border-radius:12px; padding:34px; width:340px; text-align:center; }
  .login-box input { width:100%; border:1px solid var(--line); border-radius:7px; padding:10px 12px; font-size:14px; margin:14px 0; box-sizing:border-box; }
  .print-only { display:none; }
  @page { size: landscape; margin: 12mm; }
  @media print {
    .no-print { display:none !important; }
    .print-only { display:block !important; }
    body { background:#fff; }
    .app { display:block; }
    .print-only table { border-collapse: collapse; width: 100%; }
    .print-only table th, .print-only table td { border: 1px solid #ccc !important; padding: 6px 8px; }
    .print-only .panel { border: none; box-shadow: none; padding: 12px 0; }
    .print-only .chip { border: 1px solid #ccc; pointer-events: none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, Fragment } = React;

/* ---------------- chart of accounts defaults ---------------- */
const defaultLineItems = () => ({
  revenue: [
    { key: 'rentalDaily', label: 'Rental income - Daily basis' },
    { key: 'rentalMonthly', label: 'Rental income - Monthly basis' },
    { key: 'rentalSubLease', label: 'Rental income - Sub Lease' },
    { key: 'otherIncome', label: 'Other Income' },
  ],
  direct: [
    { key: 'subLeaseCharges', label: 'Sub lease charges' },
    { key: 'salaryCost', label: 'Salary cost' },
    { key: 'staffBenefits', label: 'Staff benefits' },
    { key: 'commissionOwn', label: 'Commission on our vehicles' },
    { key: 'commissionSub', label: 'Commission on subleased vehicles' },
    { key: 'registrationCost', label: 'Registration cost' },
    { key: 'trackingCharges', label: 'Tracking charges' },
    { key: 'insuranceCharges', label: 'Insurance charges' },
    { key: 'vehicleMaintenance', label: 'Vehicle maintenance' },
    { key: 'depreciationVehicles', label: 'Depreciation - vehicles' },
  ],
  indirect: [
    { key: 'rentOffice', label: 'Rent - Office' },
    { key: 'salaryOffice', label: 'Salary - Office' },
    { key: 'staffBenefitOffice', label: 'Staff benefit (Medical/Ticket)' },
    { key: 'gratuity', label: 'Gratuity & Leave Salary' },
    { key: 'visaRenewal', label: 'Visa Renewal Staff' },
    { key: 'licenseRenewal', label: 'License Renewal Fee' },
    { key: 'utilities', label: 'Communication / Utility Bills' },
    { key: 'softwareRenewal', label: 'Software Renewal' },
    { key: 'auditFee', label: 'Annual Audit Fee' },
    { key: 'advertisement', label: 'Advertisement & Promotion' },
    { key: 'printing', label: 'Printing and Stationery' },
    { key: 'officeExpenses', label: 'Office Expenses' },
    { key: 'badDebts', label: 'Provision for Bad Debts' },
  ],
  interest: [
    { key: 'interestLoan', label: 'Interest / Loan / Financing' },
    { key: 'bankCharges', label: 'Bank Charges' },
  ],
  belowLine: [
    { key: 'profitOnSale', label: 'Profit on Sale of Vehicles' },
  ],
});

const SECTION_META = {
  revenue: { title: 'Revenue', kind: 'income' },
  direct: { title: 'Direct Expenses', kind: 'expense' },
  indirect: { title: 'Indirect Expenses', kind: 'expense' },
  interest: { title: 'Interest & Bank Charges', kind: 'expense' },
  belowLine: { title: 'Other (Below the Line)', kind: 'income' },
};

const COLORS = ['#2D6E8E', '#3E9C6E', '#D98E3F', '#8C6BB1', '#C1503F', '#4E5D78'];

function uid(p) { return p + '_' + Math.random().toString(36).slice(2, 9); }
function num(v) { const n = Number(v); return isNaN(n) ? 0 : n; }
function monthsOf(year) { return Array.from({ length: 12 }, (_, i) => year + '-' + String(i + 1).padStart(2, '0')); }
function periodsBetween(from, to) {
  if (!from || !to || from > to) return [];
  const result = [];
  let [y, m] = from.split('-').map(Number);
  const [ey, em] = to.split('-').map(Number);
  let guard = 0;
  while ((y < ey || (y === ey && m <= em)) && guard < 600) {
    result.push(y + '-' + String(m).padStart(2, '0'));
    m++; if (m > 12) { m = 1; y++; }
    guard++;
  }
  return result;
}
function monthLabel(period) {
  const [y, m] = period.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleString('default', { month: 'short' }) + '-' + String(y).slice(2);
}
function fmt(n, currency) {
  const rounded = Math.round(num(n));
  if (rounded === 0) return '-';
  return currency + ' ' + rounded.toLocaleString('en-US');
}
function pctStr(n) { return isFinite(n) ? (n * 100).toFixed(1) + '%' : '—'; }

function computeMonth(period, monthlyData, lineItems) {
  const md = monthlyData[period] || {};
  const val = (key, field) => num((md[key] || {})[field]);
  const sumSec = (arr, field) => arr.reduce((s, i) => s + val(i.key, field), 0);
  const res = {};
  ['budget', 'actual'].forEach(f => {
    res['income_' + f] = sumSec(lineItems.revenue, f);
    res['direct_' + f] = sumSec(lineItems.direct, f);
    res['gross_' + f] = res['income_' + f] - res['direct_' + f];
    res['indirect_' + f] = sumSec(lineItems.indirect, f);
    res['ebitda_' + f] = res['gross_' + f] - res['indirect_' + f];
    res['interest_' + f] = sumSec(lineItems.interest, f);
    res['belowline_' + f] = sumSec(lineItems.belowLine, f);
    res['totalexp_' + f] = res['direct_' + f] + res['indirect_' + f] + res['interest_' + f];
    res['netprofit_' + f] = res['ebitda_' + f] - res['interest_' + f] + res['belowline_' + f];
    res['grossPct_' + f] = res['income_' + f] ? res['gross_' + f] / res['income_' + f] : 0;
    res['netPct_' + f] = res['income_' + f] ? res['netprofit_' + f] / res['income_' + f] : 0;
  });
  return res;
}

function rangeAggregate(monthKeys, monthlyData, lineItems) {
  const totals = {};
  monthKeys.forEach(p => {
    const c = computeMonth(p, monthlyData, lineItems);
    Object.keys(c).forEach(k => {
      if (k.endsWith('Pct_budget') || k.endsWith('Pct_actual')) return;
      totals[k] = (totals[k] || 0) + c[k];
    });
  });
  totals.grossPct_budget = totals.income_budget ? totals.gross_budget / totals.income_budget : 0;
  totals.grossPct_actual = totals.income_actual ? totals.gross_actual / totals.income_actual : 0;
  totals.netPct_budget = totals.income_budget ? totals.netprofit_budget / totals.income_budget : 0;
  totals.netPct_actual = totals.income_actual ? totals.netprofit_actual / totals.income_actual : 0;
  return totals;
}

function rowVariance(budget, actual, kind) {
  const variance = kind === 'expense' ? (budget - actual) : (actual - budget);
  const pct = budget !== 0 ? variance / Math.abs(budget) : null;
  return { variance, pct, favorable: variance >= 0 };
}

/* ---------------- Excel row builders (shared by contextual + cumulative export) ---------------- */

function buildPnlDetailRows(rangeMonths, lineItems, monthlyData) {
  const detailHeader = ['Particulars', ...rangeMonths.flatMap(p => [monthLabel(p) + ' Budget', monthLabel(p) + ' Actual'])];
  const detailRows = [detailHeader];
  const pushSection = (sec, subtotalLabel, subtotalKey) => {
    lineItems[sec].forEach(item => {
      detailRows.push([item.label, ...rangeMonths.flatMap(p => {
        const md = (monthlyData[p] || {})[item.key] || {};
        return [num(md.budget), num(md.actual)];
      })]);
    });
    if (subtotalLabel) detailRows.push([subtotalLabel, ...rangeMonths.flatMap(p => { const c = computeMonth(p, monthlyData, lineItems); return [c[subtotalKey + '_budget'], c[subtotalKey + '_actual']]; })]);
  };
  pushSection('revenue', 'Total Income', 'income');
  pushSection('direct', 'Total Direct Expenses', 'direct');
  detailRows.push(['Gross Profit', ...rangeMonths.flatMap(p => { const c = computeMonth(p, monthlyData, lineItems); return [c.gross_budget, c.gross_actual]; })]);
  detailRows.push(['Gross Profit %', ...rangeMonths.flatMap(p => { const c = computeMonth(p, monthlyData, lineItems); return [pctStr(c.grossPct_budget), pctStr(c.grossPct_actual)]; })]);
  pushSection('indirect', 'Total Indirect Expenses', 'indirect');
  detailRows.push(['EBITDA', ...rangeMonths.flatMap(p => { const c = computeMonth(p, monthlyData, lineItems); return [c.ebitda_budget, c.ebitda_actual]; })]);
  pushSection('interest', 'Total Interest & Bank Charges', 'interest');
  pushSection('belowLine', null, null);
  detailRows.push(['Net Profit', ...rangeMonths.flatMap(p => { const c = computeMonth(p, monthlyData, lineItems); return [c.netprofit_budget, c.netprofit_actual]; })]);
  detailRows.push(['Net Profit %', ...rangeMonths.flatMap(p => { const c = computeMonth(p, monthlyData, lineItems); return [pctStr(c.netPct_budget), pctStr(c.netPct_actual)]; })]);
  return detailRows;
}

function buildOccMatrixRows(rangeMonths, vehicles, occupancy, baseDays) {
  const occRows = [['Car', 'Plate', ...rangeMonths.map(monthLabel), 'AVG %', 'Remarks']];
  vehicles.forEach(v => {
    const pcts = rangeMonths.map(p => { const d = (occupancy[p] || {})[v.id]; return d === undefined || d === '' ? null : num(d) / baseDays; });
    const valid = pcts.filter(x => x !== null);
    const avg = valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : null;
    occRows.push([v.name, v.plate, ...pcts.map(p => p === null ? '' : (p * 100).toFixed(0) + '%'), avg === null ? '' : (avg * 100).toFixed(0) + '%', avg === null ? '' : (avg >= 0.5 ? 'OK' : 'Workout')]);
  });
  return occRows;
}

function buildOccDistributionRows(rangeMonths, vehicles, occupancy, baseDays) {
  const buckets = { '0-30%': 0, '31-50%': 0, '51-75%': 0, '76-100%+': 0 };
  vehicles.forEach(v => {
    const pcts = rangeMonths.map(p => { const d = (occupancy[p] || {})[v.id]; return d === undefined || d === '' ? null : num(d) / baseDays; }).filter(x => x !== null);
    if (!pcts.length) return;
    const avg = pcts.reduce((a, b) => a + b, 0) / pcts.length;
    if (avg < 0.3) buckets['0-30%']++; else if (avg < 0.5) buckets['31-50%']++; else if (avg < 0.75) buckets['51-75%']++; else buckets['76-100%+']++;
  });
  return [['Bucket', 'Vehicle Count'], ...Object.entries(buckets)];
}

function buildRoiRows(vehicles, rangeMonths, vehicleRevenue, defaultUsefulLife) {
  const roiRows = [['Model', 'Plate', 'Purchase Value', 'Useful Life (yrs)', 'Avg Monthly Income', 'Required Monthly Income', 'Coverage %', 'Verdict']];
  vehicles.forEach(v => {
    const s = vehicleRoiStats(v, rangeMonths, vehicleRevenue, defaultUsefulLife);
    roiRows.push([v.name, v.plate, num(v.purchaseValue), s.usefulLife, Math.round(s.avgMonthly), Math.round(s.required), s.coverage === null ? '' : (s.coverage * 100).toFixed(0) + '%', s.verdict]);
  });
  return roiRows;
}

function buildFeasibilityRows(feasibilityStudies) {
  const feasRows = [['Study', 'Total Price', 'Down Payment', 'Net Amount', 'Useful Life (yrs)', 'Working Days/Month', 'Total Annual Expenses', 'Total Cost + Expenses', 'Target Profit %', 'Profit (life)', 'Grand Total', 'Required Daily Rate', 'Market Daily Rate', 'Monthly EMI', 'Verdict']];
  feasibilityStudies.forEach(s => {
    const fc = computeFeasibility(s);
    feasRows.push([s.name, num(s.totalPrice), num(s.downPayment), fc.netAmount, s.usefulLifeYears, s.workingDaysPerMonth, Math.round(fc.annualExpenseTotal), Math.round(fc.costBase), s.profitPercent, Math.round(fc.profitTotal), Math.round(fc.grandTotal), Math.round(fc.requiredDailyRate), num(s.marketDailyRate), Math.round(fc.emi), fc.verdict]);
  });
  return feasRows;
}

function buildLoanRows(loans) {
  const summaryRows = [['Vehicle', 'Lender', 'Car Value', 'Down Payment', 'Loan Amount', 'Interest Rate %', 'Term (months)', 'Start Date', 'Monthly EMI', 'Principal Balance', 'Interest Balance', 'Payoff Date']];
  const scheduleRows = [['Vehicle', 'Installment #', 'Due Date', 'Principal', 'Interest', 'Total', 'Paid', 'Paid Date']];
  loans.forEach(l => {
    const s = loanStats(l);
    summaryRows.push([l.modelName, l.lender, num(l.carValue), num(l.downPayment), loanAmount(l), l.interestRate, loanTermMonths(l), l.startDate, Math.round(s.monthlyEMI), Math.round(s.balancePrincipal), Math.round(s.balanceInterest), s.payoffDate || '']);
    (l.schedule || []).forEach(r => {
      scheduleRows.push([l.modelName, r.number, r.dueDate, r.principal, r.interest, num(r.principal) + num(r.interest), r.paid ? 'Yes' : 'No', r.paidDate || '']);
    });
  });
  return { summaryRows, scheduleRows };
}

function computeQuickReview(rangeMonths, monthlyData, lineItems, vehicles, occupancy, baseDays) {
  const totals = rangeAggregate(rangeMonths, monthlyData, lineItems);
  const incomeVariance = rowVariance(totals.income_budget, totals.income_actual, 'income');
  const directVariance = rowVariance(totals.direct_budget, totals.direct_actual, 'expense');
  const netVariance = rowVariance(totals.netprofit_budget, totals.netprofit_actual, 'income');

  let topRevenue = null;
  (lineItems.revenue || []).forEach(item => {
    const val = rangeMonths.reduce((s, p) => s + num(((monthlyData[p] || {})[item.key] || {}).actual), 0);
    if (!topRevenue || val > topRevenue.value) topRevenue = { label: item.label, value: val };
  });
  const topRevenueSharePct = topRevenue && totals.income_actual ? topRevenue.value / totals.income_actual : null;

  const occRows = vehicles.map(v => {
    const pcts = rangeMonths.map(p => { const d = (occupancy[p] || {})[v.id]; return d === undefined || d === '' ? null : num(d) / baseDays; }).filter(x => x !== null);
    const avg = pcts.length ? pcts.reduce((a, b) => a + b, 0) / pcts.length : null;
    return { vehicle: v, avg };
  });
  const withData = occRows.filter(r => r.avg !== null);
  const fleetAvgOcc = withData.length ? withData.reduce((s, r) => s + r.avg, 0) / withData.length : 0;
  const above50 = withData.filter(r => r.avg >= 0.5).length;

  const modelGroups = {};
  withData.forEach(r => {
    const key = r.vehicle.name;
    if (!modelGroups[key]) modelGroups[key] = { name: key, sum: 0, count: 0 };
    modelGroups[key].sum += r.avg; modelGroups[key].count++;
  });
  const topModels = Object.values(modelGroups).map(g => ({ name: g.name, avg: g.sum / g.count, units: g.count }))
    .sort((a, b) => b.avg - a.avg).slice(0, 3);

  return { totals, incomeVariance, directVariance, netVariance, topRevenue, topRevenueSharePct, fleetAvgOcc, above50, totalWithData: withData.length, topModels };
}

function DonutGauge({ pct, size = 150, color = '#2D6E8E' }) {
  const r = size / 2 - 13;
  const c = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(1, pct));
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#EEEFEA" strokeWidth="14" />
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth="14"
        strokeDasharray={c} strokeDashoffset={c * (1 - clamped)} strokeLinecap="round"
        transform={`rotate(-90 ${size / 2} ${size / 2})`} />
      <text x="50%" y="50%" textAnchor="middle" dominantBaseline="middle" fontSize={size * 0.22} fontWeight="700" fill="#1D2330">{Math.round(pct * 100)}%</text>
    </svg>
  );
}

function vehicleUsefulLife(v, defaultUsefulLife) {
  const override = num(v.usefulLifeOverride);
  return override > 0 ? override : num(defaultUsefulLife) || 4;
}
function requiredMonthlyIncome(v, defaultUsefulLife) {
  const life = vehicleUsefulLife(v, defaultUsefulLife);
  const pv = num(v.purchaseValue);
  return life > 0 ? pv / (life * 12) : 0;
}
function vehicleRoiStats(v, rangeMonths, vehicleRevenue, defaultUsefulLife) {
  let total = 0, monthsWithData = 0;
  rangeMonths.forEach(p => {
    const val = (vehicleRevenue[p] || {})[v.id];
    if (val !== undefined && val !== '') { total += num(val); monthsWithData++; }
  });
  const avgMonthly = monthsWithData ? total / monthsWithData : 0;
  const required = requiredMonthlyIncome(v, defaultUsefulLife);
  const coverage = required > 0 ? avgMonthly / required : null;
  let verdict = 'No Benchmark';
  if (coverage !== null) verdict = coverage >= 1 ? 'Good' : coverage >= 0.8 ? 'Marginal' : 'Underperforming';
  return { total, monthsWithData, avgMonthly, required, coverage, verdict, usefulLife: vehicleUsefulLife(v, defaultUsefulLife) };
}

/* ---------------- Feasibility Study calculations ---------------- */

function calcEMI(principal, annualRatePct, termMonths) {
  // Flat-rate method: Balance (Car Value − Down Payment) + total interest for the whole
  // financing period (annual rate × number of years financed), all divided evenly across
  // the months — not a reducing-balance/amortized calculation.
  const p = num(principal);
  const months = num(termMonths);
  if (!p || !months) return 0;
  const years = months / 12;
  const totalInterest = p * (num(annualRatePct) / 100) * years;
  return (p + totalInterest) / months;
}

/* ---------------- Vehicle Financing ---------------- */

function addMonths(dateStr, delta) {
  const parts = String(dateStr).split('-').map(Number);
  const y = parts[0], m = parts[1], d = parts.length >= 3 ? parts[2] : 1;
  const totalMonths = (m - 1) + delta;
  const targetYear = y + Math.floor(totalMonths / 12);
  const targetMonth = ((totalMonths % 12) + 12) % 12; // 0-based, always positive
  const daysInTargetMonth = new Date(targetYear, targetMonth + 1, 0).getDate();
  const clampedDay = Math.min(d, daysInTargetMonth);
  const mm = String(targetMonth + 1).padStart(2, '0');
  if (parts.length >= 3) return `${targetYear}-${mm}-${String(clampedDay).padStart(2, '0')}`;
  return `${targetYear}-${mm}`;
}

function fullDateLabel(dateStr) {
  if (!dateStr) return '—';
  const parts = String(dateStr).split('-').map(Number);
  if (parts.length < 3) return monthLabel(dateStr); // legacy month-only data
  const [y, m, d] = parts;
  return new Date(y, m - 1, d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function parseFlexibleDate(str) {
  str = String(str || '').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  if (/^\d{4}-\d{2}$/.test(str)) return str + '-01';
  const m = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); // DD/MM/YYYY
  if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  return str;
}

function emptyLoan() {
  return {
    id: uid('loan'),
    vehicleId: '', modelName: '', lender: '',

    interestRate: '', termUnit: 'months', termValue: 36,
    startDate: new Date().toISOString().slice(0, 10),
    schedule: [], deferments: [],
  };
}

function loanAmount(loan) {
  return Math.max(0, num(loan.carValue) - num(loan.downPayment) + (loan.includeFeeInLoan ? num(loan.processingFee) : 0));
}
function loanTermMonths(loan) { return loan.termUnit === 'years' ? num(loan.termValue) * 12 : num(loan.termValue); }

function generateSchedule(loan) {
  const principal = loanAmount(loan);
  const months = loanTermMonths(loan);
  if (!months) return [];
  const years = months / 12;
  const rate = num(loan.interestRate);
  const totalInterest = principal * (rate / 100) * years;
  const monthlyPrincipal = principal / months;
  const monthlyInterest = totalInterest / months;
  const rows = [];
  let principalSum = 0, interestSum = 0;
  for (let i = 1; i <= months; i++) {
    let p = Math.round(monthlyPrincipal * 100) / 100;
    let it = Math.round(monthlyInterest * 100) / 100;
    if (i === months) {
      // last installment absorbs any rounding drift so totals match exactly
      p = Math.round((principal - principalSum) * 100) / 100;
      it = Math.round((totalInterest - interestSum) * 100) / 100;
    }
    principalSum += p; interestSum += it;
    rows.push({
      id: uid('inst'), number: i,
      dueDate: addMonths(loan.startDate, i - 1),
      principal: p,
      interest: it,
      paid: false, paidDate: '',
    });
  }
  return rows;
}

function applyDeferment(schedule, fromNumber, months) {
  return schedule.map(row => row.number >= fromNumber ? { ...row, dueDate: addMonths(row.dueDate, months) } : row);
}

function loanStats(loan) {
  const schedule = loan.schedule || [];
  const totalPrincipal = schedule.reduce((s, r) => s + num(r.principal), 0);
  const totalInterest = schedule.reduce((s, r) => s + num(r.interest), 0);
  const paidRows = schedule.filter(r => r.paid);
  const paidPrincipal = paidRows.reduce((s, r) => s + num(r.principal), 0);
  const paidInterest = paidRows.reduce((s, r) => s + num(r.interest), 0);
  const balancePrincipal = totalPrincipal - paidPrincipal;
  const balanceInterest = totalInterest - paidInterest;
  const unpaid = schedule.filter(r => !r.paid).sort((a, b) => a.number - b.number);
  const nextDue = unpaid[0] || null;
  const payoffDate = schedule.length ? schedule[schedule.length - 1].dueDate : null;
  const today = new Date().toISOString().slice(0, 10);
  const overdue = !!(nextDue && nextDue.dueDate < today);
  const monthlyEMI = schedule.length ? (num(schedule[0].principal) + num(schedule[0].interest)) : 0;
  const totalAmount = totalPrincipal + totalInterest;
  const paidAmount = paidPrincipal + paidInterest;
  const balanceAmount = totalAmount - paidAmount;
  const paidPct = totalAmount ? paidAmount / totalAmount : 0;
  const principalPaidPct = totalPrincipal ? paidPrincipal / totalPrincipal : 0;
  const interestPaidPct = totalInterest ? paidInterest / totalInterest : 0;
  const installmentsPaid = paidRows.length;
  const installmentsTotal = schedule.length;
  return { totalPrincipal, totalInterest, paidPrincipal, paidInterest, balancePrincipal, balanceInterest, nextDue, payoffDate, overdue, monthlyEMI, totalAmount, paidAmount, balanceAmount, paidPct, principalPaidPct, interestPaidPct, installmentsPaid, installmentsTotal };
}

    ],

function computeFeasibility(study) {
  const netAmount = num(study.totalPrice) - num(study.downPayment);
  const years = num(study.usefulLifeYears) || 1;
  const months = years * 12;
  const workingDaysMonth = num(study.workingDaysPerMonth) || 22;
  const totalWorkingDays = workingDaysMonth * months;
  const annualExpenseTotal = (study.costLines || []).reduce((s, c) => s + num(c.annualAmount), 0);
  const lifeExpenseTotal = annualExpenseTotal * years;
  const costBase = netAmount + lifeExpenseTotal;
  const profitTotal = (num(study.profitPercent) / 100) * costBase * years;
  const grandTotal = costBase + profitTotal;
  const requiredDailyRate = totalWorkingDays ? grandTotal / totalWorkingDays : 0;
  const emi = calcEMI(netAmount, study.loanInterestRate, num(study.loanTermMonths) || months);
  const scenarios = [1, 0.75, 0.5].map(occ => {
    const days = occ * workingDaysMonth;
    return { occPct: occ, days, requiredAmount: days * requiredDailyRate, marketAmount: days * num(study.marketDailyRate) };
  });
  const marketRate = num(study.marketDailyRate);
  const gapPct = requiredDailyRate ? (marketRate - requiredDailyRate) / requiredDailyRate : null;
  const verdict = !marketRate ? 'No Market Rate Set' : marketRate >= requiredDailyRate ? 'Feasible' : (marketRate >= requiredDailyRate * 0.9 ? 'Marginal' : 'Not Feasible');
  return { netAmount, months, workingDaysMonth, totalWorkingDays, annualExpenseTotal, lifeExpenseTotal, costBase, profitTotal, grandTotal, requiredDailyRate, emi, scenarios, gapPct, verdict };
}

function confirmDelete(label, deletePin) {
  if (!window.confirm('Delete "' + label + '"? This cannot be undone.')) return false;
  if (deletePin) {
    const entered = window.prompt('Enter the security PIN to confirm deletion:');
    if (entered !== deletePin) { window.alert('Incorrect PIN — deletion cancelled.'); return false; }
  }
  return true;
}

function GroupedBarChart({ data, series, height = 200 }) {
  const max = Math.max(1, ...data.flatMap(d => series.map(s => Math.abs(d[s.key]) || 0)));
  return (
    <div className="bar-chart" style={{ height: height + 40 }}>
      {data.map((d, i) => (
        <div className="bar-group" key={i}>
          <div className="bar-set" style={{ height }}>
            {series.map((s, j) => (
              <div key={j} className="bar" title={s.label + ': ' + d[s.key]}
                style={{ height: Math.max(2, Math.abs(d[s.key]) / max * height) + 'px', background: s.color }} />
            ))}
          </div>
          <div className="bar-label">{d.label}</div>
        </div>
      ))}
    </div>
  );
}

function HBarList({ data, maxVal }) {
  const max = maxVal || Math.max(1, ...data.map(d => d.value));
  return (
    <div>
      {data.map((d, i) => (
        <div className="hbar-row" key={i}>
          <div className="hbar-name" title={d.name}>{d.name}</div>
          <div className="hbar-track"><div className="hbar-fill" style={{ width: (d.value / max * 100) + '%', background: d.color || '#2D6E8E' }} /></div>
          <div className="hbar-val">{d.display !== undefined ? d.display : d.value}</div>
        </div>
      ))}
    </div>
  );
}

function LineTrendSVG({ data, series, width = 640, height = 220 }) {
  const allVals = data.flatMap(d => series.map(s => d[s.key] || 0));
  const max = Math.max(...allVals, 0);
  const min = Math.min(...allVals, 0);
  const range = (max - min) || 1;
  const n = Math.max(data.length - 1, 1);
  const toXY = (i, v) => [ (i / n) * (width - 40) + 30, height - 20 - ((v - min) / range) * (height - 40) ];
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`} style={{ overflow: 'visible' }}>
      <line x1="30" y1={height - 20} x2={width - 10} y2={height - 20} stroke="#E2E4DE" />
      {series.map((s, si) => {
        const pts = data.map((d, i) => toXY(i, d[s.key] || 0).join(',')).join(' ');
        return <polyline key={si} points={pts} fill="none" stroke={s.color} strokeWidth="2" strokeDasharray={s.dashed ? '5,4' : '0'} />;
      })}
      {data.map((d, i) => {
        const [x] = toXY(i, 0);
        return <text key={i} x={x} y={height - 4} fontSize="10" fill="#6B7380" textAnchor="middle">{d.label}</text>;
      })}
    </svg>
  );
}

    else if (activeTab === 'feasibility') setPrintMode('feasibility');
    else if (activeTab === 'financing') setPrintMode('financing');
    else { handlePrintCumulative(); return; }
    setTimeout(() => window.print(), 200);
  }

  function handlePrintLoan(loanId) {
    setPrintLoanId(loanId);
    setTimeout(() => window.print(), 200);
  }

  function exportExcelCumulative() {
    const wb = XLSX.utils.book_new();
    const totals = rangeAggregate(rangeMonths, monthlyData, lineItems);

    const summaryRows = [
      ['Company', companyName], ['Period', rangeMonths.map(monthLabel).join(', ')], [],
      ['Metric', 'Budget', 'Actual', 'Variance'],
      ['Total Income', totals.income_budget, totals.income_actual, totals.income_actual - totals.income_budget],
      ['Total Direct Expenses', totals.direct_budget, totals.direct_actual, totals.direct_budget - totals.direct_actual],
      ['Gross Profit', totals.gross_budget, totals.gross_actual, totals.gross_actual - totals.gross_budget],
      ['Total Indirect Expenses', totals.indirect_budget, totals.indirect_actual, totals.indirect_budget - totals.indirect_actual],
      ['EBITDA', totals.ebitda_budget, totals.ebitda_actual, totals.ebitda_actual - totals.ebitda_budget],
      ['Total Interest & Bank Charges', totals.interest_budget, totals.interest_actual, totals.interest_budget - totals.interest_actual],
      ['Net Profit', totals.netprofit_budget, totals.netprofit_actual, totals.netprofit_actual - totals.netprofit_budget],
      ['Gross Margin %', pctStr(totals.grossPct_budget), pctStr(totals.grossPct_actual), ''],
      ['Net Margin %', pctStr(totals.netPct_budget), pctStr(totals.netPct_actual), ''],
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'Summary');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildPnlDetailRows(rangeMonths, lineItems, monthlyData)), 'PnL Detail');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildOccMatrixRows(rangeMonths, vehicles, occupancy, baseDays)), 'Occupancy Matrix');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildOccDistributionRows(rangeMonths, vehicles, occupancy, baseDays)), 'Occupancy Distribution');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildRoiRows(vehicles, rangeMonths, vehicleRevenue, defaultUsefulLife)), 'Vehicle ROI');

    if (feasibilityStudies.length) {
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildFeasibilityRows(feasibilityStudies)), 'Feasibility Studies');
    }
    if (loans.length) {
      const { summaryRows: loanSummaryRows, scheduleRows: loanScheduleRows } = buildLoanRows(loans);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(loanSummaryRows), 'Loan Summary');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(loanScheduleRows), 'Loan Schedules');
    }

    XLSX.writeFile(wb, `${companyName.replace(/[^a-z0-9]+/gi, '-')}-cumulative-report-${reportFrom}_to_${reportTo}.xlsx`);
  }

  function exportExcel() {
    if (activeTab === 'quick-review') {
      const wb = XLSX.utils.book_new();
      const totals = rangeAggregate(rangeMonths, monthlyData, lineItems);
      const rows = [
        ['Company', companyName], ['Period', rangeMonths.map(monthLabel).join(', ')], [],
        ['Metric', 'Budget', 'Actual', 'Variance'],
        ['Total Income', totals.income_budget, totals.income_actual, totals.income_actual - totals.income_budget],
        ['Direct Expenses', totals.direct_budget, totals.direct_actual, totals.direct_budget - totals.direct_actual],
        ['Net Profit', totals.netprofit_budget, totals.netprofit_actual, totals.netprofit_actual - totals.netprofit_budget],
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Quick Review');
      XLSX.writeFile(wb, `${companyName.replace(/[^a-z0-9]+/gi, '-')}-quick-review-${reportFrom}_to_${reportTo}.xlsx`);
      return;
    }
    if (activeTab === 'pnl-compare') {
      const wb = XLSX.utils.book_new();
      const totals = rangeAggregate(rangeMonths, monthlyData, lineItems);
      const summaryRows = [
        ['Company', companyName], ['Period', rangeMonths.map(monthLabel).join(', ')], [],
        ['Metric', 'Budget', 'Actual', 'Variance'],
        ['Total Income', totals.income_budget, totals.income_actual, totals.income_actual - totals.income_budget],
        ['Total Direct Expenses', totals.direct_budget, totals.direct_actual, totals.direct_budget - totals.direct_actual],
        ['Gross Profit', totals.gross_budget, totals.gross_actual, totals.gross_actual - totals.gross_budget],
        ['Total Indirect Expenses', totals.indirect_budget, totals.indirect_actual, totals.indirect_budget - totals.indirect_actual],
        ['EBITDA', totals.ebitda_budget, totals.ebitda_actual, totals.ebitda_actual - totals.ebitda_budget],
        ['Net Profit', totals.netprofit_budget, totals.netprofit_actual, totals.netprofit_actual - totals.netprofit_budget],
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'Summary');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildPnlDetailRows(rangeMonths, lineItems, monthlyData)), 'PnL Detail');
      XLSX.writeFile(wb, `${companyName.replace(/[^a-z0-9]+/gi, '-')}-pnl-report-${reportFrom}_to_${reportTo}.xlsx`);
      return;
    }
    if (activeTab === 'occ-report') {
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildOccMatrixRows(rangeMonths, vehicles, occupancy, baseDays)), 'Occupancy Matrix');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildOccDistributionRows(rangeMonths, vehicles, occupancy, baseDays)), 'Occupancy Distribution');
      XLSX.writeFile(wb, `${companyName.replace(/[^a-z0-9]+/gi, '-')}-occupancy-report-${reportFrom}_to_${reportTo}.xlsx`);
      return;
    }
    if (activeTab === 'model-compare') {
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildRoiRows(vehicles, rangeMonths, vehicleRevenue, defaultUsefulLife)), 'Vehicle ROI');
      XLSX.writeFile(wb, `${companyName.replace(/[^a-z0-9]+/gi, '-')}-model-roi-${reportFrom}_to_${reportTo}.xlsx`);
      return;
    }
    if (activeTab === 'feasibility') {
      if (!feasibilityStudies.length) { window.alert('No feasibility studies to export yet.'); return; }
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildFeasibilityRows(feasibilityStudies)), 'Feasibility Studies');
      XLSX.writeFile(wb, `${companyName.replace(/[^a-z0-9]+/gi, '-')}-feasibility-studies.xlsx`);
      return;
    }
    if (activeTab === 'financing') {
      if (!financingReportLoans.length) { window.alert('No loans to export yet — add a loan, or check your car selection.'); return; }
      const wb = XLSX.utils.book_new();
      const { summaryRows, scheduleRows } = buildLoanRows(financingReportLoans);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'Loan Summary');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(scheduleRows), 'Loan Schedules');
      XLSX.writeFile(wb, `${companyName.replace(/[^a-z0-9]+/gi, '-')}-loan-schedules.xlsx`);
      return;
    }
    exportExcelCumulative();
  }


  if (!authed) {
    return (
      <div className="login-screen">
        <div className="login-box">
          <h2 style={{ marginBottom: 6 }}>🚗 Fleet Financial Report</h2>
          <p style={{ color: 'var(--muted)', fontSize: 13 }}>Enter the site password to continue</p>
          <input type="password" placeholder="Password" value={password}
            onChange={e => setPassword(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') tryLogin(password); }} />
          {authError && <div style={{ color: 'var(--red)', fontSize: 12.5, marginBottom: 10 }}>{authError}</div>}
          <button className="btn primary" style={{ width: '100%', justifyContent: 'center' }} onClick={() => tryLogin(password)}>Enter</button>
        </div>
      </div>
    );
  }

  return (
    <div className="app">
      <aside className={`sidebar no-print ${mobileNavOpen ? 'mobile-open' : ''}`}>
        <div className="brand">
          {logoDataUrl ? <img src={logoDataUrl} alt="logo" style={{ height: 26, maxWidth: 150, objectFit: 'contain' }} /> : <>🚗 <span>{companyName || 'FleetIQ'}</span></>}
        </div>
        <nav onClick={() => setMobileNavOpen(false)}>
          <button className={`navbtn ${activeTab === 'pnl-entry' ? 'active' : ''}`} onClick={() => setActiveTab('pnl-entry')}>📋 P&amp;L Entry</button>
          <button className={`navbtn ${activeTab === 'quick-review' ? 'active' : ''}`} onClick={() => setActiveTab('quick-review')}>⚡ Quick Review</button>
          <button className={`navbtn ${activeTab === 'pnl-compare' ? 'active' : ''}`} onClick={() => setActiveTab('pnl-compare')}>📊 P&amp;L Compare</button>
          <button className={`navbtn ${activeTab === 'occ-entry' ? 'active' : ''}`} onClick={() => setActiveTab('occ-entry')}>⏱ Occupancy Entry</button>
          <button className={`navbtn ${activeTab === 'occ-report' ? 'active' : ''}`} onClick={() => setActiveTab('occ-report')}>📈 Occupancy Report</button>
          <button className={`navbtn ${activeTab === 'vehicles' ? 'active' : ''}`} onClick={() => setActiveTab('vehicles')}>🚙 Vehicles</button>
          <button className={`navbtn ${activeTab === 'veh-revenue' ? 'active' : ''}`} onClick={() => setActiveTab('veh-revenue')}>💵 Vehicle Revenue Entry</button>
          <button className={`navbtn ${activeTab === 'model-compare' ? 'active' : ''}`} onClick={() => setActiveTab('model-compare')}>🏁 Model Comparison &amp; ROI</button>
          <button className={`navbtn ${activeTab === 'feasibility' ? 'active' : ''}`} onClick={() => setActiveTab('feasibility')}>🧮 Feasibility Study</button>
          <button className={`navbtn ${activeTab === 'financing' ? 'active' : ''}`} onClick={() => setActiveTab('financing')}>🏦 Vehicle Financing</button>
          <button className={`navbtn ${activeTab === 'chart-of-accounts' ? 'active' : ''}`} onClick={() => setActiveTab('chart-of-accounts')}>📑 Chart of Accounts</button>
          <button className={`navbtn ${activeTab === 'import' ? 'active' : ''}`} onClick={() => setActiveTab('import')}>📥 Import Excel</button>
          <button className={`navbtn ${activeTab === 'settings' ? 'active' : ''}`} onClick={() => setActiveTab('settings')}>⚙ Settings</button>
        </nav>
        <div className="sidebar-footer">Signed in · <span onClick={() => { sessionStorage.removeItem('fleet_app_pw'); setAuthed(false); setPassword(''); }} style={{ textDecoration: 'underline', cursor: 'pointer' }}>Sign out</span></div>
      </aside>
      <div className={`sidebar-overlay no-print ${mobileNavOpen ? 'show' : ''}`} onClick={() => setMobileNavOpen(false)} />

      <div className="content">
        <header className="topbar no-print">
          <button className="mobile-menu-btn" onClick={() => setMobileNavOpen(true)}>☰</button>
          <div>
            <div className="display" style={{ fontSize: 16 }}>{companyName}</div>
            <div style={{ fontSize: 11.5, color: 'var(--muted)' }}>Fleet Financial Report — {year}</div>
          </div>
          <div className="filters">
            <div className="field"><label>Report From</label><input type="month" value={reportFrom} onChange={e => setReportFrom(e.target.value)} /></div>
            <div className="field"><label>Report To</label><input type="month" value={reportTo} onChange={e => setReportTo(e.target.value)} /></div>
          </div>
          <div style={{ fontSize: 12, display: 'flex', alignItems: 'center', gap: 6 }}>
            {saveStatus === 'saving' && <span style={{ color: 'var(--muted)' }}>● Saving…</span>}
            {saveStatus === 'saved' && <span style={{ color: 'var(--green)' }}>● Saved{lastSaved ? ' ' + lastSaved.toLocaleTimeString() : ''}</span>}
            {saveStatus === 'error' && <span style={{ color: 'var(--red)' }}>● Not saved</span>}
          </div>
          <div className="actions">
            <button className="btn" onClick={exportExcel} title="Exports just the current section">📥 Export Excel</button>
            <button className="btn" onClick={handlePrint} title="Exports just the current section">🖨 Export PDF</button>
            <button className="btn" onClick={exportExcelCumulative} title="Quick Review + P&L + Occupancy + ROI + Feasibility + Financing, all in one workbook">📊 Cumulative Excel</button>
            <button className="btn primary" onClick={handlePrintCumulative} title="Quick Review + P&L + Occupancy + ROI, all in one PDF">📑 Cumulative Report</button>
          </div>
        </header>

        {!isOnline && (
          <div className="no-print" style={{ background: '#FFF6E8', borderBottom: '1px solid var(--amber)', padding: '10px 22px', display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
            <span style={{ color: 'var(--amber)', fontSize: 13, fontWeight: 600 }}>⚠ You're offline.</span>
            <span style={{ fontSize: 12.5, color: 'var(--ink)' }}>You can keep working — your entries stay right here in this tab — but nothing will save until your connection comes back. It'll sync automatically the moment you're back online.</span>
          </div>
        )}

        {showReauth && (
          <div className="no-print" style={{ background: '#FDEDEC', borderBottom: '1px solid var(--red)', padding: '10px 22px', display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
            <span style={{ color: 'var(--red)', fontSize: 13, fontWeight: 600 }}>⚠ Couldn't save — your password may have changed.</span>
            <span style={{ fontSize: 12.5, color: 'var(--ink)' }}>Your current entries are still here in this tab. Re-enter the site password to resume saving:</span>
            <input type="password" placeholder="Site password" value={reauthPw} onChange={e => setReauthPw(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') retryWithNewPassword(); }}
              style={{ padding: '5px 9px', border: '1px solid var(--line)', borderRadius: 6, fontSize: 13 }} />
            <button className="btn small primary" onClick={retryWithNewPassword}>Retry Save</button>
          </div>
        )}

        <div className="main-scroll">
          {activeTab === 'pnl-entry' && <PnlEntry monthKeys={monthKeys} lineItems={lineItems} setLineItems={setLineItems} monthlyData={monthlyData} setMonthlyData={setMonthlyData} currency={currency} deletePin={deletePin} />}
          {activeTab === 'quick-review' && <QuickReviewPanel companyName={companyName} logoDataUrl={logoDataUrl} currency={currency} rangeMonths={rangeMonths} lineItems={lineItems} monthlyData={monthlyData} vehicles={vehicles} occupancy={occupancy} baseDays={baseDays} />}
          {activeTab === 'pnl-compare' && <PnlCompare monthKeys={rangeMonths} lineItems={lineItems} monthlyData={monthlyData} currency={currency} />}
          {activeTab === 'occ-entry' && <OccEntry monthKeys={monthKeys} vehicles={vehicles} occupancy={occupancy} setOccupancy={setOccupancy} baseDays={baseDays} />}
          {activeTab === 'occ-report' && <OccReport monthKeys={rangeMonths} vehicles={vehicles} occupancy={occupancy} baseDays={baseDays} />}
          {activeTab === 'vehicles' && <VehiclesPanel vehicles={vehicles} setVehicles={setVehicles} deletePin={deletePin} currency={currency} />}
          {activeTab === 'veh-revenue' && <VehRevenueEntry monthKeys={monthKeys} vehicles={vehicles} vehicleRevenue={vehicleRevenue} setVehicleRevenue={setVehicleRevenue} currency={currency} />}
          {activeTab === 'model-compare' && <ModelComparePanel rangeMonths={rangeMonths} vehicles={vehicles} vehicleRevenue={vehicleRevenue} defaultUsefulLife={defaultUsefulLife} setDefaultUsefulLife={setDefaultUsefulLife} currency={currency} />}
          {activeTab === 'feasibility' && <FeasibilityPanel studies={feasibilityStudies} setStudies={setFeasibilityStudies} currency={currency} deletePin={deletePin} defaultWorkingDays={baseDays} />}
          {activeTab === 'financing' && <FinancingPanel loans={loans} setLoans={setLoans} vehicles={vehicles} currency={currency} deletePin={deletePin} onPrintLoan={handlePrintLoan} selectedLoanIds={selectedLoanIds} onToggleLoanSelect={toggleLoanSelect} onSelectAllLoans={() => setSelectedLoanIds([])} onSelectOnlyLoan={selectOnlyLoan} />}
          {activeTab === 'chart-of-accounts' && <ChartOfAccountsPanel lineItems={lineItems} setLineItems={setLineItems} deletePin={deletePin} />}
          {activeTab === 'import' && <ImportPanel lineItems={lineItems} setLineItems={setLineItems} monthlyData={monthlyData} setMonthlyData={setMonthlyData} monthKeys={monthKeys} />}
          {activeTab === 'settings' && <SettingsPanel companyName={companyName} setCompanyName={setCompanyName} logoDataUrl={logoDataUrl} setLogoDataUrl={setLogoDataUrl} year={year} setYear={setYear} currency={currency} setCurrency={setCurrency} baseDays={baseDays} setBaseDays={setBaseDays} deletePin={deletePin} setDeletePin={setDeletePin} onDownloadBackup={downloadBackup} onRestoreBackup={restoreBackup} onResetLineItems={resetLineItemsToDefault} onReorderLineItems={reorderLineItemsToDefault} onClearPnl={clearAllPnlData} onClearOccupancy={clearAllOccupancyData} />}
          {activeTab === 'full-report' && <FullReport companyName={companyName} logoDataUrl={logoDataUrl} currency={currency} rangeMonths={rangeMonths} lineItems={lineItems} monthlyData={monthlyData} vehicles={vehicles} occupancy={occupancy} baseDays={baseDays} />}
        </div>
      </div>

      <div className="print-only">
        {printLoanId ? (
          <LoanScheduleReport loan={loans.find(l => l.id === printLoanId)} companyName={companyName} currency={currency} />
        ) : printMode === 'quick-review' ? (
          <div style={{ padding: 24 }}>
            <QuickReviewPanel companyName={companyName} logoDataUrl={logoDataUrl} currency={currency} rangeMonths={rangeMonths} lineItems={lineItems} monthlyData={monthlyData} vehicles={vehicles} occupancy={occupancy} baseDays={baseDays} />
          </div>
        ) : printMode === 'pnl' ? (
          <div style={{ padding: 24 }}>
            <PrintHeader companyName={companyName} logoDataUrl={logoDataUrl} subtitle={`P&L Budget vs Actual · ${rangeMonths.map(monthLabel).join(' – ')}`} />
            <PnlCompare monthKeys={rangeMonths} lineItems={lineItems} monthlyData={monthlyData} currency={currency} />
          </div>
        ) : printMode === 'occupancy' ? (
          <div style={{ padding: 24 }}>
            <PrintHeader companyName={companyName} logoDataUrl={logoDataUrl} subtitle={`Occupancy Report · ${rangeMonths.map(monthLabel).join(' – ')}`} />
            <OccReport monthKeys={rangeMonths} vehicles={vehicles} occupancy={occupancy} baseDays={baseDays} />
          </div>
        ) : printMode === 'model' ? (
          <div style={{ padding: 24 }}>
            <PrintHeader companyName={companyName} logoDataUrl={logoDataUrl} subtitle={`Model Comparison & ROI · ${rangeMonths.map(monthLabel).join(' – ')}`} />
            <ModelComparePanel rangeMonths={rangeMonths} vehicles={vehicles} vehicleRevenue={vehicleRevenue} defaultUsefulLife={defaultUsefulLife} setDefaultUsefulLife={() => {}} currency={currency} />
          </div>
        ) : printMode === 'feasibility' ? (
          <FeasibilityPrintReport studies={feasibilityStudies} currency={currency} companyName={companyName} logoDataUrl={logoDataUrl} />
        ) : printMode === 'financing' ? (
          <FinancingPrintReport loans={financingReportLoans} currency={currency} companyName={companyName} logoDataUrl={logoDataUrl} />
        ) : (
          <FullReport companyName={companyName} logoDataUrl={logoDataUrl} currency={currency} rangeMonths={rangeMonths} lineItems={lineItems} monthlyData={monthlyData} vehicles={vehicles} occupancy={occupancy} baseDays={baseDays} />
        )}
      </div>
    </div>
  );
}

function PrintHeader({ companyName, logoDataUrl, subtitle }) {
  return (
    <div style={{ background: 'linear-gradient(135deg,#161B26,#2D6E8E)', borderRadius: 10, padding: '18px 22px', marginBottom: 18 }}>
      {logoDataUrl && <img src={logoDataUrl} alt="logo" style={{ height: 'auto', width: 'auto', maxHeight: '9vw', minHeight: 28, maxWidth: '30%', objectFit: 'contain', marginBottom: 8, background: '#fff', borderRadius: 6, padding: 4, display: 'block' }} />}
      <h1 style={{ fontSize: 20, color: '#fff', margin: 0 }}>{companyName}</h1>
      <p style={{ color: 'rgba(255,255,255,0.8)', marginTop: 4 }}>{subtitle}</p>
    </div>
  );
}

function FeasibilityPrintReport({ studies, currency, companyName, logoDataUrl }) {
  return (
    <div style={{ padding: 24 }}>
      <PrintHeader companyName={companyName} logoDataUrl={logoDataUrl} subtitle="Vehicle Feasibility Studies" />
      <table style={{ border: '1px solid #ccc' }}>
        <thead><tr>{['Study', 'Total Price', 'Useful Life', 'Required Daily Rate', 'Market Rate', 'Verdict'].map(h => <th key={h} style={{ border: '1px solid #ccc' }}>{h}</th>)}</tr></thead>
        <tbody>
          {studies.map(s => {
            const c = computeFeasibility(s);
            return (
              <tr key={s.id}>
                <td style={{ border: '1px solid #ccc' }}>{s.name}</td>
                <td style={{ border: '1px solid #ccc' }} className="num">{fmt(s.totalPrice, currency)}</td>
                <td style={{ border: '1px solid #ccc' }} className="num">{s.usefulLifeYears} yrs</td>
                <td style={{ border: '1px solid #ccc' }} className="num">{fmt(c.requiredDailyRate, currency)}</td>
                <td style={{ border: '1px solid #ccc' }} className="num">{s.marketDailyRate ? fmt(s.marketDailyRate, currency) : '—'}</td>
                <td style={{ border: '1px solid #ccc' }}>{c.verdict}</td>
              </tr>
            );
          })}
          {studies.length === 0 && <tr><td colSpan={6} style={{ border: '1px solid #ccc', textAlign: 'center', color: 'var(--muted)' }}>No feasibility studies saved yet.</td></tr>}
        </tbody>
      </table>
    </div>
  );
}

function FinancingPrintReport({ loans, currency, companyName, logoDataUrl }) {
  const fleetTotals = loans.reduce((acc, l) => {
    const s = loanStats(l);
    acc.principalBalance += s.balancePrincipal;
    acc.interestBalance += s.balanceInterest;
    acc.totalFinanced += s.totalAmount;
    acc.totalPaid += s.paidAmount;
    return acc;
  }, { principalBalance: 0, interestBalance: 0, totalFinanced: 0, totalPaid: 0 });
  const fleetPaidPct = fleetTotals.totalFinanced ? fleetTotals.totalPaid / fleetTotals.totalFinanced : 0;
  const barData = loans.map(l => { const s = loanStats(l); return { label: l.modelName || '(unnamed)', total: s.totalAmount, paid: s.paidAmount }; });

  return (
    <div style={{ padding: 24 }}>
      <PrintHeader companyName={companyName} logoDataUrl={logoDataUrl} subtitle={`Vehicle Financing Overview — ${loans.map(l => l.modelName || '(unnamed)').join(', ') || 'No cars selected'}`} />

      <div className="kpi-row">
        <div className="kpi-card"><div className="label">Total Loan Amount (Payable)</div><div className="value mono">{fmt(fleetTotals.totalFinanced, currency)}</div></div>
        <div className="kpi-card"><div className="label">Total Paid</div><div className="value mono" style={{ color: 'var(--green)' }}>{fmt(fleetTotals.totalPaid, currency)}</div></div>
        <div className="kpi-card"><div className="label">Total Balance</div><div className="value mono">{fmt(fleetTotals.principalBalance + fleetTotals.interestBalance, currency)}</div></div>
      </div>

      <div className="grid-2">
        <div className="panel" style={{ textAlign: 'center' }}>
          <h3>Overall Paid %</h3>
          <DonutGauge pct={fleetPaidPct} color={fleetPaidPct >= 1 ? '#3E9C6E' : '#2D6E8E'} />
        </div>
        <div className="panel">
          <h3>Loan Amount vs Paid, by Vehicle</h3>
          <GroupedBarChart data={barData} series={[{ key: 'total', label: 'Loan Amount', color: '#D9C8B9' }, { key: 'paid', label: 'Paid', color: '#2D6E8E' }]} height={160} />
        </div>
      </div>

      <table style={{ border: '1px solid #ccc' }}>
        <thead><tr>{['Vehicle', 'Loan Amount', 'Paid', 'Balance', '% Paid'].map(h => <th key={h} style={{ border: '1px solid #ccc' }}>{h}</th>)}</tr></thead>
        <tbody>
          {loans.map(l => {
            const s = loanStats(l);
            return (
              <tr key={l.id}>
                <td style={{ border: '1px solid #ccc' }}>{l.modelName}</td>
                <td style={{ border: '1px solid #ccc' }} className="num">{fmt(s.totalAmount, currency)}</td>
                <td style={{ border: '1px solid #ccc' }} className="num">{fmt(s.paidAmount, currency)}</td>

function ChartOfAccountsPanel({ lineItems, setLineItems, deletePin }) {
  const [newItemText, setNewItemText] = useState({});

  function addItem(sectionKey) {
    const label = (newItemText[sectionKey] || '').trim();
    if (!label) return;
    setLineItems(prev => ({ ...prev, [sectionKey]: [...prev[sectionKey], { key: uid('item'), label }] }));
    setNewItemText({ ...newItemText, [sectionKey]: '' });
  }
  function removeItem(sectionKey, key, label) {
    if (!confirmDelete(label, deletePin)) return;
    setLineItems(prev => ({ ...prev, [sectionKey]: prev[sectionKey].filter(i => i.key !== key) }));
  }
  function renameItem(sectionKey, key, newLabel) {
    setLineItems(prev => ({ ...prev, [sectionKey]: prev[sectionKey].map(it => it.key === key ? { ...it, label: newLabel } : it) }));
  }
  function moveItem(sectionKey, index, delta) {
    setLineItems(prev => {
      const arr = [...prev[sectionKey]];
      const newIndex = index + delta;
      if (newIndex < 0 || newIndex >= arr.length) return prev;
      [arr[index], arr[newIndex]] = [arr[newIndex], arr[index]];
      return { ...prev, [sectionKey]: arr };
    });
  }

  const totalItems = Object.values(lineItems).reduce((s, arr) => s + arr.length, 0);

  return (
    <div>
      <div className="panel">
        <h3>Chart of Accounts</h3>
        <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -6 }}>
          The full list of accounts used across every P&amp;L report — {totalItems} items across 5 sections. Add, rename, reorder, or remove accounts here without monthly figures cluttering the view. Changes apply everywhere: P&amp;L Entry, Compare, and exports.
        </p>
      </div>

      {['revenue', 'direct', 'indirect', 'interest', 'belowLine'].map(sectionKey => (
        <div className="panel" key={sectionKey}>
          <h3 style={{ textAlign: 'left' }}>{SECTION_META[sectionKey].title} <span style={{ fontWeight: 400, color: 'var(--muted)', fontSize: 12, textTransform: 'none' }}>({lineItems[sectionKey].length} accounts)</span></h3>
          <table>
            <thead><tr><th style={{ textAlign: 'left' }}>Account Name</th><th></th></tr></thead>
            <tbody>
              {lineItems[sectionKey].map((item, idx) => (
                <tr key={item.key}>
                  <td style={{ textAlign: 'left' }}>
                    <input value={item.label} onChange={e => renameItem(sectionKey, item.key, e.target.value)}
                      style={{ border: 'none', background: 'transparent', width: '100%', font: 'inherit', padding: 0, color: 'inherit', textAlign: 'left' }} />
                  </td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" disabled={idx === 0} onClick={() => moveItem(sectionKey, idx, -1)} title="Move up">↑</button>{' '}
                    <button className="icon-btn" disabled={idx === lineItems[sectionKey].length - 1} onClick={() => moveItem(sectionKey, idx, 1)} title="Move down">↓</button>{' '}
                    <button className="icon-btn" onClick={() => removeItem(sectionKey, item.key, item.label)} title="Delete">✕</button>
                  </td>
                </tr>
              ))}
              {lineItems[sectionKey].length === 0 && <tr><td colSpan={2} style={{ textAlign: 'center', color: 'var(--muted)', padding: 14 }}>No accounts in this section yet.</td></tr>}
            </tbody>
          </table>
          <div className="add-row">
            <input placeholder={`Add account to ${SECTION_META[sectionKey].title}…`} value={newItemText[sectionKey] || ''}
              onChange={e => setNewItemText({ ...newItemText, [sectionKey]: e.target.value })}
              onKeyDown={e => { if (e.key === 'Enter') addItem(sectionKey); }} />
            <button className="btn small" onClick={() => addItem(sectionKey)}>+ Add</button>
          </div>
        </div>
      ))}
    </div>
  );
}

function PnlEntry({ monthKeys, lineItems, setLineItems, monthlyData, setMonthlyData, currency, deletePin }) {
  const [period, setPeriod] = useState(monthKeys[0]);
  const [newItemText, setNewItemText] = useState({});
  const [bulkItemKey, setBulkItemKey] = useState('');
  const [bulkFrom, setBulkFrom] = useState(monthKeys[0]);
  const [bulkTo, setBulkTo] = useState(monthKeys[monthKeys.length - 1]);
  const [bulkField, setBulkField] = useState('budget');
  const [bulkMode, setBulkMode] = useState('flat');
  const [bulkAmount, setBulkAmount] = useState('');

  function setCell(itemKey, field, value) {
    setMonthlyData(prev => {
      const md = { ...(prev[period] || {}) };
      md[itemKey] = { ...(md[itemKey] || {}), [field]: value };
      return { ...prev, [period]: md };
    });
  }
  function addItem(sectionKey) {
    const label = (newItemText[sectionKey] || '').trim();
    if (!label) return;
    setLineItems(prev => ({ ...prev, [sectionKey]: [...prev[sectionKey], { key: uid('item'), label }] }));
    setNewItemText({ ...newItemText, [sectionKey]: '' });
  }
  function removeItem(sectionKey, key, label) {
    if (!confirmDelete(label, deletePin)) return;
    setLineItems(prev => ({ ...prev, [sectionKey]: prev[sectionKey].filter(i => i.key !== key) }));
  }
  function renameItem(sectionKey, key, newLabel) {
    setLineItems(prev => ({ ...prev, [sectionKey]: prev[sectionKey].map(it => it.key === key ? { ...it, label: newLabel } : it) }));
  }

  function applyBulkBudget() {
    if (!bulkItemKey || !bulkFrom || !bulkTo || bulkFrom > bulkTo) return;
    const months = periodsBetween(bulkFrom, bulkTo);
    if (!months.length) return;
    const amt = num(bulkAmount);
    const perMonthAmt = bulkMode === 'spread' ? amt / months.length : amt;
    setMonthlyData(prev => {
      const next = { ...prev };
      months.forEach(p => {
        next[p] = { ...(next[p] || {}) };
        next[p][bulkItemKey] = { ...(next[p][bulkItemKey] || {}), [bulkField]: perMonthAmt };
      });
      return next;
    });
  }

  function clearBulkRange() {
    if (!bulkItemKey || !bulkFrom || !bulkTo || bulkFrom > bulkTo) return;
    const itemLabel = Object.values(lineItems).flat().find(i => i.key === bulkItemKey)?.label || 'this item';
    if (!confirmDelete(`${bulkField} for "${itemLabel}" from ${monthLabel(bulkFrom)} to ${monthLabel(bulkTo)}`, deletePin)) return;
    const months = periodsBetween(bulkFrom, bulkTo);
    setMonthlyData(prev => {
      const next = { ...prev };
      months.forEach(p => {
        if (!next[p] || !next[p][bulkItemKey]) return;
        next[p] = { ...next[p], [bulkItemKey]: { ...next[p][bulkItemKey], [bulkField]: '' } };
      });
      return next;
    });
  }

  const c = computeMonth(period, monthlyData, lineItems);

  const sectionSubtotal = {
    revenue: { key: 'income', label: 'Total Income' },
    direct: { key: 'direct', label: 'Total Direct Expenses' },
    indirect: { key: 'indirect', label: 'Total Indirect Expenses' },
    interest: { key: 'interest', label: 'Total Interest & Bank Charges' },
  };

  const renderSection = (sectionKey) => (
    <div className="panel" key={sectionKey}>
      <h3 style={{ textAlign: 'left' }}>{SECTION_META[sectionKey].title}</h3>
      <table>
        <thead><tr><th style={{ textAlign: 'left' }}>Line Item</th><th className="num">Budget ({currency})</th><th className="num">Actual ({currency})</th><th></th></tr></thead>
        <tbody>
          {lineItems[sectionKey].map(item => {
            const cellVal = (monthlyData[period] || {})[item.key] || {};
            return (
              <tr key={item.key}>
                <td style={{ textAlign: 'left' }}><input value={item.label} onChange={e => renameItem(sectionKey, item.key, e.target.value)} style={{ border: 'none', background: 'transparent', width: '100%', font: 'inherit', padding: 0, color: 'inherit', textAlign: 'left' }} /></td>
                <td className="num"><input type="number" value={cellVal.budget || ''} onChange={e => setCell(item.key, 'budget', e.target.value)} /></td>
                <td className="num"><input type="number" value={cellVal.actual || ''} onChange={e => setCell(item.key, 'actual', e.target.value)} /></td>
                <td><button className="icon-btn" onClick={() => removeItem(sectionKey, item.key, item.label)}>✕</button></td>
              </tr>
            );
          })}
          {sectionSubtotal[sectionKey] && (
            <tr className="subtotal-row">
              <td>{sectionSubtotal[sectionKey].label}</td>
              <td className="num">{fmt(c[sectionSubtotal[sectionKey].key + '_budget'], currency)}</td>
              <td className="num">{fmt(c[sectionSubtotal[sectionKey].key + '_actual'], currency)}</td>
              <td></td>
            </tr>
          )}
        </tbody>
      </table>
      <div className="add-row">
        <input placeholder={`Add item to ${SECTION_META[sectionKey].title}…`} value={newItemText[sectionKey] || ''}
          onChange={e => setNewItemText({ ...newItemText, [sectionKey]: e.target.value })}
          onKeyDown={e => { if (e.key === 'Enter') addItem(sectionKey); }} />
        <button className="btn small" onClick={() => addItem(sectionKey)}>+ Add</button>
      </div>
    </div>
  );

  return (
    <div>
      <div className="panel">
        <div className="field" style={{ maxWidth: 220 }}>
          <label>Month (any year)</label>
          <input type="month" value={period} onChange={e => setPeriod(e.target.value)} />
        </div>
      </div>

      <div className="panel">
        <h3>Set Budget for a Period</h3>
        <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -6 }}>Apply one figure across the full year, a specific month, or any custom range — instead of retyping the same number 12 times. Works for Budget or Actual.</p>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', alignItems: 'flex-end' }}>
          <div className="field" style={{ flex: '1 1 220px' }}>
            <label>Line Item</label>
            <select value={bulkItemKey} onChange={e => setBulkItemKey(e.target.value)}>
              <option value="">Select a line item…</option>
              {Object.keys(lineItems).map(sec => (
                <optgroup key={sec} label={SECTION_META[sec].title}>
                  {lineItems[sec].map(it => <option key={it.key} value={it.key}>{it.label}</option>)}
                </optgroup>
              ))}
            </select>
          </div>
          <div className="field"><label>From</label><input type="month" value={bulkFrom} onChange={e => setBulkFrom(e.target.value)} /></div>
          <div className="field"><label>To</label><input type="month" value={bulkTo} onChange={e => setBulkTo(e.target.value)} /></div>
          <div className="field"><label>Apply to</label>
            <select value={bulkField} onChange={e => setBulkField(e.target.value)}>
              <option value="budget">Budget</option>
              <option value="actual">Actual</option>
            </select>
          </div>
          <div className="field"><label>Mode</label>
            <select value={bulkMode} onChange={e => setBulkMode(e.target.value)}>
              <option value="flat">Same amount every month</option>
              <option value="spread">Total for period, spread evenly</option>
            </select>
          </div>
          <div className="field"><label>{bulkMode === 'spread' ? 'Total Amount' : 'Amount / Month'} ({currency})</label><input type="number" value={bulkAmount} onChange={e => setBulkAmount(e.target.value)} /></div>
        </div>
        <div style={{ display: 'flex', gap: 8, marginTop: 10, flexWrap: 'wrap' }}>
          <button className="btn small" onClick={() => { setBulkFrom(monthKeys[0]); setBulkTo(monthKeys[monthKeys.length - 1]); }}>Full Year</button>
          <button className="btn small" onClick={() => { setBulkFrom(period); setBulkTo(period); }}>Just Current Month</button>
          <button className="btn primary" onClick={applyBulkBudget}>Apply</button>
          <button className="btn danger" onClick={clearBulkRange}>Clear This Range</button>
        </div>
      </div>

      {renderSection('revenue')}

      <div style={{ border: '1px solid var(--steel)', borderRadius: 10, padding: '14px 16px 4px 16px', marginBottom: 16, background: 'rgba(45,110,142,0.03)' }}>
        <h3 style={{ textAlign: 'left', color: 'var(--steel)', marginBottom: 12 }}>Expenses</h3>
        {renderSection('direct')}
        {renderSection('indirect')}
      </div>

      {renderSection('interest')}
      {renderSection('belowLine')}
      <div className="kpi-row">
        <KpiCard label="Total Income" value={fmt(c.income_actual, currency)} sub={`Budget ${fmt(c.income_budget, currency)}`} diff={c.income_actual - c.income_budget} />
        <KpiCard label="Gross Profit" value={fmt(c.gross_actual, currency)} sub={`Budget ${fmt(c.gross_budget, currency)}`} diff={c.gross_actual - c.gross_budget} />
        <KpiCard label="EBITDA" value={fmt(c.ebitda_actual, currency)} sub={`Budget ${fmt(c.ebitda_budget, currency)}`} diff={c.ebitda_actual - c.ebitda_budget} />
        <KpiCard label="Net Profit" value={fmt(c.netprofit_actual, currency)} sub={`Budget ${fmt(c.netprofit_budget, currency)}`} diff={c.netprofit_actual - c.netprofit_budget} />
      </div>
    </div>
  );
}

function PnlCompare({ monthKeys, lineItems, monthlyData, currency }) {
  const yearData = monthKeys.map(p => { const c = computeMonth(p, monthlyData, lineItems); return { label: monthLabel(p), ...c }; });

  const allRows = useMemo(() => {
    const rows = [];
    ['revenue', 'direct', 'indirect', 'interest', 'belowLine'].forEach(sec => {
      rows.push({ type: 'section', label: SECTION_META[sec].title });
      lineItems[sec].forEach(item => rows.push({ type: 'item', key: item.key, label: item.label, kind: SECTION_META[sec].kind }));
      if (sec === 'revenue') rows.push({ type: 'subtotal', key: 'income', label: 'Total Income', kind: 'income' });
      if (sec === 'direct') {
        rows.push({ type: 'subtotal', key: 'direct', label: 'Total Direct Expenses', kind: 'expense' });
        rows.push({ type: 'subtotal', key: 'gross', label: 'Gross Profit', kind: 'income' });
        rows.push({ type: 'ratio', key: 'grossPct', label: 'Gross Profit %' });
      }
      if (sec === 'indirect') { rows.push({ type: 'subtotal', key: 'indirect', label: 'Total Indirect Expenses', kind: 'expense' }); rows.push({ type: 'subtotal', key: 'ebitda', label: 'EBITDA', kind: 'income' }); }
      if (sec === 'interest') rows.push({ type: 'subtotal', key: 'interest', label: 'Total Interest & Bank Charges', kind: 'expense' });
    });
    rows.push({ type: 'net', key: 'netprofit', label: 'Net Profit', kind: 'income' });
    rows.push({ type: 'ratio', key: 'netPct', label: 'Net Profit %' });
    return rows;
  }, [lineItems]);

  if (monthKeys.length === 0) return <div className="empty-state">No months in the selected report range.</div>;

  return (
    <div>
      <div className="grid-2">
        <div className="panel">
          <h3>Income &amp; Net Profit Trend</h3>
          <LineTrendSVG data={yearData} series={[
            { key: 'income_actual', label: 'Actual Income', color: '#3E9C6E' },
            { key: 'income_budget', label: 'Budget Income', color: '#3E9C6E', dashed: true },
            { key: 'netprofit_actual', label: 'Actual Net Profit', color: '#2D6E8E' },
            { key: 'netprofit_budget', label: 'Budget Net Profit', color: '#2D6E8E', dashed: true },
          ]} />
          <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 8 }}>■ Green = Income · ■ Blue = Net Profit · dashed = Budget</div>
        </div>
        <div className="panel">
          <h3>Budget vs Actual Income</h3>
          <GroupedBarChart data={yearData} series={[
            { key: 'income_budget', label: 'Budget Income', color: '#B9DCC7' },
            { key: 'income_actual', label: 'Actual Income', color: '#3E9C6E' },
            { key: 'totalexp_budget', label: 'Budget Expense', color: '#EFC8B9' },
            { key: 'totalexp_actual', label: 'Actual Expense', color: '#C1503F' },
          ]} />
        </div>
      </div>

      <div className="panel" style={{ overflowX: 'auto' }}>
        <h3>Line-by-Line Comparison</h3>
        <table>
          <thead>
            <tr>
              <th>Particulars</th>
              {monthKeys.map((p, mi) => {
                const tint = mi % 2 === 1 ? '#F7F8F5' : undefined;
                return (
                  <Fragment key={p}>
                    <th className="num" style={{ borderLeft: '2px solid #C9CCC3', background: tint }}>{monthLabel(p)} Budget</th>
                    <th className="num" style={{ background: tint }}>{monthLabel(p)} Actual</th>
                    <th className="num" style={{ background: tint }}>Var %</th>
                  </Fragment>
                );
              })}
            </tr>
          </thead>
          <tbody>
            {allRows.map((row, idx) => {
              if (row.type === 'section') return <tr key={idx} className="section-row"><td colSpan={1 + monthKeys.length * 3}>{row.label}</td></tr>;
              const rowClass = row.type === 'net' ? 'net-row' : row.type === 'subtotal' ? 'subtotal-row' : row.type === 'ratio' ? 'subtotal-row' : '';
              return (
                <tr key={idx} className={rowClass}>
                  <td>{row.label}</td>
                  {monthKeys.map((p, mi) => {
                    const tint = mi % 2 === 1 ? '#F7F8F5' : undefined;
                    let budget, actual;
                    if (row.type === 'item') { const md = (monthlyData[p] || {})[row.key] || {}; budget = num(md.budget); actual = num(md.actual); }
                    else { const c = computeMonth(p, monthlyData, lineItems); budget = c[row.key + '_budget']; actual = c[row.key + '_actual']; }
                    if (row.type === 'ratio') {
                      const ptDiff = actual - budget;
                      return (
                        <Fragment key={p}>
                          <td className="num" style={{ borderLeft: '2px solid #C9CCC3', background: tint }}>{pctStr(budget)}</td>
                          <td className="num" style={{ background: tint }}>{pctStr(actual)}</td>
                          <td className="num" style={{ background: tint }}><span className={`badge ${ptDiff >= 0 ? 'pos' : 'neg'}`}>{(ptDiff >= 0 ? '+' : '') + (ptDiff * 100).toFixed(1) + 'pt'}</span></td>
                        </Fragment>
                      );
                    }
                    const v = rowVariance(budget, actual, row.kind);
                    return (
                      <Fragment key={p}>
                        <td className="num" style={{ borderLeft: '2px solid #C9CCC3', background: tint }}>{fmt(budget, currency)}</td>
                        <td className="num" style={{ background: tint }}>{fmt(actual, currency)}</td>
                        <td className="num" style={{ background: tint }}><span className={`badge ${v.favorable ? 'pos' : 'neg'}`}>{v.pct === null ? '—' : pctStr(v.pct)}</span></td>
                      </Fragment>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}
