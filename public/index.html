function ChartOfAccountsPanel({ lineItems, setLineItems, deletePin }) {
  const [newItemText, setNewItemText] = useState({});
  const [expandedKeys, setExpandedKeys] = useState({});
  const [newSubText, setNewSubText] = useState({});

  function addItem(sectionKey) {
    const label = (newItemText[sectionKey] || '').trim();
    if (!label) return;
    setLineItems(prev => ({ ...prev, [sectionKey]: [...prev[sectionKey], { key: uid('item'), label }] }));
    setNewItemText({ ...newItemText, [sectionKey]: '' });
  }
  function removeItem(sectionKey, key, label) {
    if (!confirmDelete(label, deletePin)) return;
    setLineItems(prev => ({ ...prev, [sectionKey]: prev[sectionKey].filter(i => i.key !== key) }));
  }
  function renameItem(sectionKey, key, newLabel) {
    setLineItems(prev => ({ ...prev, [sectionKey]: prev[sectionKey].map(it => it.key === key ? { ...it, label: newLabel } : it) }));
  }
  function moveItem(sectionKey, index, delta) {
    setLineItems(prev => {
      const arr = [...prev[sectionKey]];
      const newIndex = index + delta;
      if (newIndex < 0 || newIndex >= arr.length) return prev;
      [arr[index], arr[newIndex]] = [arr[newIndex], arr[index]];
      return { ...prev, [sectionKey]: arr };
    });
  }
  function addSubAccount(sectionKey, parentKey) {
    const label = (newSubText[parentKey] || '').trim();
    if (!label) return;
    setLineItems(prev => ({
      ...prev,
      [sectionKey]: prev[sectionKey].map(it => it.key === parentKey
        ? { ...it, subAccounts: [...(it.subAccounts || []), { key: uid('sub'), label }] }
        : it),
    }));
    setNewSubText({ ...newSubText, [parentKey]: '' });
    setExpandedKeys({ ...expandedKeys, [parentKey]: true });
  }
  function renameSubAccount(sectionKey, parentKey, subKey, newLabel) {
    setLineItems(prev => ({
      ...prev,
      [sectionKey]: prev[sectionKey].map(it => it.key === parentKey
        ? { ...it, subAccounts: (it.subAccounts || []).map(s => s.key === subKey ? { ...s, label: newLabel } : s) }
        : it),
    }));
  }
  function removeSubAccount(sectionKey, parentKey, subKey, label) {
    if (!confirmDelete(label, deletePin)) return;
    setLineItems(prev => ({
      ...prev,
      [sectionKey]: prev[sectionKey].map(it => it.key === parentKey
        ? { ...it, subAccounts: (it.subAccounts || []).filter(s => s.key !== subKey) }
        : it),
    }));
  }

  const totalItems = Object.values(lineItems).reduce((s, arr) => s + arr.length, 0);

  return (
    <div>
      <div className="panel">
        <h3>Chart of Accounts</h3>
        <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -6 }}>
          The full list of accounts used across every P&amp;L report — {totalItems} items across 5 sections. Add, rename, reorder, or remove accounts here without monthly figures cluttering the view. Changes apply everywhere: P&amp;L Entry, Compare, and exports. Any account can have sub-accounts (e.g. "Utility Expense" → Electricity/Water/Internet) — expand with the + to add or manage them; reports always show only the parent line.
        </p>
      </div>

      {['revenue', 'direct', 'indirect', 'interest', 'belowLine'].map(sectionKey => (
        <div className="panel" key={sectionKey}>
          <h3 style={{ textAlign: 'left' }}>{SECTION_META[sectionKey].title} <span style={{ fontWeight: 400, color: 'var(--muted)', fontSize: 12, textTransform: 'none' }}>({lineItems[sectionKey].length} accounts)</span></h3>
          <table>
            <thead><tr><th style={{ textAlign: 'left' }}>Account Name</th><th></th></tr></thead>
            <tbody>
              {lineItems[sectionKey].map((item, idx) => {
                const hasSubs = item.subAccounts && item.subAccounts.length > 0;
                const isExpanded = !!expandedKeys[item.key];
                return (
                <Fragment key={item.key}>
                <tr>
                  <td style={{ textAlign: 'left' }}>
                    <span onClick={() => setExpandedKeys({ ...expandedKeys, [item.key]: !isExpanded })} title={isExpanded ? 'Collapse' : 'Expand to add/manage sub-accounts'} style={{ cursor: 'pointer', display: 'inline-block', width: 16, color: 'var(--steel)', fontWeight: 700 }}>{isExpanded ? '−' : '+'}</span>
                    <input value={item.label} onChange={e => renameItem(sectionKey, item.key, e.target.value)}
                      style={{ border: 'none', background: 'transparent', width: 'calc(100% - 20px)', font: 'inherit', fontWeight: 700, padding: 0, color: 'inherit', textAlign: 'left' }} />
                  </td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" disabled={idx === 0} onClick={() => moveItem(sectionKey, idx, -1)} title="Move up">↑</button>{' '}
                    <button className="icon-btn" disabled={idx === lineItems[sectionKey].length - 1} onClick={() => moveItem(sectionKey, idx, 1)} title="Move down">↓</button>{' '}
                    <button className="icon-btn" onClick={() => removeItem(sectionKey, item.key, item.label)} title="Delete">✕</button>
                  </td>
                </tr>
                {isExpanded && (
                  <>
                    {(item.subAccounts || []).map(sub => (
                      <tr key={sub.key} style={{ background: '#FAFAF8' }}>
                        <td style={{ textAlign: 'left', paddingLeft: 30 }}>
                          <input value={sub.label} onChange={e => renameSubAccount(sectionKey, item.key, sub.key, e.target.value)}
                            style={{ border: 'none', background: 'transparent', width: '100%', fontSize: 12.5, color: 'var(--muted)', padding: 0, textAlign: 'left' }} />
                        </td>
                        <td style={{ textAlign: 'right' }}><button className="icon-btn" onClick={() => removeSubAccount(sectionKey, item.key, sub.key, sub.label)}>✕</button></td>
                      </tr>
                    ))}
                    <tr style={{ background: '#FAFAF8' }}>
                      <td colSpan={2} style={{ paddingLeft: 30 }}>
                        <div className="add-row">
                          <input placeholder="Add sub-account…" value={newSubText[item.key] || ''}
                            onChange={e => setNewSubText({ ...newSubText, [item.key]: e.target.value })}
                            onKeyDown={e => { if (e.key === 'Enter') addSubAccount(sectionKey, item.key); }} />
                          <button className="btn small" onClick={() => addSubAccount(sectionKey, item.key)}>+ Add Sub-Account</button>
                        </div>
                      </td>
                    </tr>
                  </>
                )}
                </Fragment>
                );
              })}
              {lineItems[sectionKey].length === 0 && <tr><td colSpan={2} style={{ textAlign: 'center', color: 'var(--muted)', padding: 14 }}>No accounts in this section yet.</td></tr>}
            </tbody>
          </table>
          <div className="add-row">
            <input placeholder={`Add account to ${SECTION_META[sectionKey].title}…`} value={newItemText[sectionKey] || ''}
              onChange={e => setNewItemText({ ...newItemText, [sectionKey]: e.target.value })}
              onKeyDown={e => { if (e.key === 'Enter') addItem(sectionKey); }} />
            <button className="btn small" onClick={() => addItem(sectionKey)}>+ Add</button>
          </div>
        </div>
      ))}
    </div>
  );
}

function PnlEntry({ monthKeys, lineItems, setLineItems, monthlyData, setMonthlyData, currency, deletePin, period, setPeriod, monthlyRemarks, setMonthlyRemarks, insurancePolicies, insuranceOverrides, setInsuranceOverrides }) {
  const [newItemText, setNewItemText] = useState({});
  const [bulkItemKey, setBulkItemKey] = useState('');
  const [bulkFrom, setBulkFrom] = useState(monthKeys[0]);
  const [bulkTo, setBulkTo] = useState(monthKeys[monthKeys.length - 1]);
  const [bulkField, setBulkField] = useState('budget');
  const [bulkMode, setBulkMode] = useState('flat');
  const [bulkAmount, setBulkAmount] = useState('');
  const [bulkSuccess, setBulkSuccess] = useState(false);


  function resetThisPage() {
    if (!confirmDelete(`ALL Budget and Actual entries for ${monthLabel(period)} on this page`, deletePin)) return;
    setMonthlyData(prev => {
      const next = { ...prev };
      delete next[period];
      return next;
    });
  }

  function setCell(itemKey, field, value) {
    setMonthlyData(prev => {
      const md = { ...(prev[period] || {}) };
      md[itemKey] = { ...(md[itemKey] || {}), [field]: value };
      return { ...prev, [period]: md };
    });
  }
  function addItem(sectionKey) {
    const label = (newItemText[sectionKey] || '').trim();
    if (!label) return;
    setLineItems(prev => ({ ...prev, [sectionKey]: [...prev[sectionKey], { key: uid('item'), label }] }));
    setNewItemText({ ...newItemText, [sectionKey]: '' });
  }
  function removeItem(sectionKey, key, label) {
    if (!confirmDelete(label, deletePin)) return;
    setLineItems(prev => ({ ...prev, [sectionKey]: prev[sectionKey].filter(i => i.key !== key) }));
  }
  function renameItem(sectionKey, key, newLabel) {
    setLineItems(prev => ({ ...prev, [sectionKey]: prev[sectionKey].map(it => it.key === key ? { ...it, label: newLabel } : it) }));
  }

  function applyBulkBudget() {
    if (!bulkItemKey || !bulkFrom || !bulkTo || bulkFrom > bulkTo) return;
    const months = periodsBetween(bulkFrom, bulkTo);
    if (!months.length) return;
    const amt = num(bulkAmount);
    const perMonthAmt = bulkMode === 'spread' ? amt / months.length : amt;
    setMonthlyData(prev => {
      const next = { ...prev };
      months.forEach(p => {
        next[p] = { ...(next[p] || {}) };
        next[p][bulkItemKey] = { ...(next[p][bulkItemKey] || {}), [bulkField]: perMonthAmt };
      });
      return next;
    });
    setBulkAmount('');
    setBulkSuccess(true);
    setTimeout(() => setBulkSuccess(false), 2500);
  }

  function clearBulkRange() {
    if (!bulkItemKey || !bulkFrom || !bulkTo || bulkFrom > bulkTo) return;
    const itemLabel = Object.values(lineItems).flat().find(i => i.key === bulkItemKey)?.label || 'this item';
    if (!confirmDelete(`${bulkField} for "${itemLabel}" from ${monthLabel(bulkFrom)} to ${monthLabel(bulkTo)}`, deletePin)) return;
    const months = periodsBetween(bulkFrom, bulkTo);
    setMonthlyData(prev => {
      const next = { ...prev };
      months.forEach(p => {
        if (!next[p] || !next[p][bulkItemKey]) return;
        next[p] = { ...next[p], [bulkItemKey]: { ...next[p][bulkItemKey], [bulkField]: '' } };
      });
      return next;
    });
  }

  const c = computeMonth(period, monthlyData, lineItems);

  const sectionSubtotal = {
    revenue: { key: 'income', label: 'Total Income' },
    direct: { key: 'direct', label: 'Total Direct Expenses' },
    indirect: { key: 'indirect', label: 'Total Indirect Expenses' },
    interest: { key: 'interest', label: 'Total Interest & Bank Charges' },
  };

  function handleCellKeyDown(e, sectionKey, idx, field) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const items = lineItems[sectionKey];
    if (idx < items.length - 1) {
      const next = document.getElementById(`cell-${sectionKey}-${idx + 1}-${field}`);
      if (next) next.focus();
    }
  }
  function commitCellExpr(itemKey, field, rawValue) {
    const evaluated = evalExpr(rawValue);
    if (evaluated !== null) setCell(itemKey, field, evaluated);
  }
  const [expandedItems, setExpandedItems] = useState({});

  const renderSection = (sectionKey) => (
    <div className="panel" key={sectionKey} style={sectionKey === 'belowLine' ? { border: '1px solid var(--green)', background: 'rgba(62,156,110,0.04)' } : undefined}>
      <h3 style={{ textAlign: 'left', color: sectionKey === 'belowLine' ? 'var(--green)' : undefined }}>{sectionKey === 'belowLine' ? '+ ' : ''}{SECTION_META[sectionKey].title}</h3>
      <table>
        <thead><tr><th style={{ textAlign: 'left' }}>Line Item</th><th className="num">Budget</th><th className="num">Actual</th><th style={{ textAlign: 'left' }}>Notes</th></tr></thead>
        <tbody>
          {lineItems[sectionKey].map((item, idx) => {
            const cellVal = (monthlyData[period] || {})[item.key] || {};
            const isInsuranceRow = item.key === 'insuranceCharges';
            const insuranceAuto = isInsuranceRow ? insuranceMonthlyTotal(period, insurancePolicies) : null;
            const isOverridden = isInsuranceRow && insuranceOverrides[period];
            const hasSubs = item.subAccounts && item.subAccounts.length > 0;
            const isExpanded = !!expandedItems[item.key];
            return (
              <Fragment key={item.key}>
              <tr>
                <td style={{ textAlign: 'left' }}>
                  {hasSubs && <span onClick={() => setExpandedItems({ ...expandedItems, [item.key]: !isExpanded })} style={{ cursor: 'pointer', display: 'inline-block', width: 16, color: 'var(--steel)', fontWeight: 700 }}>{isExpanded ? '−' : '+'}</span>}
                  <input value={item.label} onChange={e => renameItem(sectionKey, item.key, e.target.value)} tabIndex={-1} style={{ border: 'none', background: 'transparent', width: hasSubs ? 'calc(100% - 20px)' : '100%', font: 'inherit', fontWeight: hasSubs ? 700 : 400, padding: 0, color: 'inherit', textAlign: 'left' }} />
                </td>
                <td className="num">
                  {hasSubs ? (
                    <input disabled value={itemFieldValue(item, monthlyData, period, 'budget').toFixed(2)} style={{ background: '#F2F3F0', color: 'var(--muted)', textAlign: 'right', fontWeight: 700 }} title="Sum of sub-accounts" />
                  ) : (
                    <input id={`cell-${sectionKey}-${idx}-budget`} type="number" value={cellVal.budget || ''}
                      onChange={e => setCell(item.key, 'budget', e.target.value)}
                      onBlur={e => commitCellExpr(item.key, 'budget', e.target.value)}
                      onKeyDown={e => handleCellKeyDown(e, sectionKey, idx, 'budget')} />
                  )}
                </td>
                <td className="num">
                  {hasSubs ? (
                    <input disabled value={itemFieldValue(item, monthlyData, period, 'actual').toFixed(2)} style={{ background: '#F2F3F0', color: 'var(--muted)', textAlign: 'right', fontWeight: 700 }} title="Sum of sub-accounts" />
                  ) : isInsuranceRow && !isOverridden ? (
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, justifyContent: 'flex-end' }}>
                      <input disabled value={insuranceAuto ? insuranceAuto.toFixed(2) : '0.00'} style={{ background: '#F2F3F0', color: 'var(--muted)', textAlign: 'right' }} title="Auto-calculated from Insurance Policies" />
                      <button className="icon-btn" title="Override this month" onClick={() => setInsuranceOverrides(prev => ({ ...prev, [period]: true }))}>✎</button>
                    </div>
                  ) : (
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, justifyContent: 'flex-end' }}>
                      <input id={`cell-${sectionKey}-${idx}-actual`} type="number" value={cellVal.actual || ''}
                        onChange={e => setCell(item.key, 'actual', e.target.value)}
                        onBlur={e => commitCellExpr(item.key, 'actual', e.target.value)}
                        onKeyDown={e => handleCellKeyDown(e, sectionKey, idx, 'actual')} />
                      {isInsuranceRow && <button className="icon-btn" title="Back to auto" onClick={() => setInsuranceOverrides(prev => { const n = { ...prev }; delete n[period]; return n; })}>↺</button>}
                    </div>
                  )}
                </td>
                <td style={{ textAlign: 'left' }}>
                  <input value={cellVal.notes || ''} onChange={e => setCell(item.key, 'notes', e.target.value)} tabIndex={-1} placeholder="—"
                    style={{ border: 'none', background: 'transparent', width: '100%', font: 'inherit', padding: 0, color: 'var(--muted)', fontSize: 12.5, textAlign: 'left' }} />
                </td>
              </tr>
              {isExpanded && (item.subAccounts || []).map(sub => {
                const subVal = (monthlyData[period] || {})[sub.key] || {};
                return (
                  <tr key={sub.key} style={{ background: '#FAFAF8' }}>
                    <td style={{ textAlign: 'left', paddingLeft: 30, fontSize: 12.5, color: 'var(--muted)' }}>{sub.label}</td>
                    <td className="num">
                      <input type="number" value={subVal.budget || ''} onChange={e => setCell(sub.key, 'budget', e.target.value)} onBlur={e => commitCellExpr(sub.key, 'budget', e.target.value)} style={{ fontSize: 12.5 }} />
                    </td>
                    <td className="num">
                      <input type="number" value={subVal.actual || ''} onChange={e => setCell(sub.key, 'actual', e.target.value)} onBlur={e => commitCellExpr(sub.key, 'actual', e.target.value)} style={{ fontSize: 12.5 }} />
                    </td>
                    <td></td>
                  </tr>
                );
              })}
              </Fragment>
            );
          })}
          {sectionSubtotal[sectionKey] && (
            <tr className="subtotal-row">
              <td>{sectionSubtotal[sectionKey].label}</td>
              <td className="num">{fmt(c[sectionSubtotal[sectionKey].key + '_budget'], currency)}</td>
              <td className="num">{fmt(c[sectionSubtotal[sectionKey].key + '_actual'], currency)}</td>
              <td></td>
            </tr>
          )}
        </tbody>
      </table>
      <div className="add-row">
        <input placeholder={`Add item to ${SECTION_META[sectionKey].title}…`} value={newItemText[sectionKey] || ''}
          onChange={e => setNewItemText({ ...newItemText, [sectionKey]: e.target.value })}
          onKeyDown={e => { if (e.key === 'Enter') addItem(sectionKey); }} />
        <button className="btn small" onClick={() => addItem(sectionKey)}>+ Add</button>
      </div>
    </div>
  );

  return (
    <div>
      <div className="panel">
        <MonthNavigator period={period} setPeriod={setPeriod} />
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 6 }}>
          <span style={{ fontSize: 11.5, color: 'var(--muted)' }}>Amounts in {currency}</span>
          <button className="btn small" style={{ color: 'var(--red)', borderColor: 'var(--red)' }} onClick={resetThisPage}>Reset This Page</button>
        </div>
      </div>

      <div className="panel">
        <h3>Set Budget for a Period</h3>
        <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -6 }}>Apply one figure across the full year, a specific month, or any custom range — instead of retyping the same number 12 times. Works for Budget or Actual.</p>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', alignItems: 'flex-end' }}>
          <div className="field" style={{ flex: '1 1 220px' }}>
            <label>Line Item</label>
            <select value={bulkItemKey} onChange={e => setBulkItemKey(e.target.value)}>
              <option value="">Select a line item…</option>
              {Object.keys(lineItems).map(sec => (
                <optgroup key={sec} label={SECTION_META[sec].title}>
                  {lineItems[sec].map(it => <option key={it.key} value={it.key}>{it.label}</option>)}
                </optgroup>
              ))}
            </select>
          </div>
          <div className="field"><label>From</label><input type="month" value={bulkFrom} onChange={e => setBulkFrom(e.target.value)} /></div>
          <div className="field"><label>To</label><input type="month" value={bulkTo} onChange={e => setBulkTo(e.target.value)} /></div>
          <div className="field"><label>Apply to</label>
            <select value={bulkField} onChange={e => setBulkField(e.target.value)}>
              <option value="budget">Budget</option>
              <option value="actual">Actual</option>
            </select>
          </div>
          <div className="field"><label>Mode</label>
            <select value={bulkMode} onChange={e => setBulkMode(e.target.value)}>
              <option value="flat">Same amount every month</option>
              <option value="spread">Total for period, spread evenly</option>
            </select>
          </div>
          <div className="field"><label>{bulkMode === 'spread' ? 'Total Amount' : 'Amount / Month'} ({currency})</label><input type="number" value={bulkAmount} onChange={e => setBulkAmount(e.target.value)} /></div>
        </div>
        <div style={{ display: 'flex', gap: 8, marginTop: 10, flexWrap: 'wrap', alignItems: 'center' }}>
          <button className="btn small" onClick={() => { setBulkFrom(monthKeys[0]); setBulkTo(monthKeys[monthKeys.length - 1]); }}>Full Year</button>
          <button className="btn small" onClick={() => { setBulkFrom(period); setBulkTo(period); }}>Just Current Month</button>
          <button className="btn primary" onClick={applyBulkBudget}>Apply</button>
          <button className="btn danger" onClick={clearBulkRange}>Clear This Range</button>
          {bulkSuccess && <span style={{ color: 'var(--green)', fontSize: 12.5, fontWeight: 600 }}>✓ Entry successful</span>}
        </div>
      </div>

      {renderSection('revenue')}

      <div style={{ border: '1px solid var(--steel)', borderRadius: 10, padding: '14px 16px 4px 16px', marginBottom: 16, background: 'rgba(45,110,142,0.03)' }}>
        <h3 style={{ textAlign: 'left', color: 'var(--steel)', marginBottom: 12 }}>Expenses</h3>
        {renderSection('direct')}
        {renderSection('indirect')}
      </div>

      {renderSection('interest')}

      <div className="panel" style={{ background: '#EAE2D4', border: 'none' }}>
        <table>
          <tbody>
            <tr className="totalexp-row">
              <td style={{ textAlign: 'left', fontWeight: 700 }}>Total Expenses (Direct + Indirect + Bank Charges)</td>
              <td className="num" style={{ width: 160 }}>{fmt(c.totalexp_budget, currency)}</td>
              <td className="num" style={{ width: 160 }}>{fmt(c.totalexp_actual, currency)}</td>
            </tr>
          </tbody>
        </table>
      </div>

      {renderSection('belowLine')}
      <div className="kpi-row">
        <KpiCard label="Total Income" value={fmt(c.income_actual, currency)} sub={`Budget ${fmt(c.income_budget, currency)}`} diff={c.income_actual - c.income_budget} />
        <KpiCard label="Total Expenses" value={fmt(c.totalexp_actual, currency)} sub={`Budget ${fmt(c.totalexp_budget, currency)}`} diff={c.totalexp_budget - c.totalexp_actual} />
        <KpiCard label="Gross Profit" value={fmt(c.gross_actual, currency)} sub={`Budget ${fmt(c.gross_budget, currency)}`} diff={c.gross_actual - c.gross_budget} />
        <KpiCard label="EBITDA" value={fmt(c.ebitda_actual, currency)} sub={`Budget ${fmt(c.ebitda_budget, currency)}`} diff={c.ebitda_actual - c.ebitda_budget} />
        <KpiCard label="Net Profit" value={fmt(c.netprofit_actual, currency)} sub={`Budget ${fmt(c.netprofit_budget, currency)}`} diff={c.netprofit_actual - c.netprofit_budget} rawValue={c.netprofit_actual} signColor />
      </div>

      <div className="panel">
        <h3>Remarks &amp; Recommendations — {monthLabel(period)}</h3>
        <p style={{ fontSize: 12, color: 'var(--muted)', marginTop: -6 }}>Management-level commentary for this month. Unlike the per-row Notes above, this also appears in printed/exported PDF reports.</p>
        <textarea value={monthlyRemarks[period] || ''} onChange={e => setMonthlyRemarks(prev => ({ ...prev, [period]: e.target.value }))}
          rows={4} placeholder="e.g. Revenue down due to 2 vehicles under maintenance; expect recovery next month once Insurance renewal completes."
          style={{ width: '100%', border: '1px solid var(--line)', borderRadius: 6, padding: 8, fontSize: 13, boxSizing: 'border-box', fontFamily: 'inherit' }} />
      </div>
    </div>
  );
}

/* ---------------- P&L Compare (uses global report range) ---------------- */

function PnlCompare({ monthKeys, lineItems, monthlyData, currency }) {
  const yearData = monthKeys.map(p => { const c = computeMonth(p, monthlyData, lineItems); return { label: monthLabel(p), ...c }; });

  const allRows = useMemo(() => {
    const rows = [];
    ['revenue', 'direct', 'indirect', 'interest', 'belowLine'].forEach(sec => {
      rows.push({ type: 'section', label: SECTION_META[sec].title });
      lineItems[sec].forEach(item => rows.push({ type: 'item', key: item.key, label: item.label, kind: SECTION_META[sec].kind, item }));
      if (sec === 'revenue') rows.push({ type: 'subtotal', key: 'income', label: 'Total Income', kind: 'income' });
      if (sec === 'direct') {
        rows.push({ type: 'subtotal', key: 'direct', label: 'Total Direct Expenses', kind: 'expense' });
        rows.push({ type: 'subtotal', key: 'gross', label: 'Gross Profit', kind: 'income' });
        rows.push({ type: 'ratio', key: 'grossPct', label: 'Gross Profit %' });
      }
      if (sec === 'indirect') { rows.push({ type: 'subtotal', key: 'indirect', label: 'Total Indirect Expenses', kind: 'expense' }); rows.push({ type: 'subtotal', key: 'ebitda', label: 'EBITDA', kind: 'income' }); }
      if (sec === 'interest') {
        rows.push({ type: 'subtotal', key: 'interest', label: 'Total Interest & Bank Charges', kind: 'expense' });
        rows.push({ type: 'totalexp', key: 'totalexp', label: 'Total Expenses (Direct + Indirect + Bank Charges)', kind: 'expense' });
      }
    });
    rows.push({ type: 'net', key: 'netprofit', label: 'Net Profit', kind: 'income' });
    rows.push({ type: 'ratio', key: 'netPct', label: 'Net Profit %' });
    return rows;
  }, [lineItems]);

  if (monthKeys.length === 0) return <div className="empty-state">No months in the selected report range.</div>;

  const showPeriodTotal = monthKeys.length > 1;
  function periodTotal(row) {
    let budget = 0, actual = 0;
    monthKeys.forEach(p => {
      if (row.type === 'item') { budget += itemFieldValue(row.item, monthlyData, p, 'budget'); actual += itemFieldValue(row.item, monthlyData, p, 'actual'); }
      else { const c = computeMonth(p, monthlyData, lineItems); budget += c[row.key + '_budget']; actual += c[row.key + '_actual']; }
    });
    return { budget, actual };
  }

  return (
    <div>
      <div className="grid-2">
        <div className="panel">
          <h3>Income &amp; Net Profit Trend</h3>
          <LineTrendSVG data={yearData} series={[
            { key: 'income_actual', label: 'Actual Income', color: '#3E9C6E' },
            { key: 'income_budget', label: 'Budget Income', color: '#3E9C6E', dashed: true },
            { key: 'netprofit_actual', label: 'Actual Net Profit', color: '#2D6E8E' },
            { key: 'netprofit_budget', label: 'Budget Net Profit', color: '#2D6E8E', dashed: true },
          ]} />
          <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 8 }}>■ Green = Income · ■ Blue = Net Profit · dashed = Budget</div>
        </div>
        <div className="panel">
          <h3>Budget vs Actual Income</h3>
          <GroupedBarChart data={yearData} series={[
            { key: 'income_budget', label: 'Budget Income', color: '#B9DCC7' },
            { key: 'income_actual', label: 'Actual Income', color: '#3E9C6E' },
            { key: 'totalexp_budget', label: 'Budget Expense', color: '#EFC8B9' },
            { key: 'totalexp_actual', label: 'Actual Expense', color: '#C1503F' },
          ]} />
        </div>
      </div>

      <div className="panel" style={{ overflowX: 'auto' }}>
        <h3>Line-by-Line Comparison</h3>
        <table>
          <thead>
            <tr>
              <th>Particulars</th>
              {monthKeys.map((p, mi) => {
                const tint = mi % 2 === 1 ? '#F7F8F5' : undefined;
                return (
                  <Fragment key={p}>
                    <th className="num" style={{ borderLeft: '2px solid #C9CCC3', background: tint }}>{monthLabel(p)} Budget</th>
                    <th className="num" style={{ background: tint }}>{monthLabel(p)} Actual</th>
                    <th className="num" style={{ background: tint }}>Var %</th>
                  </Fragment>
                );
              })}
              {showPeriodTotal && (
                <Fragment>
                  <th className="num" style={{ borderLeft: '3px solid var(--steel)', background: '#EAF0F3' }}>Period Total Budget</th>
                  <th className="num" style={{ background: '#EAF0F3' }}>Period Total Actual</th>
                  <th className="num" style={{ background: '#EAF0F3' }}>Var %</th>
                </Fragment>
              )}
            </tr>
          </thead>
          <tbody>
            {allRows.map((row, idx) => {
              if (row.type === 'section') return <tr key={idx} className="section-row"><td colSpan={1 + monthKeys.length * 3 + (showPeriodTotal ? 3 : 0)}>{row.label}</td></tr>;
              const rowClass = row.type === 'net' ? 'net-row' : row.type === 'totalexp' ? 'totalexp-row' : row.type === 'subtotal' ? 'subtotal-row' : row.type === 'ratio' ? 'subtotal-row' : '';
              const pt = showPeriodTotal ? periodTotal(row) : null;
              let ptBudget = pt ? pt.budget : 0, ptActual = pt ? pt.actual : 0;
              if (row.type === 'ratio' && pt) {
                const baseKey = row.key === 'grossPct' ? 'gross' : 'netprofit';
                const incTotal = periodTotal({ type: 'subtotal', key: 'income' });
                const baseTotal = periodTotal({ type: 'subtotal', key: baseKey });
                ptBudget = incTotal.budget ? baseTotal.budget / incTotal.budget : 0;
                ptActual = incTotal.actual ? baseTotal.actual / incTotal.actual : 0;
              }
              return (
                <tr key={idx} className={rowClass}>
                  <td>{row.label}</td>
                  {monthKeys.map((p, mi) => {
                    const tint = mi % 2 === 1 ? '#F7F8F5' : undefined;
                    let budget, actual;
                    if (row.type === 'item') { budget = itemFieldValue(row.item, monthlyData, p, 'budget'); actual = itemFieldValue(row.item, monthlyData, p, 'actual'); }
                    else { const c = computeMonth(p, monthlyData, lineItems); budget = c[row.key + '_budget']; actual = c[row.key + '_actual']; }
                    if (row.type === 'ratio') {
                      const ptDiff = actual - budget;
                      return (
                        <Fragment key={p}>
                          <td className="num" style={{ borderLeft: '2px solid #C9CCC3', background: tint }}>{pctStr(budget)}</td>
                          <td className="num" style={{ background: tint }}>{pctStr(actual)}</td>
                          <td className="num" style={{ background: tint }}><span className={`badge ${ptDiff >= 0 ? 'pos' : 'neg'}`}>{(ptDiff >= 0 ? '+' : '') + (ptDiff * 100).toFixed(1) + 'pt'}</span></td>
                        </Fragment>
                      );
                    }
                    const v = rowVariance(budget, actual, row.kind);
                    return (
                      <Fragment key={p}>
                        <td className="num" style={{ borderLeft: '2px solid #C9CCC3', background: tint }}>{fmt(budget, currency)}</td>
                        <td className="num" style={{ background: tint }}>{fmt(actual, currency)}</td>
                        <td className="num" style={{ background: tint }}><span className={`badge ${v.favorable ? 'pos' : 'neg'}`}>{v.pct === null ? '—' : pctStr(v.pct)}</span></td>
                      </Fragment>
                    );
                  })}
                  {showPeriodTotal && (row.type === 'ratio' ? (
                    <Fragment>
                      <td className="num" style={{ borderLeft: '3px solid var(--steel)', background: '#EAF0F3', fontWeight: 700 }}>{pctStr(ptBudget)}</td>
                      <td className="num" style={{ background: '#EAF0F3', fontWeight: 700 }}>{pctStr(ptActual)}</td>
                      <td className="num" style={{ background: '#EAF0F3', fontWeight: 700 }}><span className={`badge ${ptActual >= ptBudget ? 'pos' : 'neg'}`}>{((ptActual - ptBudget) >= 0 ? '+' : '') + ((ptActual - ptBudget) * 100).toFixed(1) + 'pt'}</span></td>
                    </Fragment>
                  ) : (
                    <Fragment>
                      <td className="num" style={{ borderLeft: '3px solid var(--steel)', background: '#EAF0F3', fontWeight: 700 }}>{fmt(ptBudget, currency)}</td>
                      <td className="num" style={{ background: '#EAF0F3', fontWeight: 700 }}>{fmt(ptActual, currency)}</td>
                      <td className="num" style={{ background: '#EAF0F3', fontWeight: 700 }}>{(() => { const v = rowVariance(ptBudget, ptActual, row.kind); return <span className={`badge ${v.favorable ? 'pos' : 'neg'}`}>{v.pct === null ? '—' : pctStr(v.pct)}</span>; })()}</td>
                    </Fragment>
                  ))}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------------- Occupancy Entry ---------------- */

function OccEntry({ monthKeys, vehicles, occupancy, setOccupancy, baseDays }) {
  const [period, setPeriod] = useState(monthKeys[0]);
  const [search, setSearch] = useState('');

  function setDays(vehicleId, value) { setOccupancy(prev => ({ ...prev, [period]: { ...(prev[period] || {}), [vehicleId]: value } })); }
  function fillAll(value) { setOccupancy(prev => { const m = { ...(prev[period] || {}) }; vehicles.forEach(v => { m[v.id] = value; }); return { ...prev, [period]: m }; }); }
  const filtered = vehicles.filter(v => !search || v.name.toLowerCase().includes(search.toLowerCase()) || v.plate.toLowerCase().includes(search.toLowerCase()));

  if (vehicles.length === 0) return <div className="empty-state"><h2>Add vehicles first</h2><p>Go to the Vehicles tab to add your fleet.</p></div>;

  return (
    <div className="panel">
      <div style={{ display: 'flex', gap: 12, alignItems: 'flex-end', flexWrap: 'wrap', marginBottom: 12 }}>
        <div className="field" style={{ maxWidth: 200 }}><label>Month (any year)</label><input type="month" value={period} onChange={e => setPeriod(e.target.value)} /></div>
        <div className="field" style={{ maxWidth: 260 }}><label>Search</label><input placeholder="Filter vehicles…" value={search} onChange={e => setSearch(e.target.value)} /></div>
        <button className="btn small" onClick={() => fillAll(baseDays)}>Mark all fully worked ({baseDays}d)</button>
        <button className="btn small" onClick={() => fillAll(0)}>Mark all as 0 days</button>
      </div>
      <table>
        <thead><tr><th>Vehicle</th><th>Plate</th><th className="num">Days Worked</th><th className="num">Occupancy %</th></tr></thead>
        <tbody>
          {filtered.map(v => {
            const d = (occupancy[period] || {})[v.id];
            const pctVal = d !== undefined && d !== '' ? num(d) / baseDays : null;
            return (
              <tr key={v.id}>
                <td>{v.name}</td><td>{v.plate}</td>
                <td className="num"><input type="number" min="0" value={d === undefined ? '' : d} onChange={e => setDays(v.id, e.target.value)} /></td>
                <td className="num">{pctVal === null ? '—' : <span className={`badge ${pctVal >= 0.5 ? 'pos' : 'neg'}`}>{pctStr(pctVal)}</span>}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

/* ---------------- Occupancy Report (uses global report range) ---------------- */

function OccReport({ monthKeys, vehicles, occupancy, baseDays, agreements, currency, vehicleRevenue, selectedVehicleIds, onToggleVehicleSelect, onSelectAllVehicles }) {
  const displayVehicles = selectedVehicleIds && selectedVehicleIds.length ? vehicles.filter(v => selectedVehicleIds.includes(v.id)) : vehicles;
  const rows = displayVehicles.map(v => {
    const monthPcts = monthKeys.map(p => { const d = (occupancy[p] || {})[v.id]; return d === undefined || d === '' ? null : num(d) / baseDays; });
    const valid = monthPcts.filter(x => x !== null);
    const avg = valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : null;
    return { vehicle: v, monthPcts, avg };
  });
  const buckets = { '0-30%': 0, '31-50%': 0, '51-75%': 0, '76-100%+': 0 };
  rows.forEach(r => { if (r.avg === null) return; if (r.avg < 0.3) buckets['0-30%']++; else if (r.avg < 0.5) buckets['31-50%']++; else if (r.avg < 0.75) buckets['51-75%']++; else buckets['76-100%+']++; });
  const barData = rows.filter(r => r.avg !== null).map(r => ({ name: r.vehicle.name, value: Math.round(r.avg * 100), display: Math.round(r.avg * 100) + '%', color: r.avg >= 0.5 ? '#3E9C6E' : '#C1503F' })).sort((a, b) => b.value - a.value);
  const validAvgs = rows.filter(r => r.avg !== null);
  const fleetAvg = validAvgs.length ? validAvgs.reduce((s, r) => s + r.avg, 0) / validAvgs.length : 0;

  const categories = {};
  rows.forEach(r => {
    const cat = (r.vehicle.category && r.vehicle.category.trim()) ? r.vehicle.category.trim() : 'Uncategorized';
    if (!categories[cat]) categories[cat] = [];
    categories[cat].push(r);
  });
  const categoryList = Object.keys(categories).map((name, i) => {
    const catRows = categories[name];
    const allValid = catRows.flatMap(r => r.monthPcts.filter(x => x !== null));
    const avgOverall = allValid.length ? allValid.reduce((a, b) => a + b, 0) / allValid.length : null;
    return { name, count: catRows.length, avgOverall, color: COLORS[i % COLORS.length] };
  }).sort((a, b) => (b.avgOverall ?? -1) - (a.avgOverall ?? -1));
  const categoryTrendData = monthKeys.map((p, mi) => {
    const point = { label: monthLabel(p) };
    categoryList.forEach(cat => {
      const vals = categories[cat.name].map(r => r.monthPcts[mi]).filter(x => x !== null);
      point[cat.name] = vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length) * 100 : 0;
    });
    return point;
  });

  if (vehicles.length === 0) return <div className="empty-state"><h2>No vehicles yet</h2><p>Add your fleet in the Vehicles tab, then log occupancy days.</p></div>;

  return (
    <div>
      {onToggleVehicleSelect && (
        <div className="panel no-print">
          <h3>Report Selection <span style={{ fontWeight: 400, color: 'var(--muted)', fontSize: 12, textTransform: 'none' }}>— filters this whole report (totals, charts, matrix)</span></h3>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <div className={`chip ${selectedVehicleIds.length === 0 ? 'selected' : ''}`} onClick={onSelectAllVehicles}>All Cars</div>
            {vehicles.map(v => (
              <div key={v.id} className={`chip ${selectedVehicleIds.includes(v.id) ? 'selected' : ''}`} onClick={() => onToggleVehicleSelect(v.id)}>{v.name}</div>
            ))}
          </div>
        </div>
      )}
      <div className="kpi-row">
        <KpiCard label="Fleet Avg Occupancy" value={pctStr(fleetAvg)} sub={`base ${baseDays} days/month`} diff={fleetAvg - 0.5} />
        <div className="kpi-card"><div className="label">Vehicles Below 50%</div><div className="value mono" style={{ color: 'var(--red)' }}>{rows.filter(r => r.avg !== null && r.avg < 0.5).length}</div></div>
      </div>

      <div className="panel">
        <h3>Occupancy by Category — Trend</h3>
        <LineTrendSVG data={categoryTrendData} series={categoryList.map(cat => ({ key: cat.name, label: cat.name, color: cat.color }))} />
        <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 8 }}>
          {categoryList.map(cat => <span key={cat.name} style={{ marginRight: 12 }}>■ <span style={{ color: cat.color }}>{cat.name}</span></span>)}
        </div>
      </div>

      <div className="panel">
        <h3>Category Summary</h3>
        <table>
          <thead><tr><th>Category</th><th className="num">Vehicles</th><th className="num">Avg Occupancy (period)</th></tr></thead>
          <tbody>
            {categoryList.map(cat => (
              <tr key={cat.name}>
                <td>{cat.name}</td>
                <td className="num">{cat.count}</td>
                <td className="num">{cat.avgOverall === null ? '—' : <span className={`badge ${cat.avgOverall >= 0.5 ? 'pos' : 'neg'}`}>{pctStr(cat.avgOverall)}</span>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="grid-2">
        <div className="panel"><h3>Occupancy by Vehicle</h3><HBarList data={barData} maxVal={100} /></div>
        <div className="panel">
          <h3>Occupancy Distribution</h3>
          {Object.entries(buckets).map(([name, value], i) => (
            <div className="hbar-row" key={name}>
              <div className="hbar-name">{name}</div>
              <div className="hbar-track"><div className="hbar-fill" style={{ width: (value / Math.max(1, displayVehicles.length) * 100) + '%', background: COLORS[i % COLORS.length] }} /></div>
              <div className="hbar-val">{value}</div>
            </div>
          ))}
        </div>
      </div>

      {vehicleRevenue && (() => {
        let totalDays = 0, totalIncome = 0;
        rows.forEach(r => {
          monthKeys.forEach(p => {
            const d = (occupancy[p] || {})[r.vehicle.id];
            if (d !== undefined && d !== '') totalDays += num(d);
            totalIncome += num((vehicleRevenue[p] || {})[r.vehicle.id]);
          });
        });
        const perDay = totalDays ? totalIncome / totalDays : 0;
        return (
          <div className="panel">
            <h3>Income vs Occupancy</h3>
            <div className="kpi-row">
              <div className="kpi-card"><div className="label">Total Occupied Days</div><div className="value mono">{totalDays}</div></div>
              <div className="kpi-card"><div className="label">Total Income (fleet)</div><div className="value mono">{fmt(totalIncome, currency)}</div></div>
              <div className="kpi-card"><div className="label">Revenue per Occupied Day</div><div className="value mono">{fmt(perDay, currency)}</div></div>
            </div>
          </div>
        );
      })()}

      {vehicleRevenue && (
        <div className="panel" style={{ overflowX: 'auto' }}>
          <h3>Occupancy &amp; Income by Vehicle</h3>
          <table>
            <thead><tr><th>Car</th><th>Plate</th><th className="num">Days Occupied</th><th className="num">Occupancy %</th><th className="num">Income</th><th className="num">Avg Rate / Day</th></tr></thead>
            <tbody>
              {rows.map(r => {
                let days = 0, income = 0;
                monthKeys.forEach(p => {
                  const d = (occupancy[p] || {})[r.vehicle.id];
                  if (d !== undefined && d !== '') days += num(d);
                  income += num((vehicleRevenue[p] || {})[r.vehicle.id]);
                });
                const avgRate = days ? income / days : 0;
                return (
                  <tr key={r.vehicle.id}>
                    <td>{r.vehicle.name}</td><td>{r.vehicle.plate}</td>
                    <td className="num">{days}</td>
                    <td className="num">{r.avg === null ? '—' : pctStr(r.avg)}</td>
                    <td className="num">{fmt(income, currency)}</td>
                    <td className="num">{avgRate ? fmt(avgRate, currency) : '—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      <div className="panel" style={{ overflowX: 'auto' }}>
        <h3>Occupancy Matrix</h3>
        <table>
          <thead><tr><th>S.No</th><th>Car</th><th>Plate</th><th>Category</th>{monthKeys.map(p => <th key={p} className="num">{monthLabel(p)}</th>)}<th className="num">Avg %</th><th>Remarks</th></tr></thead>
          <tbody>
            {rows.slice().sort((a, b) => {
              const aOffice = (a.vehicle.category || '').trim() === 'Office Use Cars';
              const bOffice = (b.vehicle.category || '').trim() === 'Office Use Cars';
              if (aOffice !== bOffice) return aOffice ? 1 : -1;
              return 0;
            }).map((r, i) => {
              const isOffice = (r.vehicle.category || '').trim() === 'Office Use Cars';
              return (
              <tr key={r.vehicle.id} style={isOffice ? { background: '#F2F3F0', color: 'var(--muted)' } : undefined}>
                <td>{i + 1}</td>
                <td>{r.vehicle.name}</td><td>{r.vehicle.plate}</td><td>{r.vehicle.category || '—'}</td>
                {r.monthPcts.map((p, i2) => <td key={i2} className="num">{p === null ? '' : (p * 100).toFixed(0) + '%'}</td>)}
                <td className="num">{r.avg === null ? '' : (r.avg * 100).toFixed(0) + '%'}</td>
                <td>{isOffice ? <span className="badge" style={{ background: '#E2E4DE', color: 'var(--muted)' }}>Office Use</span> : (r.avg === null ? '' : <span className={`badge ${r.avg >= 0.5 ? 'pos' : 'neg'}`}>{r.avg >= 0.5 ? 'OK' : 'Workout'}</span>)}</td>
              </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {agreements && agreements.some(a => a.status !== 'void' && !findVehicleByPlate(vehicles, a.plate)) && (
        <div className="panel" style={{ overflowX: 'auto', borderLeft: '4px solid var(--steel)' }}>
          <h3>Sub-Lease Vehicles (Borrowed — not part of owned fleet totals above)</h3>
          <table>
            <thead><tr><th>RA#</th><th>Plate</th><th>Type</th><th>Start</th><th>Status</th><th className="num">Days</th><th className="num">Revenue</th></tr></thead>
            <tbody>
              {agreements.filter(a => a.status !== 'void' && !findVehicleByPlate(vehicles, a.plate)).map(a => (
                <tr key={a.id}>
                  <td>{a.raNumber || '—'}</td><td>{a.plate}</td><td>{a.type === 'monthly' ? 'Monthly' : 'Daily'}</td>
                  <td>{a.startDate}</td>
                  <td><span className={`badge ${a.status === 'open' ? 'pos' : ''}`}>{a.status}</span></td>
                  <td className="num">{agreementTotalDays(a)}</td>
                  <td className="num">{fmt(agreementTotalRevenue(a), currency)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function VehRevenueEntry({ monthKeys, vehicles, vehicleRevenue, setVehicleRevenue, currency }) {
  const [period, setPeriod] = useState(monthKeys[0]);
  const [search, setSearch] = useState('');

  function setAmount(vehicleId, value) { setVehicleRevenue(prev => ({ ...prev, [period]: { ...(prev[period] || {}), [vehicleId]: value } })); }
  const filtered = vehicles.filter(v => !search || v.name.toLowerCase().includes(search.toLowerCase()) || v.plate.toLowerCase().includes(search.toLowerCase()));

  if (vehicles.length === 0) return <div className="empty-state"><h2>Add vehicles first</h2><p>Go to the Vehicles tab to add your fleet, including purchase value.</p></div>;

  return (
    <div className="panel">
      <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: 0 }}>Enter each vehicle's own rental income for the month — this feeds the Model Comparison &amp; ROI report. This is separate from the company-wide P&amp;L totals.</p>
      <div style={{ display: 'flex', gap: 12, alignItems: 'flex-end', flexWrap: 'wrap', marginBottom: 12 }}>
        <div className="field" style={{ maxWidth: 200 }}><label>Month (any year)</label><input type="month" value={period} onChange={e => setPeriod(e.target.value)} /></div>
        <div className="field" style={{ maxWidth: 260 }}><label>Search</label><input placeholder="Filter vehicles…" value={search} onChange={e => setSearch(e.target.value)} /></div>
      </div>
      <table>
        <thead><tr><th>Model / Name</th><th>Plate</th><th className="num">Income This Month ({currency})</th></tr></thead>
        <tbody>
          {filtered.map(v => {
            const val = (vehicleRevenue[period] || {})[v.id];
            return (
              <tr key={v.id}>
                <td>{v.name}</td><td>{v.plate}</td>
                <td className="num"><input type="number" value={val === undefined ? '' : val} onChange={e => setAmount(v.id, e.target.value)} /></td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

/* ---------------- Model Comparison & ROI ---------------- */

function ModelComparePanel({ rangeMonths, vehicles, vehicleRevenue, defaultUsefulLife, setDefaultUsefulLife, currency }) {
  const [groupBy, setGroupBy] = useState('model'); // 'model' | 'category'
  const [selectedIds, setSelectedIds] = useState([]); // empty = all vehicles included
  function toggleSelect(id) {
    setSelectedIds(prev => {
      if (prev.length === 0) return [id];
      if (prev.includes(id)) return prev.filter(x => x !== id);
      return [...prev, id];
    });
  }
  const displayVehicles = selectedIds.length ? vehicles.filter(v => selectedIds.includes(v.id)) : vehicles;

  const unitStats = useMemo(() => displayVehicles.map(v => ({ vehicle: v, stats: vehicleRoiStats(v, rangeMonths, vehicleRevenue, defaultUsefulLife) }))
    .sort((a, b) => a.vehicle.name.localeCompare(b.vehicle.name) || a.vehicle.plate.localeCompare(b.vehicle.plate)), [displayVehicles, rangeMonths, vehicleRevenue, defaultUsefulLife]);

  const groupKeyFor = (v) => groupBy === 'category' ? ((v.category && v.category.trim()) || 'Uncategorized') : v.name;

  const modelGroups = useMemo(() => {
    const groups = {};
    unitStats.forEach(({ vehicle, stats }) => {
      const key = groupKeyFor(vehicle);
      if (!groups[key]) groups[key] = { name: key, units: 0, totalPurchaseValue: 0, totalIncome: 0, sumAvgMonthly: 0, sumRequired: 0, withBenchmark: 0 };
      const g = groups[key];
      g.units++;
      g.totalPurchaseValue += num(vehicle.purchaseValue);
      g.totalIncome += stats.total;
      g.sumAvgMonthly += stats.avgMonthly;
      if (stats.required > 0) { g.sumRequired += stats.required; g.withBenchmark++; }
    });
    return Object.values(groups).map((g, i) => {
      const avgMonthlyPerUnit = g.units ? g.sumAvgMonthly / g.units : 0;
      const avgRequiredPerUnit = g.withBenchmark ? g.sumRequired / g.withBenchmark : 0;
      const coverage = avgRequiredPerUnit > 0 ? avgMonthlyPerUnit / avgRequiredPerUnit : null;
      const verdict = coverage === null ? 'No Benchmark' : coverage >= 1 ? 'Good' : coverage >= 0.8 ? 'Marginal' : 'Underperforming';
      return { ...g, avgMonthlyPerUnit, avgRequiredPerUnit, coverage, verdict, chartColor: COLORS[i % COLORS.length] };
    }).sort((a, b) => (b.coverage ?? -1) - (a.coverage ?? -1));
  }, [unitStats, groupBy]);

  const verdictColor = (v) => v === 'Good' ? '#3E9C6E' : v === 'Marginal' ? '#D98E3F' : v === 'Underperforming' ? '#C1503F' : '#6B7380';

  if (vehicles.length === 0) return <div className="empty-state"><h2>No vehicles yet</h2><p>Add vehicles with a purchase value in the Vehicles tab, then log monthly income in Vehicle Revenue Entry.</p></div>;

  return (
    <div>
      <div className="panel no-print">
        <h3>Report Selection <span style={{ fontWeight: 400, color: 'var(--muted)', fontSize: 12, textTransform: 'none' }}>— filters this whole report</span></h3>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <div className={`chip ${selectedIds.length === 0 ? 'selected' : ''}`} onClick={() => setSelectedIds([])}>All Cars</div>
          {vehicles.map(v => (
            <div key={v.id} className={`chip ${selectedIds.includes(v.id) ? 'selected' : ''}`} onClick={() => toggleSelect(v.id)}>{v.name}</div>
          ))}
        </div>
      </div>
      <div className="panel">
        <h3>Useful Life Assumption</h3>
        <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -6 }}>Applied to every vehicle unless it has its own Useful Life Override set in the Vehicles tab. Required monthly income = Purchase Value ÷ (Useful Life × 12).</p>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          {[3, 4, 5].map(n => (
            <div key={n} className={`chip ${Number(defaultUsefulLife) === n ? 'selected' : ''}`} onClick={() => setDefaultUsefulLife(n)}>{n} years</div>
          ))}
          <input type="number" min="1" value={defaultUsefulLife} onChange={e => setDefaultUsefulLife(Math.max(1, num(e.target.value) || 4))} style={{ width: 70, border: '1px solid var(--line)', borderRadius: 6, padding: '5px 8px' }} />
          <span style={{ fontSize: 12, color: 'var(--muted)' }}>years (custom)</span>
        </div>
      </div>

      <div className="panel">
        <h3>Compare By</h3>
        <div style={{ display: 'flex', gap: 8 }}>
          <div className={`chip ${groupBy === 'model' ? 'selected' : ''}`} onClick={() => setGroupBy('model')}>Model</div>
          <div className={`chip ${groupBy === 'category' ? 'selected' : ''}`} onClick={() => setGroupBy('category')}>Category</div>
        </div>
      </div>

      <div className="panel">
        <h3>Avg Monthly Income vs Required — by {groupBy === 'category' ? 'Category' : 'Model'}</h3>
        <GroupedBarChart data={modelGroups.map(g => ({ label: g.name, avgMonthlyPerUnit: g.avgMonthlyPerUnit, avgRequiredPerUnit: g.avgRequiredPerUnit }))}
          series={[{ key: 'avgRequiredPerUnit', label: 'Required / Unit', color: '#D9C8B9' }, { key: 'avgMonthlyPerUnit', label: 'Actual / Unit', color: '#2D6E8E' }]} />
      </div>

      <div className="panel" style={{ overflowX: 'auto' }}>
        <h3>{groupBy === 'category' ? 'Category' : 'Model'}-Level Summary</h3>
        <table>
          <thead><tr><th></th><th>{groupBy === 'category' ? 'Category' : 'Model'}</th><th className="num">Units</th><th className="num">Total Purchase Value</th><th className="num">Total Income (range)</th><th className="num">Avg Income / Unit / Month</th><th className="num">Required / Unit / Month</th><th className="num">Coverage</th><th>Verdict</th></tr></thead>
          <tbody>
            {modelGroups.map(g => (
              <tr key={g.name}>
                <td><span style={{ display: 'inline-block', width: 12, height: 12, borderRadius: 3, background: g.chartColor }} /></td>
                <td>{g.name}</td>
                <td className="num">{g.units}</td>
                <td className="num">{fmt(g.totalPurchaseValue, currency)}</td>
                <td className="num">{fmt(g.totalIncome, currency)}</td>
                <td className="num">{fmt(g.avgMonthlyPerUnit, currency)}</td>
                <td className="num">{g.avgRequiredPerUnit ? fmt(g.avgRequiredPerUnit, currency) : '—'}</td>
                <td className="num">{g.coverage === null ? '—' : pctStr(g.coverage)}</td>
                <td><span className="badge" style={{ background: verdictColor(g.verdict) + '20', color: verdictColor(g.verdict) }}>{g.verdict}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="panel" style={{ overflowX: 'auto' }}>
        <h3>Per-Vehicle Detail (grouped by {groupBy === 'category' ? 'category' : 'model'})</h3>
        <table>
          <thead><tr><th></th><th>Model</th><th>Plate</th><th>Category</th><th className="num">Purchase Value</th><th className="num">Useful Life</th><th className="num">Avg Monthly Income</th><th className="num">Required / Month</th><th className="num">Coverage</th><th>Verdict</th></tr></thead>
          <tbody>
            {unitStats.slice().sort((a, b) => groupKeyFor(a.vehicle).localeCompare(groupKeyFor(b.vehicle)) || a.vehicle.name.localeCompare(b.vehicle.name)).map(({ vehicle, stats }) => (
              <tr key={vehicle.id}>
                <td><span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}><span style={{ display: 'inline-block', width: 12, height: 12, borderRadius: 3, background: vehicle.color ? carColorHex(vehicle.color) : '#e5e5e5', border: '1px solid var(--line)' }} />{vehicle.color || ''}</span></td>
                <td>{vehicle.name}</td><td>{vehicle.plate}</td><td>{vehicle.category || '—'}</td>
                <td className="num">{vehicle.purchaseValue ? fmt(vehicle.purchaseValue, currency) : '—'}</td>
                <td className="num">{stats.usefulLife} yrs</td>
                <td className="num">{fmt(stats.avgMonthly, currency)}</td>
                <td className="num">{stats.required ? fmt(stats.required, currency) : '—'}</td>
                <td className="num">{stats.coverage === null ? '—' : pctStr(stats.coverage)}</td>
                <td><span className="badge" style={{ background: verdictColor(stats.verdict) + '20', color: verdictColor(stats.verdict) }}>{stats.verdict}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="panel" style={{ overflowX: 'auto' }}>
        <h3>Vehicle Lifetime Performance</h3>
        <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -6 }}>Total time in operation and total income earned from each vehicle's Purchase Date to now (or to its Sale Date if sold) — independent of the report period selected above. Only vehicles with a Purchase Date set are shown.</p>
        <table>
          <thead><tr><th>Model</th><th>Plate</th><th>Purchase Date</th><th>Status</th><th className="num">Time in Operation</th><th className="num">Useful Life Consumed</th><th className="num">Total Income Earned</th></tr></thead>
          <tbody>
            {unitStats.filter(({ vehicle }) => vehicle.purchaseDate).map(({ vehicle, stats }) => {
              const lt = vehicleLifetimeStats(vehicle, vehicleRevenue);
              const usefulLifeMonths = stats.usefulLife * 12;
              const consumedPct = usefulLifeMonths ? lt.monthsElapsed / usefulLifeMonths : 0;
              return (
                <tr key={vehicle.id}>
                  <td>{vehicle.name}</td><td>{vehicle.plate}</td><td>{vehicle.purchaseDate}</td>
                  <td>{vehicle.saleDate ? <span className="badge neg">Sold {vehicle.saleDate}</span> : <span className="badge pos">Active</span>}</td>
                  <td className="num">{(lt.monthsElapsed / 12).toFixed(1)} yrs ({lt.monthsElapsed} mo)</td>
                  <td className="num">{consumedPct >= 1 ? <span style={{ color: 'var(--red)' }}>Fully consumed</span> : `${(consumedPct * stats.usefulLife).toFixed(1)} of ${stats.usefulLife} yrs used`}</td>
                  <td className="num">{fmt(lt.totalIncome, currency)}</td>
                </tr>
              );
            })}
            {unitStats.filter(({ vehicle }) => vehicle.purchaseDate).length === 0 && (
              <tr><td colSpan={7} style={{ textAlign: 'center', color: 'var(--muted)', padding: 16 }}>No vehicles have a Purchase Date set yet — add one in the Vehicles tab to see lifetime performance here.</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------------- Feasibility Study ---------------- */

function FeasibilityPanel({ studies, setStudies, currency, deletePin, defaultWorkingDays, onPrintStudy }) {
  const [selectedId, setSelectedId] = useState(studies[0] ? studies[0].id : null);

  function addStudy() {
    const s = emptyFeasibilityStudy();
    s.workingDaysPerMonth = defaultWorkingDays || 22;
    setStudies([...studies, s]);
    setSelectedId(s.id);
  }
  function duplicateStudy(study) {
    const copy = { ...study, id: uid('study'), name: study.name + ' (copy)', costLines: study.costLines.map(c => ({ ...c, id: uid('cl') })) };
    setStudies([...studies, copy]);
    setSelectedId(copy.id);
  }
  function deleteStudy(study) {
    if (!confirmDelete(study.name, deletePin)) return;
    setStudies(studies.filter(s => s.id !== study.id));
    if (selectedId === study.id) setSelectedId(null);
  }
  function updateStudy(id, patch) {
    setStudies(studies.map(s => s.id === id ? { ...s, ...patch } : s));
  }

  const selected = studies.find(s => s.id === selectedId);
  const verdictColor = (v) => v === 'Feasible' ? '#3E9C6E' : v === 'Marginal' ? '#D98E3F' : v === 'Not Feasible' ? '#C1503F' : '#6B7380';

  return (
    <div>
      <div className="panel">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
          <h3 style={{ margin: 0 }}>Saved Feasibility Studies</h3>
          <button className="btn primary" onClick={addStudy}>+ New Study</button>
        </div>
        {studies.length === 0 ? (
          <p style={{ color: 'var(--muted)', fontSize: 13 }}>Run this before buying a vehicle — model out the total cost, target profit, and required daily rate, then compare it against the real market rate to see if it's worth buying.</p>
        ) : (
          <table>
            <thead><tr><th>Study</th><th className="num">Total Price</th><th className="num">Required Daily Rate</th><th className="num">Market Rate</th><th>Verdict</th><th></th></tr></thead>
            <tbody>
              {studies.map(s => {
                const c = computeFeasibility(s);
                return (
                  <tr key={s.id} style={{ background: s.id === selectedId ? '#EFF4F1' : undefined, cursor: 'pointer' }} onClick={() => setSelectedId(s.id)}>
                    <td>{s.name}</td>
                    <td className="num">{s.totalPrice ? fmt(s.totalPrice, currency) : '—'}</td>
                    <td className="num">{fmt(c.requiredDailyRate, currency)}</td>
                    <td className="num">{s.marketDailyRate ? fmt(s.marketDailyRate, currency) : '—'}</td>
                    <td><span className="badge" style={{ background: verdictColor(c.verdict) + '20', color: verdictColor(c.verdict) }}>{c.verdict}</span></td>
                    <td style={{ textAlign: 'right' }}>
                      <button className="icon-btn" title="Export PDF" onClick={e => { e.stopPropagation(); onPrintStudy(s.id); }}>⎙</button>{' '}
                      <button className="icon-btn" onClick={e => { e.stopPropagation(); duplicateStudy(s); }}>⧉</button>{' '}
                      <button className="icon-btn" onClick={e => { e.stopPropagation(); deleteStudy(s); }}>✕</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {selected && <FeasibilityDetail study={selected} onChange={patch => updateStudy(selected.id, patch)} currency={currency} />}
    </div>
  );
}

function FeasibilityDetail({ study, onChange, currency }) {
  const c = computeFeasibility(study);
  const verdictColor = (v) => v === 'Feasible' ? '#3E9C6E' : v === 'Marginal' ? '#D98E3F' : v === 'Not Feasible' ? '#C1503F' : '#6B7380';
  const [showForm, setShowForm] = useState(!study.totalPrice);

  function updateCostLine(id, field, value) {
    onChange({ costLines: study.costLines.map(cl => cl.id === id ? { ...cl, [field]: value } : cl) });
  }
  function addCostLine() {
    onChange({ costLines: [...study.costLines, { id: uid('cl'), label: 'New Cost', note: '', annualAmount: '' }] });
  }
  function removeCostLine(id) {
    onChange({ costLines: study.costLines.filter(cl => cl.id !== id) });
  }

  const verdictPhrase = c.requiredDailyRate
    ? `To cover total costs and expenses of ${fmt(c.costBase, currency)} and achieve your target profit, this vehicle must generate ${fmt(c.grandTotal, currency)} over its useful life — a minimum daily rate of ${fmt(c.requiredDailyRate, currency)} is needed to hit that goal.`
    : 'Enter a Total Price and Useful Life to calculate the required daily rate.';

  if (!showForm) {
    return (
      <div>
        <div className="panel">

              <p style={{ fontSize: 12.5, color: 'var(--muted)', margin: '4px 0 0' }}>{study.seatingCapacity ? `Seating: ${study.seatingCapacity} · ` : ''}Total Price {fmt(study.totalPrice, currency)} · Useful Life {study.usefulLifeYears || 1} yrs</p>

            <div className="kpi-card"><div className="label">Required Daily Rate</div><div className="value mono">{fmt(c.requiredDailyRate, currency)}</div></div>
            <div className="kpi-card"><div className="label">Market Daily Rate</div><div className="value mono">{study.marketDailyRate ? fmt(study.marketDailyRate, currency) : '—'}</div></div>
          </div>
          <div style={{ marginTop: 10 }}>
            <span className="badge" style={{ background: verdictColor(c.verdict) + '20', color: verdictColor(c.verdict), fontSize: 13, padding: '5px 12px' }}>
              {c.verdict}{c.gapPct !== null ? ` (market rate is ${pctStr(c.gapPct)} vs required)` : ''}
            </span>
          </div>
        </div>

        <div className="panel">
          <h3>Occupancy Scenarios</h3>

                  <td>{(s.occPct * 100).toFixed(0)}%</td>

                  <td className="num">{fmt(s.requiredAmount, currency)}</td>
                  <td className="num">{study.marketDailyRate ? fmt(s.marketAmount, currency) : '—'}</td>

              ))}

        </div>

        <div className="panel" style={{ background: '#F7F8F5' }}>
          <h3>Verdict</h3>
          <table>
            <tbody><tr><td style={{ border: 'none', padding: '4px 0' }}>{verdictPhrase}</td></tr></tbody>
          </table>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="panel">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <h3 style={{ margin: 0 }}>Vehicle Details</h3>

          <div className="field" style={{ flex: '1 1 140px' }}><label>Seating Capacity</label><input value={study.seatingCapacity} onChange={e => onChange({ seatingCapacity: e.target.value })} placeholder="1 + 7" /></div>
        </div>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginTop: 10 }}>
          <div className="field" style={{ flex: '1 1 150px' }}><label>Total Price ({currency})</label><input type="number" value={study.totalPrice} onChange={e => onChange({ totalPrice: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 150px' }}><label>Down Payment ({currency})</label><input type="number" value={study.downPayment} onChange={e => onChange({ downPayment: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 120px' }}><label>Net Amount</label><input disabled value={fmt(c.netAmount, currency)} /></div>

      <div className="panel">

          <div className="field" style={{ flex: '1 1 160px' }}><label>Monthly EMI</label><input disabled value={fmt(c.emi, currency)} /></div>

      <div className="panel">
        <h3>Occupancy Scenarios</h3>

          <thead><tr><th>Occupancy</th><th className="num">Days / Month</th><th className="num">Required Monthly Income</th><th className="num">At Market Rate</th></tr></thead>
          <tbody>
            {c.scenarios.map((s, i) => (
              <tr key={i}>
                <td>{(s.occPct * 100).toFixed(0)}%</td>
                <td className="num">{s.days}</td>
