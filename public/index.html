function OccEntry({ monthKeys, vehicles, occupancy, setOccupancy, baseDays }) {
  const [period, setPeriod] = useState(monthKeys[0]);
  const [search, setSearch] = useState('');

  function setDays(vehicleId, value) { setOccupancy(prev => ({ ...prev, [period]: { ...(prev[period] || {}), [vehicleId]: value } })); }
  function fillAll(value) { setOccupancy(prev => { const m = { ...(prev[period] || {}) }; vehicles.forEach(v => { m[v.id] = value; }); return { ...prev, [period]: m }; }); }
  const filtered = vehicles.filter(v => !search || v.name.toLowerCase().includes(search.toLowerCase()) || v.plate.toLowerCase().includes(search.toLowerCase()));

  if (vehicles.length === 0) return <div className="empty-state"><h2>Add vehicles first</h2><p>Go to the Vehicles tab to add your fleet.</p></div>;

  return (
    <div className="panel">
      <div style={{ display: 'flex', gap: 12, alignItems: 'flex-end', flexWrap: 'wrap', marginBottom: 12 }}>
        <div className="field" style={{ maxWidth: 200 }}><label>Month (any year)</label><input type="month" value={period} onChange={e => setPeriod(e.target.value)} /></div>
        <div className="field" style={{ maxWidth: 260 }}><label>Search</label><input placeholder="Filter vehicles…" value={search} onChange={e => setSearch(e.target.value)} /></div>
        <button className="btn small" onClick={() => fillAll(baseDays)}>Mark all fully worked ({baseDays}d)</button>
        <button className="btn small" onClick={() => fillAll(0)}>Mark all as 0 days</button>
      </div>
      <table>
        <thead><tr><th>Vehicle</th><th>Plate</th><th className="num">Days Worked</th><th className="num">Occupancy %</th></tr></thead>
        <tbody>
          {filtered.map(v => {
            const d = (occupancy[period] || {})[v.id];
            const pctVal = d !== undefined && d !== '' ? num(d) / baseDays : null;
            return (
              <tr key={v.id}>
                <td>{v.name}</td><td>{v.plate}</td>
                <td className="num"><input type="number" min="0" value={d === undefined ? '' : d} onChange={e => setDays(v.id, e.target.value)} /></td>
                <td className="num">{pctVal === null ? '—' : <span className={`badge ${pctVal >= 0.5 ? 'pos' : 'neg'}`}>{pctStr(pctVal)}</span>}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

/* ---------------- Occupancy Report (uses global report range) ---------------- */

function OccReport({ monthKeys, vehicles, occupancy, baseDays }) {
  const rows = vehicles.map(v => {
    const monthPcts = monthKeys.map(p => { const d = (occupancy[p] || {})[v.id]; return d === undefined || d === '' ? null : num(d) / baseDays; });
    const valid = monthPcts.filter(x => x !== null);
    const avg = valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : null;
    return { vehicle: v, monthPcts, avg };
  });
  const buckets = { '0-30%': 0, '31-50%': 0, '51-75%': 0, '76-100%+': 0 };
  rows.forEach(r => { if (r.avg === null) return; if (r.avg < 0.3) buckets['0-30%']++; else if (r.avg < 0.5) buckets['31-50%']++; else if (r.avg < 0.75) buckets['51-75%']++; else buckets['76-100%+']++; });
  const barData = rows.filter(r => r.avg !== null).map(r => ({ name: r.vehicle.name, value: Math.round(r.avg * 100), display: Math.round(r.avg * 100) + '%', color: r.avg >= 0.5 ? '#3E9C6E' : '#C1503F' })).sort((a, b) => b.value - a.value);
  const validAvgs = rows.filter(r => r.avg !== null);
  const fleetAvg = validAvgs.length ? validAvgs.reduce((s, r) => s + r.avg, 0) / validAvgs.length : 0;

  const categories = {};
  rows.forEach(r => {
    const cat = (r.vehicle.category && r.vehicle.category.trim()) ? r.vehicle.category.trim() : 'Uncategorized';
    if (!categories[cat]) categories[cat] = [];
    categories[cat].push(r);
  });
  const categoryList = Object.keys(categories).map((name, i) => {
    const catRows = categories[name];
    const allValid = catRows.flatMap(r => r.monthPcts.filter(x => x !== null));
    const avgOverall = allValid.length ? allValid.reduce((a, b) => a + b, 0) / allValid.length : null;
    return { name, count: catRows.length, avgOverall, color: COLORS[i % COLORS.length] };
  }).sort((a, b) => (b.avgOverall ?? -1) - (a.avgOverall ?? -1));
  const categoryTrendData = monthKeys.map((p, mi) => {
    const point = { label: monthLabel(p) };
    categoryList.forEach(cat => {
      const vals = categories[cat.name].map(r => r.monthPcts[mi]).filter(x => x !== null);
      point[cat.name] = vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length) * 100 : 0;
    });
    return point;
  });

  if (vehicles.length === 0) return <div className="empty-state"><h2>No vehicles yet</h2><p>Add your fleet in the Vehicles tab, then log occupancy days.</p></div>;

  return (
    <div>
      <div className="kpi-row">
        <KpiCard label="Fleet Avg Occupancy" value={pctStr(fleetAvg)} sub={`base ${baseDays} days/month`} diff={fleetAvg - 0.5} />
        <div className="kpi-card"><div className="label">Vehicles Below 50%</div><div className="value mono" style={{ color: 'var(--red)' }}>{rows.filter(r => r.avg !== null && r.avg < 0.5).length}</div></div>
      </div>

      <div className="panel">
        <h3>Occupancy by Category — Trend</h3>
        <LineTrendSVG data={categoryTrendData} series={categoryList.map(cat => ({ key: cat.name, label: cat.name, color: cat.color }))} />
        <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 8 }}>
          {categoryList.map(cat => <span key={cat.name} style={{ marginRight: 12 }}>■ <span style={{ color: cat.color }}>{cat.name}</span></span>)}
        </div>
      </div>

      <div className="panel">
        <h3>Category Summary</h3>
        <table>
          <thead><tr><th>Category</th><th className="num">Vehicles</th><th className="num">Avg Occupancy (period)</th></tr></thead>
          <tbody>
            {categoryList.map(cat => (
              <tr key={cat.name}>
                <td>{cat.name}</td>
                <td className="num">{cat.count}</td>
                <td className="num">{cat.avgOverall === null ? '—' : <span className={`badge ${cat.avgOverall >= 0.5 ? 'pos' : 'neg'}`}>{pctStr(cat.avgOverall)}</span>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="grid-2">
        <div className="panel"><h3>Occupancy by Vehicle</h3><HBarList data={barData} maxVal={100} /></div>
        <div className="panel">
          <h3>Occupancy Distribution</h3>
          {Object.entries(buckets).map(([name, value], i) => (
            <div className="hbar-row" key={name}>
              <div className="hbar-name">{name}</div>
              <div className="hbar-track"><div className="hbar-fill" style={{ width: (value / Math.max(1, vehicles.length) * 100) + '%', background: COLORS[i % COLORS.length] }} /></div>
              <div className="hbar-val">{value}</div>
            </div>
          ))}
        </div>
      </div>
      <div className="panel" style={{ overflowX: 'auto' }}>
        <h3>Occupancy Matrix</h3>
        <table>
          <thead><tr><th>Car</th><th>Plate</th><th>Category</th>{monthKeys.map(p => <th key={p} className="num">{monthLabel(p)}</th>)}<th className="num">Avg %</th><th>Remarks</th></tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.vehicle.id}>
                <td>{r.vehicle.name}</td><td>{r.vehicle.plate}</td><td>{r.vehicle.category || '—'}</td>
                {r.monthPcts.map((p, i) => <td key={i} className="num">{p === null ? '' : (p * 100).toFixed(0) + '%'}</td>)}
                <td className="num">{r.avg === null ? '' : (r.avg * 100).toFixed(0) + '%'}</td>
                <td>{r.avg === null ? '' : <span className={`badge ${r.avg >= 0.5 ? 'pos' : 'neg'}`}>{r.avg >= 0.5 ? 'OK' : 'Workout'}</span>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------------- Model Comparison & ROI ---------------- */

function ModelComparePanel({ rangeMonths, vehicles, vehicleRevenue, defaultUsefulLife, setDefaultUsefulLife, currency }) {
  const unitStats = useMemo(() => vehicles.map(v => ({ vehicle: v, stats: vehicleRoiStats(v, rangeMonths, vehicleRevenue, defaultUsefulLife) }))
    .sort((a, b) => a.vehicle.name.localeCompare(b.vehicle.name) || a.vehicle.plate.localeCompare(b.vehicle.plate)), [vehicles, rangeMonths, vehicleRevenue, defaultUsefulLife]);

  const modelGroups = useMemo(() => {
    const groups = {};
    unitStats.forEach(({ vehicle, stats }) => {
      if (!groups[vehicle.name]) groups[vehicle.name] = { name: vehicle.name, units: 0, totalPurchaseValue: 0, totalIncome: 0, sumAvgMonthly: 0, sumRequired: 0, withBenchmark: 0 };
      const g = groups[vehicle.name];
      g.units++;
      g.totalPurchaseValue += num(vehicle.purchaseValue);
      g.totalIncome += stats.total;
      g.sumAvgMonthly += stats.avgMonthly;
      if (stats.required > 0) { g.sumRequired += stats.required; g.withBenchmark++; }
    });
    return Object.values(groups).map(g => {
      const avgMonthlyPerUnit = g.units ? g.sumAvgMonthly / g.units : 0;
      const avgRequiredPerUnit = g.withBenchmark ? g.sumRequired / g.withBenchmark : 0;
      const coverage = avgRequiredPerUnit > 0 ? avgMonthlyPerUnit / avgRequiredPerUnit : null;
      const verdict = coverage === null ? 'No Benchmark' : coverage >= 1 ? 'Good' : coverage >= 0.8 ? 'Marginal' : 'Underperforming';
      return { ...g, avgMonthlyPerUnit, avgRequiredPerUnit, coverage, verdict };
    }).sort((a, b) => (b.coverage ?? -1) - (a.coverage ?? -1));
  }, [unitStats]);

  const verdictColor = (v) => v === 'Good' ? '#3E9C6E' : v === 'Marginal' ? '#D98E3F' : v === 'Underperforming' ? '#C1503F' : '#6B7380';

  if (vehicles.length === 0) return <div className="empty-state"><h2>No vehicles yet</h2><p>Add vehicles with a purchase value in the Vehicles tab, then log monthly income in Vehicle Revenue Entry.</p></div>;

  return (
    <div>
      <div className="panel">
        <h3>Useful Life Assumption</h3>
        <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -6 }}>Applied to every vehicle unless it has its own Useful Life Override set in the Vehicles tab. Required monthly income = Purchase Value ÷ (Useful Life × 12).</p>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          {[3, 4, 5].map(n => (
            <div key={n} className={`chip ${Number(defaultUsefulLife) === n ? 'selected' : ''}`} onClick={() => setDefaultUsefulLife(n)}>{n} years</div>
          ))}
          <input type="number" min="1" value={defaultUsefulLife} onChange={e => setDefaultUsefulLife(Math.max(1, num(e.target.value) || 4))} style={{ width: 70, border: '1px solid var(--line)', borderRadius: 6, padding: '5px 8px' }} />
          <span style={{ fontSize: 12, color: 'var(--muted)' }}>years (custom)</span>
        </div>
      </div>

      <div className="panel">
        <h3>Avg Monthly Income vs Required — by Model</h3>
        <GroupedBarChart data={modelGroups.map(g => ({ label: g.name, avgMonthlyPerUnit: g.avgMonthlyPerUnit, avgRequiredPerUnit: g.avgRequiredPerUnit }))}
          series={[{ key: 'avgRequiredPerUnit', label: 'Required / Unit', color: '#D9C8B9' }, { key: 'avgMonthlyPerUnit', label: 'Actual / Unit', color: '#2D6E8E' }]} />
      </div>

      <div className="panel" style={{ overflowX: 'auto' }}>
        <h3>Model-Level Summary</h3>
        <table>
          <thead><tr><th>Model</th><th className="num">Units</th><th className="num">Total Purchase Value</th><th className="num">Total Income (range)</th><th className="num">Avg Income / Unit / Month</th><th className="num">Required / Unit / Month</th><th className="num">Coverage</th><th>Verdict</th></tr></thead>
          <tbody>
            {modelGroups.map(g => (
              <tr key={g.name}>
                <td>{g.name}</td>
                <td className="num">{g.units}</td>
                <td className="num">{fmt(g.totalPurchaseValue, currency)}</td>
                <td className="num">{fmt(g.totalIncome, currency)}</td>
                <td className="num">{fmt(g.avgMonthlyPerUnit, currency)}</td>
                <td className="num">{g.avgRequiredPerUnit ? fmt(g.avgRequiredPerUnit, currency) : '—'}</td>
                <td className="num">{g.coverage === null ? '—' : pctStr(g.coverage)}</td>
                <td><span className="badge" style={{ background: verdictColor(g.verdict) + '20', color: verdictColor(g.verdict) }}>{g.verdict}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="panel" style={{ overflowX: 'auto' }}>
        <h3>Per-Vehicle Detail (grouped by model)</h3>
        <table>
          <thead><tr><th>Model</th><th>Plate</th><th className="num">Purchase Value</th><th className="num">Useful Life</th><th className="num">Avg Monthly Income</th><th className="num">Required / Month</th><th className="num">Coverage</th><th>Verdict</th></tr></thead>
          <tbody>
            {unitStats.map(({ vehicle, stats }) => (
              <tr key={vehicle.id}>
                <td>{vehicle.name}</td><td>{vehicle.plate}</td>
                <td className="num">{vehicle.purchaseValue ? fmt(vehicle.purchaseValue, currency) : '—'}</td>
                <td className="num">{stats.usefulLife} yrs</td>
                <td className="num">{fmt(stats.avgMonthly, currency)}</td>
                <td className="num">{stats.required ? fmt(stats.required, currency) : '—'}</td>
                <td className="num">{stats.coverage === null ? '—' : pctStr(stats.coverage)}</td>
                <td><span className="badge" style={{ background: verdictColor(stats.verdict) + '20', color: verdictColor(stats.verdict) }}>{stats.verdict}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------------- Feasibility Study ---------------- */

function FeasibilityPanel({ studies, setStudies, currency, deletePin, defaultWorkingDays }) {
  const [selectedId, setSelectedId] = useState(studies[0] ? studies[0].id : null);

  function addStudy() {
    const s = emptyFeasibilityStudy();
    s.workingDaysPerMonth = defaultWorkingDays || 22;
    setStudies([...studies, s]);
    setSelectedId(s.id);
  }
  function duplicateStudy(study) {
    const copy = { ...study, id: uid('study'), name: study.name + ' (copy)', costLines: study.costLines.map(c => ({ ...c, id: uid('cl') })) };
    setStudies([...studies, copy]);
    setSelectedId(copy.id);
  }
  function deleteStudy(study) {
    if (!confirmDelete(study.name, deletePin)) return;
    setStudies(studies.filter(s => s.id !== study.id));
    if (selectedId === study.id) setSelectedId(null);
  }
  function updateStudy(id, patch) {
    setStudies(studies.map(s => s.id === id ? { ...s, ...patch } : s));
  }

  const selected = studies.find(s => s.id === selectedId);
  const verdictColor = (v) => v === 'Feasible' ? '#3E9C6E' : v === 'Marginal' ? '#D98E3F' : v === 'Not Feasible' ? '#C1503F' : '#6B7380';

  return (
    <div>
      <div className="panel">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
          <h3 style={{ margin: 0 }}>Saved Feasibility Studies</h3>
          <button className="btn primary" onClick={addStudy}>+ New Study</button>
        </div>
        {studies.length === 0 ? (
          <p style={{ color: 'var(--muted)', fontSize: 13 }}>Run this before buying a vehicle — model out the total cost, target profit, and required daily rate, then compare it against the real market rate to see if it's worth buying.</p>
        ) : (
          <table>
            <thead><tr><th>Study</th><th className="num">Total Price</th><th className="num">Required Daily Rate</th><th className="num">Market Rate</th><th>Verdict</th><th></th></tr></thead>
            <tbody>
              {studies.map(s => {
                const c = computeFeasibility(s);
                return (
                  <tr key={s.id} style={{ background: s.id === selectedId ? '#EFF4F1' : undefined, cursor: 'pointer' }} onClick={() => setSelectedId(s.id)}>
                    <td>{s.name}</td>
                    <td className="num">{s.totalPrice ? fmt(s.totalPrice, currency) : '—'}</td>
                    <td className="num">{fmt(c.requiredDailyRate, currency)}</td>
                    <td className="num">{s.marketDailyRate ? fmt(s.marketDailyRate, currency) : '—'}</td>
                    <td><span className="badge" style={{ background: verdictColor(c.verdict) + '20', color: verdictColor(c.verdict) }}>{c.verdict}</span></td>
                    <td style={{ textAlign: 'right' }}>
                      <button className="icon-btn" onClick={e => { e.stopPropagation(); duplicateStudy(s); }}>⧉</button>{' '}
                      <button className="icon-btn" onClick={e => { e.stopPropagation(); deleteStudy(s); }}>✕</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {selected && <FeasibilityDetail study={selected} onChange={patch => updateStudy(selected.id, patch)} currency={currency} />}
    </div>
  );
}

/* ---------------- Vehicle Financing ---------------- */

function FinancingPanel({ loans, setLoans, vehicles, currency, deletePin, onPrintLoan, selectedLoanIds, onToggleLoanSelect, onSelectAllLoans, onSelectOnlyLoan }) {
  const [selectedId, setSelectedId] = useState(loans[0] ? loans[0].id : null);

  // When the Report Selection chips narrow down to exactly one car, show that same car's
  // full detail below — otherwise clicking a chip filters the table but leaves whichever
  // loan was previously open showing, which looks like a mismatch/glitch.
  useEffect(() => {
    if (selectedLoanIds.length === 1) {
      setSelectedId(selectedLoanIds[0]);
    }
  }, [selectedLoanIds]);

  function addLoan() {
    const l = emptyLoan();
    setLoans([...loans, l]);
    setSelectedId(l.id);
    onSelectOnlyLoan(l.id);
  }
  function deleteLoan(loan) {
    if (!confirmDelete(loan.modelName || 'this loan', deletePin)) return;
    setLoans(loans.filter(l => l.id !== loan.id));
    if (selectedId === loan.id) setSelectedId(null);
  }
  function updateLoan(id, patch) {
    setLoans(loans.map(l => l.id === id ? { ...l, ...patch } : l));
  }

  const selected = loans.find(l => l.id === selectedId);
  const displayLoans = selectedLoanIds.length ? loans.filter(l => selectedLoanIds.includes(l.id)) : loans;

  const fleetTotals = displayLoans.reduce((acc, l) => {
    const s = loanStats(l);
    acc.principalBalance += s.balancePrincipal;
    acc.interestBalance += s.balanceInterest;
    acc.monthlyEMI += s.monthlyEMI;
    acc.totalFinanced += s.totalAmount;
    acc.totalPaid += s.paidAmount;
    if (s.overdue) acc.overdueCount++;
    return acc;
  }, { principalBalance: 0, interestBalance: 0, monthlyEMI: 0, overdueCount: 0, totalFinanced: 0, totalPaid: 0 });
  const fleetPaidPct = fleetTotals.totalFinanced ? fleetTotals.totalPaid / fleetTotals.totalFinanced : 0;

  const isSingleCarView = selectedLoanIds.length === 1;
  const aggStats = displayLoans.reduce((acc, l) => {
    const s = loanStats(l);
    acc.totalPrincipal += s.totalPrincipal;
    acc.totalInterest += s.totalInterest;
    acc.paidPrincipal += s.paidPrincipal;
    acc.paidInterest += s.paidInterest;
    acc.totalAmount += s.totalAmount;
    acc.paidAmount += s.paidAmount;
    return acc;
  }, { totalPrincipal: 0, totalInterest: 0, paidPrincipal: 0, paidInterest: 0, totalAmount: 0, paidAmount: 0 });
  const aggPaidPct = aggStats.totalAmount ? aggStats.paidAmount / aggStats.totalAmount : 0;

  return (
    <div>
      {loans.length > 0 && (
        <div className="panel">
          <h3>Report Selection <span style={{ fontWeight: 400, color: 'var(--muted)', fontSize: 12, textTransform: 'none' }}>— filters this whole tab (totals, chart, table) and what Export Excel / Export PDF include</span></h3>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <div className={`chip ${selectedLoanIds.length === 0 ? 'selected' : ''}`} onClick={onSelectAllLoans}>All Cars</div>
            {loans.map(l => (
              <div key={l.id} className={`chip ${selectedLoanIds.includes(l.id) ? 'selected' : ''}`} onClick={() => onToggleLoanSelect(l.id)}>{l.modelName || '(unnamed)'}</div>
            ))}
          </div>
        </div>
      )}

      <div className="kpi-row">
        <div className="kpi-card"><div className="label">Total Loan Amount (Payable)</div><div className="value mono">{fmt(fleetTotals.totalFinanced, currency)}</div></div>
        <div className="kpi-card"><div className="label">Total Paid</div><div className="value mono" style={{ color: 'var(--green)' }}>{fmt(fleetTotals.totalPaid, currency)}</div><div className="sub" style={{ color: 'var(--muted)' }}>{pctStr(fleetPaidPct)} of total</div></div>
        <div className="kpi-card"><div className="label">Total Remaining</div><div className="value mono">{fmt(fleetTotals.principalBalance + fleetTotals.interestBalance, currency)}</div></div>
        <div className="kpi-card"><div className="label">Overdue Loans</div><div className="value mono" style={{ color: fleetTotals.overdueCount ? 'var(--red)' : 'var(--ink)' }}>{fleetTotals.overdueCount}</div></div>
      </div>

      {displayLoans.length > 0 && (
        <div className="panel">
          <h3>Payment Progress by Vehicle</h3>
          <HBarList data={displayLoans.map(l => { const s = loanStats(l); return { name: l.modelName || '(unnamed)', value: Math.round(s.paidPct * 100), display: pctStr(s.paidPct) + ' · ' + fmt(s.paidAmount, currency), color: s.paidPct >= 1 ? '#3E9C6E' : '#2D6E8E' }; })} maxVal={100} />
        </div>
      )}

      <div className="panel">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
          <h3 style={{ margin: 0 }}>Vehicle Loans {selectedLoanIds.length > 0 ? `(${displayLoans.length} of ${loans.length} shown)` : ''}</h3>
          <button className="btn primary" onClick={addLoan}>+ Add Loan</button>
        </div>
        {loans.length === 0 ? (
          <p style={{ color: 'var(--muted)', fontSize: 13 }}>Add a loan for each financed vehicle — enter the car value, down payment, interest rate, fees, and term, then generate the payment schedule.</p>
        ) : (
          <table>
            <thead><tr><th>Vehicle</th><th>Lender</th><th className="num">Loan Amount</th><th className="num">Monthly EMI</th><th className="num">Paid</th><th className="num">Principal Balance</th><th>Next Due</th><th></th></tr></thead>
            <tbody>
              {displayLoans.map(l => {
                const s = loanStats(l);
                return (
                  <tr key={l.id} style={{ background: l.id === selectedId ? '#EFF4F1' : undefined, cursor: 'pointer' }} onClick={() => { setSelectedId(l.id); onSelectOnlyLoan(l.id); }}>
                    <td>{l.modelName || '(unnamed)'}</td>
                    <td>{l.lender || '—'}</td>
                    <td className="num">{fmt(loanAmount(l), currency)}</td>
                    <td className="num">{fmt(s.monthlyEMI, currency)}</td>
                    <td className="num">{pctStr(s.paidPct)}</td>
                    <td className="num">{fmt(s.balancePrincipal, currency)}</td>
                    <td>{s.nextDue ? <span className={`badge ${s.overdue ? 'neg' : 'pos'}`}>{fullDateLabel(s.nextDue.dueDate)}{s.overdue ? ' overdue' : ''}</span> : <span className="badge pos">Paid off</span>}</td>
                    <td style={{ textAlign: 'right' }}><button className="icon-btn" onClick={e => { e.stopPropagation(); deleteLoan(l); }}>✕</button></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {isSingleCarView && selected ? (
        <FinancingDetail loan={selected} vehicles={vehicles} onChange={patch => updateLoan(selected.id, patch)} currency={currency} onPrint={() => onPrintLoan(selected.id)} deletePin={deletePin} />
      ) : displayLoans.length > 0 ? (
        <>
          <div className="panel">
            <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: 0 }}>
              {displayLoans.length} cars selected — showing combined figures below. Individual loan details, schedules, and the defer/paid tools are only shown when exactly one car is selected in Report Selection above, to avoid mixing up separate loans.
            </p>
          </div>
          <div className="grid-2">
            <div className="panel" style={{ textAlign: 'center' }}>
              <h3>Combined Payment Progress</h3>
              <DonutGauge pct={aggPaidPct} color={aggPaidPct >= 1 ? '#3E9C6E' : '#2D6E8E'} />
              <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: 8 }}>across {displayLoans.length} selected car{displayLoans.length > 1 ? 's' : ''}</p>
            </div>
            <div className="panel">
              <h3>Combined Total vs Paid</h3>
              <GroupedBarChart data={[
                { label: 'Principal', total: aggStats.totalPrincipal, paid: aggStats.paidPrincipal },
                { label: 'Interest', total: aggStats.totalInterest, paid: aggStats.paidInterest },
                { label: 'Total', total: aggStats.totalAmount, paid: aggStats.paidAmount },
              ]} series={[{ key: 'total', label: 'Total', color: '#D9C8B9' }, { key: 'paid', label: 'Paid', color: '#2D6E8E' }]} height={160} />
            </div>
          </div>
        </>
      ) : null}
    </div>
  );
}

function FinancingDetail({ loan, vehicles, onChange, currency, onPrint, deletePin }) {
  const stats = loanStats(loan);
  const [deferFrom, setDeferFrom] = useState(stats.nextDue ? stats.nextDue.number : 1);
  const [deferMonths, setDeferMonths] = useState(1);
  const [bulkText, setBulkText] = useState('');
  const [markPaidUpTo, setMarkPaidUpTo] = useState('');
  const [showDetails, setShowDetails] = useState(loan.schedule.length === 0);
  const [showImport, setShowImport] = useState(false);

  function regenerate() {
    if (loan.schedule.some(r => r.paid) && !confirmDelete('this loan\'s ENTIRE schedule, including its paid installment history', deletePin)) return;
    onChange({ schedule: generateSchedule(loan) });
  }

  function updateRow(id, field, value) {
    onChange({ schedule: loan.schedule.map(r => r.id === id ? { ...r, [field]: value } : r) });
  }
  function togglePaid(id) {
    onChange({
      schedule: loan.schedule.map(r => r.id === id ? { ...r, paid: !r.paid, paidDate: !r.paid ? new Date().toISOString().slice(0, 10) : '' } : r)
    });
  }

  function applyDefer() {
    const fromN = num(deferFrom);
    const months = num(deferMonths);
    if (!fromN || !months) return;
    const newSchedule = applyDeferment(loan.schedule, fromN, months);
    const newDeferments = [...(loan.deferments || []), { id: uid('def'), fromNumber: fromN, months, appliedOn: new Date().toISOString().slice(0, 10) }];
    onChange({ schedule: newSchedule, deferments: newDeferments });
  }

  function markPaidThrough() {
    if (!markPaidUpTo) return;
    onChange({ schedule: loan.schedule.map(r => r.dueDate.slice(0, 7) <= markPaidUpTo ? { ...r, paid: true, paidDate: r.paidDate || r.dueDate } : r) });
  }

  function applyBulk() {
    if (loan.schedule.some(r => r.paid) && !confirmDelete('this loan\'s ENTIRE schedule, including its paid installment history', deletePin)) return;
    const parseAmt = (v) => {
      if (v === undefined || v === null) return 0;
      let s = String(v).trim();
      if (!s || s === '-' || s === '—') return 0;
      let neg = false;
      if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
      s = s.replace(/,/g, '').replace(/[^0-9.\-]/g, '');
      if (!s) return 0;
      const n = parseFloat(s);
      if (isNaN(n)) return 0;
      return neg ? -Math.abs(n) : n;
    };
    const lines = bulkText.split('\n').map(l => l.replace(/\r$/, '')).filter(l => l.trim() !== '');
    const rows = lines.map(line => {
      // Prefer splitting on tabs (how Excel/Sheets pastes columns) so commas inside
      // numbers like "4,923.88" are never mistaken for a column separator.
      const parts = (line.includes('\t') ? line.split('\t') : line.split(',')).map(p => p.trim());
      let number, dateStr, principal, interest, paid = false;
      if (parts.length >= 9) {
        // Inst No, Due Date, Principal Amount, Profit Amount, Total EMI, Payable, Paid, Balance, Status
        number = parts[0]; dateStr = parts[1]; principal = parseAmt(parts[2]); interest = parseAmt(parts[3]);
        const paidAmt = parseAmt(parts[6]);
        const statusText = String(parts[8] || '').trim().toLowerCase();
        paid = statusText === 'paid' || paidAmt > 0;
      } else if (parts.length >= 6) {
        // Bank format: Inst.No, Date, EMI, Principal Balance, Principal Component, Profit/Interest Component, [Rate]
        number = parts[0]; dateStr = parts[1]; principal = parseAmt(parts[4]); interest = parseAmt(parts[5]);
      } else {
        // Simple format: Number, Date, Principal, Interest
        number = parts[0]; dateStr = parts[1]; principal = parseAmt(parts[2]); interest = parseAmt(parts[3]);
      }
      const dueDate = parseFlexibleDate(dateStr);
      return { id: uid('inst'), number: num(number), dueDate, principal, interest, paid, paidDate: paid ? dueDate : '' };
    }).filter(r => r.number).sort((a, b) => a.number - b.number);
    onChange({ schedule: rows });
    setBulkText('');
  }

  return (
    <div>
      <div className="panel">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <h3 style={{ margin: 0 }}>Loan Details {!showDetails && <span style={{ fontWeight: 400, color: 'var(--muted)', fontSize: 12, textTransform: 'none' }}>— {loan.modelName || '(unnamed)'}, {fmt(loanAmount(loan), currency)} at {loan.interestRate || 0}%</span>}</h3>
          <button className="btn small" onClick={() => setShowDetails(!showDetails)}>{showDetails ? 'Hide' : 'Edit Loan Details'}</button>
        </div>
        {showDetails && (
        <>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginTop: 12 }}>
          <div className="field" style={{ flex: '1 1 180px' }}><label>Vehicle / Model</label><input value={loan.modelName} onChange={e => onChange({ modelName: e.target.value })} placeholder="Nissan Patrol" /></div>
          <div className="field" style={{ flex: '1 1 160px' }}><label>Link to Fleet Vehicle (optional)</label>
            <select value={loan.vehicleId} onChange={e => onChange({ vehicleId: e.target.value })}>
              <option value="">— not linked —</option>
              {vehicles.map(v => <option key={v.id} value={v.id}>{v.name} ({v.plate})</option>)}
            </select>
          </div>
          <div className="field" style={{ flex: '1 1 160px' }}><label>Lender / Bank</label><input value={loan.lender} onChange={e => onChange({ lender: e.target.value })} /></div>
        </div>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginTop: 10 }}>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Car Value ({currency})</label><input type="number" value={loan.carValue} onChange={e => onChange({ carValue: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Down Payment ({currency})</label><input type="number" value={loan.downPayment} onChange={e => onChange({ downPayment: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Processing / Other Fee</label><input type="number" value={loan.processingFee} onChange={e => onChange({ processingFee: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 160px', display: 'flex', alignItems: 'flex-end', gap: 6 }}>
            <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12.5 }}>
              <input type="checkbox" checked={loan.includeFeeInLoan} onChange={e => onChange({ includeFeeInLoan: e.target.checked })} /> Finance fee into loan
            </label>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginTop: 10 }}>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Interest Rate % / Year</label><input type="number" value={loan.interestRate} onChange={e => onChange({ interestRate: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 100px' }}><label>Term</label><input type="number" value={loan.termValue} onChange={e => onChange({ termValue: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 110px' }}><label>Unit</label>
            <select value={loan.termUnit} onChange={e => onChange({ termUnit: e.target.value })}>
              <option value="months">Months</option>
              <option value="years">Years</option>
            </select>
          </div>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Start Date (exact auto-debit day)</label><input type="date" value={loan.startDate && loan.startDate.length === 7 ? loan.startDate + '-01' : loan.startDate} onChange={e => onChange({ startDate: e.target.value })} /></div>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Loan Amount</label><input disabled value={fmt(loanAmount(loan), currency)} /></div>
        </div>

        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginTop: 10, background: '#F7F8F5', border: '1px solid var(--line)', borderRadius: 8, padding: 12 }}>
          <div style={{ flex: '1 1 160px' }}>
            <div style={{ fontSize: 11, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.04em' }}>Estimated Monthly EMI</div>
            <div className="mono" style={{ fontSize: 18 }}>{fmt(calcEMI(loanAmount(loan), loan.interestRate, loanTermMonths(loan)), currency)}</div>
          </div>
          <div style={{ flex: '1 1 200px' }}>
            <div style={{ fontSize: 11, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.04em' }}>Estimated Total Payable (Loan + Interest)</div>
            <div className="mono" style={{ fontSize: 18 }}>{fmt(calcEMI(loanAmount(loan), loan.interestRate, loanTermMonths(loan)) * loanTermMonths(loan), currency)}</div>
          </div>
          <div style={{ fontSize: 11.5, color: 'var(--muted)', alignSelf: 'flex-end' }}>= (Loan Amount + Interest Rate × Years Financed) ÷ months. Generate the schedule below for exact figures.</div>
        </div>

        <button className="btn primary" style={{ marginTop: 10 }} onClick={regenerate}>{loan.schedule.length ? 'Regenerate Schedule' : 'Generate Schedule'}</button>
        </>
        )}
      </div>

      {loan.schedule.length > 0 && (
        <>
          <div className="kpi-row">
            <div className="kpi-card"><div className="label">Monthly EMI</div><div className="value mono">{fmt(stats.monthlyEMI, currency)}</div></div>
            <div className="kpi-card"><div className="label">Total Payable (Loan + Interest)</div><div className="value mono">{fmt(stats.totalAmount, currency)}</div></div>
            <div className="kpi-card"><div className="label">Principal Balance</div><div className="value mono">{fmt(stats.balancePrincipal, currency)}</div></div>
            <div className="kpi-card"><div className="label">Interest Balance</div><div className="value mono">{fmt(stats.balanceInterest, currency)}</div></div>
            <div className="kpi-card"><div className="label">Payoff Date</div><div className="value mono" style={{ fontSize: 18 }}>{stats.payoffDate ? fullDateLabel(stats.payoffDate) : '—'}</div></div>
            {stats.overdue && <div className="kpi-card" style={{ borderLeft: '4px solid var(--red)' }}><div className="label">Status</div><div className="value mono" style={{ color: 'var(--red)', fontSize: 16 }}>Overdue</div></div>}
          </div>

          <div className="grid-2">
            <div className="panel" style={{ textAlign: 'center' }}>
              <h3>Payment Progress</h3>
              <DonutGauge pct={stats.paidPct} color={stats.paidPct >= 1 ? '#3E9C6E' : '#2D6E8E'} />
              <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: 8 }}>{stats.installmentsPaid} of {stats.installmentsTotal} installments paid</p>
            </div>
            <div className="panel">
              <h3>Total vs Paid</h3>
              <GroupedBarChart data={[
                { label: 'Principal', total: stats.totalPrincipal, paid: stats.paidPrincipal },
                { label: 'Interest', total: stats.totalInterest, paid: stats.paidInterest },
                { label: 'Total', total: stats.totalAmount, paid: stats.paidAmount },
              ]} series={[{ key: 'total', label: 'Total', color: '#D9C8B9' }, { key: 'paid', label: 'Paid', color: '#2D6E8E' }]} height={160} />
            </div>
          </div>

          <div className="panel">
            <table>
              <thead><tr><th>Category</th><th className="num">Total</th><th className="num">Paid</th><th className="num">Balance</th><th className="num">% Paid</th></tr></thead>
              <tbody>
                <tr><td>Principal</td><td className="num">{fmt(stats.totalPrincipal, currency)}</td><td className="num">{fmt(stats.paidPrincipal, currency)}</td><td className="num">{fmt(stats.balancePrincipal, currency)}</td><td className="num">{pctStr(stats.principalPaidPct)}</td></tr>
                <tr><td>Interest</td><td className="num">{fmt(stats.totalInterest, currency)}</td><td className="num">{fmt(stats.paidInterest, currency)}</td><td className="num">{fmt(stats.balanceInterest, currency)}</td><td className="num">{pctStr(stats.interestPaidPct)}</td></tr>
                <tr className="net-row"><td>Total</td><td className="num">{fmt(stats.totalAmount, currency)}</td><td className="num">{fmt(stats.paidAmount, currency)}</td><td className="num">{fmt(stats.balanceAmount, currency)}</td><td className="num">{pctStr(stats.paidPct)}</td></tr>
              </tbody>
            </table>
          </div>

          <div className="panel">
            <h3>Defer / Postpone Payment</h3>
            <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -6 }}>Push a due date forward — e.g. a 2-month deferment shifts that installment and every one after it two months later (payoff date moves out too).</p>
            <div style={{ display: 'flex', gap: 10, alignItems: 'flex-end', flexWrap: 'wrap' }}>
              <div className="field"><label>Defer from installment #</label><input type="number" min="1" value={deferFrom} onChange={e => setDeferFrom(e.target.value)} style={{ width: 100 }} /></div>
              <div className="field"><label>Months to defer</label><input type="number" min="1" value={deferMonths} onChange={e => setDeferMonths(e.target.value)} style={{ width: 100 }} /></div>
              <button className="btn primary" onClick={applyDefer}>Apply Deferment</button>
            </div>
            {loan.deferments && loan.deferments.length > 0 && (
              <div style={{ marginTop: 10 }}>
                {loan.deferments.map(d => (
                  <div key={d.id} style={{ fontSize: 12, color: 'var(--muted)' }}>• Deferred {d.months} month{d.months > 1 ? 's' : ''} starting from installment #{d.fromNumber} — applied {d.appliedOn}</div>
                ))}
              </div>
            )}
          </div>

          <div className="panel">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10, flexWrap: 'wrap', gap: 10 }}>
              <h3 style={{ margin: 0 }}>Payment Schedule</h3>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                <span style={{ fontSize: 12, color: 'var(--muted)' }}>Mark all installments due through</span>
                <input type="month" value={markPaidUpTo} onChange={e => setMarkPaidUpTo(e.target.value)} style={{ padding: '4px 8px', border: '1px solid var(--line)', borderRadius: 5, fontSize: 12.5 }} />
                <button className="btn small" onClick={markPaidThrough}>as Paid</button>
                <button className="btn small" onClick={onPrint}>🖨 Print Schedule</button>
              </div>
            </div>
            <div style={{ maxHeight: 420, overflowY: 'auto' }}>
              <table>
                <thead><tr><th>#</th><th>Due Date</th><th className="num">Principal</th><th className="num">Interest</th><th className="num">Total</th><th>Paid</th><th>Paid Date</th></tr></thead>
                <tbody>
                  {loan.schedule.map(r => (
                    <tr key={r.id} style={{ background: !r.paid && r.dueDate < new Date().toISOString().slice(0, 10) ? '#FDEDEC' : undefined }}>
                      <td>{r.number}</td>
                      <td><input type="date" value={r.dueDate && r.dueDate.length === 7 ? r.dueDate + '-01' : r.dueDate} onChange={e => updateRow(r.id, 'dueDate', e.target.value)} style={{ width: 130 }} /></td>
                      <td className="num"><input type="number" value={r.principal} onChange={e => updateRow(r.id, 'principal', e.target.value)} /></td>
                      <td className="num"><input type="number" value={r.interest} onChange={e => updateRow(r.id, 'interest', e.target.value)} /></td>
                      <td className="num">{fmt(num(r.principal) + num(r.interest), currency)}</td>
                      <td><input type="checkbox" checked={r.paid} onChange={() => togglePaid(r.id)} /></td>
                      <td>
                        {r.paid ? (
                          <input type="date" value={r.paidDate && r.paidDate.length === 7 ? r.paidDate + '-01' : r.paidDate} onChange={e => updateRow(r.id, 'paidDate', e.target.value)} style={{ width: 130 }} />
                        ) : '—'}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </>
      )}

      <div className="panel">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <h3 style={{ margin: 0 }}>Import / Paste Your Own Schedule</h3>
          <button className="btn small" onClick={() => setShowImport(!showImport)}>{showImport ? 'Hide' : 'Import / Paste Schedule'}</button>
        </div>
        {showImport && (
          <>
            <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: 10 }}>Copy the rows straight out of your bank's spreadsheet (including a "Status"/"Paid" column if it has one) and paste them below — no need to reformat dates or retype anything. This replaces the schedule above entirely. Supported layouts, auto-detected:</p>
            <ul style={{ fontSize: 12, color: 'var(--muted)', marginTop: -4, paddingLeft: 18 }}>
              <li><code>Inst No, Due Date, Principal, Profit, Total EMI, Payable, Paid, Balance, Status</code> — paid status is read from the Status/Paid columns automatically</li>
              <li><code>Inst No, Date, EMI, Principal Balance, Principal, Profit, Rate</code></li>
              <li><code>Number, Date, Principal, Interest</code></li>
            </ul>
            <textarea value={bulkText} onChange={e => setBulkText(e.target.value)} rows={4}
              style={{ width: '100%', border: '1px solid var(--line)', borderRadius: 6, padding: 8, fontSize: 12.5, boxSizing: 'border-box', fontFamily: 'Roboto Mono, monospace' }}
              placeholder={"1, 2026-08, 5200.00, 1030.05\n2, 2026-09, 5240.85, 989.21"} />
            <button className="btn primary" style={{ marginTop: 8 }} onClick={applyBulk}>Replace Schedule with Pasted Data</button>
          </>
        )}
      </div>
    </div>
  );
}

function LoanScheduleReport({ loan, companyName, currency }) {
  if (!loan) return null;
  const stats = loanStats(loan);
  return (
    <div style={{ padding: 24 }}>
      <h1 style={{ fontSize: 20 }}>{companyName}</h1>

function VehiclesPanel({ vehicles, setVehicles, deletePin, currency }) {
  const [form, setForm] = useState({ name: '', plate: '', category: '', purchaseValue: '', usefulLifeOverride: '' });
  const [bulkText, setBulkText] = useState('');
  const [search, setSearch] = useState('');
  const [editId, setEditId] = useState(null);
  const CATEGORY_PRESETS = ['Economy Cars', 'Luxury Cars', 'Small Cars', 'Office Use Cars'];

  function addVehicle() {
    if (!form.name.trim()) return;
    if (editId) {
      setVehicles(vehicles.map(v => v.id === editId ? { ...v, ...form } : v));
      setEditId(null);
    } else {
      setVehicles([...vehicles, { id: uid('veh'), ...form }]);
    }
    setForm({ name: '', plate: '', category: '', purchaseValue: '', usefulLifeOverride: '' });
  }
  function editVehicle(v) { setEditId(v.id); setForm({ name: v.name, plate: v.plate, category: v.category || '', purchaseValue: v.purchaseValue || '', usefulLifeOverride: v.usefulLifeOverride || '' }); }
  function deleteVehicle(v) { if (!confirmDelete(v.name, deletePin)) return; setVehicles(vehicles.filter(x => x.id !== v.id)); }
  function bulkAdd() {
    const lines = bulkText.split('\n').map(l => l.trim()).filter(Boolean);
    const nv = lines.map(line => { const parts = line.split(',').map(p => p.trim()); return { id: uid('veh'), name: parts[0] || 'Unnamed', plate: parts[1] || '', category: parts[2] || '', purchaseValue: parts[3] || '' }; });
    setVehicles([...vehicles, ...nv]); setBulkText('');
  }
  const filtered = vehicles.filter(v => !search || v.name.toLowerCase().includes(search.toLowerCase()) || v.plate.toLowerCase().includes(search.toLowerCase()));

  return (
    <div>
      <div className="panel">
        <h3>{editId ? 'Edit Vehicle' : 'Add Vehicle'}</h3>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <div className="field" style={{ flex: '1 1 160px' }}><label>Model / Vehicle Name</label><input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Nissan Sunny" /></div>
          <div className="field" style={{ flex: '1 1 120px' }}><label>Plate</label><input value={form.plate} onChange={e => setForm({ ...form, plate: e.target.value })} placeholder="9182-G" /></div>
          <div className="field" style={{ flex: '1 1 160px' }}>
            <label>Category</label>
            <input value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} placeholder="Economy Cars" list="category-presets" />
            <datalist id="category-presets">{CATEGORY_PRESETS.map(c => <option key={c} value={c} />)}</datalist>
          </div>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Purchase Value ({currency})</label><input type="number" value={form.purchaseValue} onChange={e => setForm({ ...form, purchaseValue: e.target.value })} placeholder="50000" /></div>
          <div className="field" style={{ flex: '1 1 140px' }}><label>Useful Life Override (yrs, optional)</label><input type="number" value={form.usefulLifeOverride} onChange={e => setForm({ ...form, usefulLifeOverride: e.target.value })} placeholder="uses default" /></div>
        </div>
        <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
          <button className="btn primary" onClick={addVehicle}>{editId ? 'Update Vehicle' : '+ Add Vehicle'}</button>
          {editId && <button className="btn" onClick={() => { setEditId(null); setForm({ name: '', plate: '', category: '', purchaseValue: '', usefulLifeOverride: '' }); }}>Cancel</button>}
        </div>
      </div>
      <div className="panel">
        <h3>Bulk Add</h3>
        <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -4 }}>One vehicle per line: <code>Name, Plate, Category (optional), Purchase Value (optional)</code></p>
        <textarea value={bulkText} onChange={e => setBulkText(e.target.value)} rows={5} style={{ width: '100%', border: '1px solid var(--line)', borderRadius: 6, padding: 8, fontSize: 13, boxSizing: 'border-box', fontFamily: 'Roboto Mono, monospace' }} placeholder={"Nissan Sunny, 9182-G, Economy Cars, 45000\nGMC Yukon, 9185-G, Luxury Cars, 120000"} />
        <button className="btn primary" style={{ marginTop: 10 }} onClick={bulkAdd}>+ Add All</button>
      </div>
      <div className="panel">
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 10 }}>
          <h3 style={{ margin: 0 }}>Fleet ({vehicles.length})</h3>
          <input placeholder="Search" value={search} onChange={e => setSearch(e.target.value)} style={{ border: '1px solid var(--line)', borderRadius: 7, padding: '5px 10px', fontSize: 12.5 }} />
        </div>
        <table>
          <thead><tr><th>Model / Name</th><th>Plate</th><th>Category</th><th className="num">Purchase Value</th><th className="num">Useful Life</th><th></th></tr></thead>
          <tbody>
            {filtered.map(v => (
              <tr key={v.id}>
                <td>{v.name}</td><td>{v.plate}</td><td>{v.category || '—'}</td>
                <td className="num">{v.purchaseValue ? num(v.purchaseValue).toLocaleString('en-US') : '—'}</td>
                <td className="num">{v.usefulLifeOverride ? v.usefulLifeOverride + ' yrs' : 'default'}</td>
                <td style={{ textAlign: 'right' }}>
                  <button className="icon-btn" onClick={() => editVehicle(v)}>✎</button>{' '}

          </tbody>
        </table>
      </div>
    </div>
  );

/* ---------------- Import from Excel ---------------- */

function ImportPanel({ lineItems, setLineItems, monthlyData, setMonthlyData, monthKeys }) {
  const [step, setStep] = useState(1);
  const [sheets, setSheets] = useState({});
  const [sheetNames, setSheetNames] = useState([]);
  const [selectedSheet, setSelectedSheet] = useState('');
  const [rawRows, setRawRows] = useState([]);
  const [headerRow, setHeaderRow] = useState(0);
  const [labelCol, setLabelCol] = useState(0);
  const [colMaps, setColMaps] = useState([]);
  const [rowMaps, setRowMaps] = useState([]);
  const [fileName, setFileName] = useState('');

  function normLabel(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }

  const flatItems = useMemo(() => {
    const arr = [];
    Object.keys(lineItems).forEach(sec => lineItems[sec].forEach(it => arr.push({ sectionKey: sec, key: it.key, label: it.label })));
    return arr;
  }, [lineItems]);

  function parseNum(v) {
    if (v === undefined || v === null || v === '') return '';
    if (typeof v === 'number') return v;
    let s = String(v).trim();
    if (!s || s === '-' || /^#/.test(s)) return '';
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    s = s.replace(/,/g, '').replace(/%/g, '').replace(/[^0-9.\-]/g, '');
    if (!s) return '';
    const n = parseFloat(s);
    if (isNaN(n)) return '';
    return neg ? -Math.abs(n) : n;
  }

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setFileName(file.name);
    const reader = new FileReader();
    reader.onload = (evt) => {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const sheetObj = {};
      // raw:false returns the same formatted text you see in Excel (e.g. "58,850", "49%") instead
      // of the underlying stored number — this matters because percentage-formatted cells store
      // 49% internally as 0.49, which would otherwise import as a near-zero decimal.
      wb.SheetNames.forEach(name => { sheetObj[name] = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: '' }); });
      setSheets(sheetObj);
      setSheetNames(wb.SheetNames);
      const first = wb.SheetNames[0];
      setSelectedSheet(first);
      setRawRows(sheetObj[first]);
      setHeaderRow(0);
      setLabelCol(0);
      setStep(2);
    };
    reader.readAsArrayBuffer(file);
  }

  function selectSheet(name) { setSelectedSheet(name); setRawRows(sheets[name] || []); setHeaderRow(0); setLabelCol(0); }

  function proceedToColumnMapping() {
    const headerCells = rawRows[headerRow] || [];
    const monthNameToNum = { jan: 1, january: 1, feb: 2, february: 2, mar: 3, march: 3, apr: 4, april: 4, may: 5, jun: 6, june: 6, jul: 7, july: 7, aug: 8, august: 8, sep: 9, sept: 9, september: 9, oct: 10, october: 10, nov: 11, november: 11, dec: 12, december: 12 };
    const maps = headerCells.map((cell, idx) => {
      if (idx === labelCol) return { skip: true };
      const text = String(cell || '').trim().toLowerCase().replace(/[^a-z]/g, '');
      const monthNum = monthNameToNum[text];
      if (monthNum) {
        // Auto-recognized a month header (e.g. "JAN", "February") — map it straight to that
        // month of the currently selected year, defaulting to Budget since full-year grids
        // in these sheets are almost always the budget column.
        return { skip: false, period: monthKeys[monthNum - 1] || monthKeys[0], field: 'budget' };
      }
      const isBudget = /budget/.test(text);
      const isActual = /actual/.test(text);
      if (isBudget || isActual) {
        return { skip: false, period: monthKeys[0], field: isActual ? 'actual' : 'budget' };
      }
      return { skip: true, period: monthKeys[0], field: 'budget' };
    });
    setColMaps(maps);
    setStep(3);
  }

  function proceedToRowMapping() {
    const dataRows = rawRows.slice(headerRow + 1);
    // Rows that look like subtotals, section headers, ratio/percentage summary lines, or
    // report title/footer text — these aren't real accounts, so they default OFF and the
    // user has to deliberately switch them on if they really want to import one as a line item.
    const skipPatterns = /^(total|gross profit|net profit|ebitda|ebitad|ratio$|particulars$|revenue$|direct expenses$|indirect expenses$|interest\s*&|profit on sale|amounts in|projected budget|page\s*\d|^\s*llc|dubai|budget statement)/i;
    const maps = dataRows.map(row => {
      const label = row[labelCol];
      if (!label || String(label).trim() === '') return { enabled: false, label: '' };
      const labelStr = String(label).trim();
      const norm = normLabel(labelStr);
      const match = flatItems.find(fi => normLabel(fi.label) === norm) ||
        flatItems.find(fi => norm.length > 3 && (normLabel(fi.label).includes(norm) || norm.includes(normLabel(fi.label))));
      const looksLikeNonAccount = !match && (skipPatterns.test(labelStr) || /%\s*$/.test(labelStr) || (labelStr === labelStr.toUpperCase() && labelStr.replace(/[^A-Z]/g, '').length > 4));
      return {
        enabled: !looksLikeNonAccount,
        label: labelStr,
        sectionKey: match ? match.sectionKey : 'direct',
        itemKey: match ? match.key : 'new',
        autoSkipped: looksLikeNonAccount,
      };
    });
    setRowMaps(maps);
    setStep(4);
  }

  function runImport() {
    let updatedLineItems = { ...lineItems };
    const newDataByPeriod = {};
    const dataRows = rawRows.slice(headerRow + 1);

    dataRows.forEach((row, rIdx) => {
      const rm = rowMaps[rIdx];
      if (!rm || !rm.enabled) return;
      let itemKey = rm.itemKey;
      if (itemKey === 'new') {
        const newKey = uid('item');
        updatedLineItems = { ...updatedLineItems, [rm.sectionKey]: [...updatedLineItems[rm.sectionKey], { key: newKey, label: rm.label }] };
        itemKey = newKey;
      }
      colMaps.forEach((cm, cIdx) => {
        if (!cm || cm.skip || cIdx === labelCol) return;
        const val = parseNum(row[cIdx]);
        if (val === '') return;
        if (!newDataByPeriod[cm.period]) newDataByPeriod[cm.period] = {};
        if (!newDataByPeriod[cm.period][itemKey]) newDataByPeriod[cm.period][itemKey] = {};
        newDataByPeriod[cm.period][itemKey][cm.field] = val;
      });
    });

    setLineItems(updatedLineItems);
    setMonthlyData(prev => {
      const merged = { ...prev };
      Object.keys(newDataByPeriod).forEach(period => {
        merged[period] = { ...(merged[period] || {}) };
        Object.keys(newDataByPeriod[period]).forEach(key => {
          merged[period][key] = { ...(merged[period][key] || {}), ...newDataByPeriod[period][key] };
        });
      });
      return merged;
    });
    setStep(5);
  }

  function resetImport() { setStep(1); setSheets({}); setSheetNames([]); setSelectedSheet(''); setRawRows([]); setColMaps([]); setRowMaps([]); setFileName(''); }

  return (
    <div className="panel">
      <h3>Import Budget / Actuals from Excel</h3>

      {step === 1 && (
        <div>
          <p style={{ fontSize: 13, color: 'var(--muted)' }}>Upload your existing Excel budget report. You'll map columns to months and rows to line items before anything is saved — nothing is imported until you confirm on the last step.</p>
          <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} />
        </div>
      )}

      {step === 2 && (
        <div>
          <p style={{ fontSize: 13 }}>File: <b>{fileName}</b></p>
          {sheetNames.length > 1 && (
            <div className="field" style={{ maxWidth: 260, marginBottom: 10 }}>
              <label>Sheet</label>
              <select value={selectedSheet} onChange={e => selectSheet(e.target.value)}>
                {sheetNames.map(n => <option key={n} value={n}>{n}</option>)}
              </select>
            </div>
          )}
          <div style={{ display: 'flex', gap: 16, marginBottom: 10 }}>
            <div className="field"><label>Header row (0-indexed)</label><input type="number" min="0" value={headerRow} onChange={e => setHeaderRow(Math.max(0, num(e.target.value)))} /></div>
            <div className="field"><label>Label column (0-indexed)</label><input type="number" min="0" value={labelCol} onChange={e => setLabelCol(Math.max(0, num(e.target.value)))} /></div>
          </div>
          <div style={{ overflowX: 'auto', border: '1px solid var(--line)', borderRadius: 8, maxHeight: 260 }}>
            <table>
              <tbody>
                {rawRows.slice(0, 14).map((row, ri) => (
                  <tr key={ri} style={{ background: ri === headerRow ? '#EFF4F1' : undefined }}>
                    <td className="num" style={{ color: 'var(--muted)' }}>{ri}</td>
                    {row.map((cell, ci) => <td key={ci} style={{ background: ci === labelCol ? '#FBF4E8' : undefined }}>{String(cell).slice(0, 24)}</td>)}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <p style={{ fontSize: 11.5, color: 'var(--muted)' }}>Green row = header · Yellow column = line item labels. Adjust the numbers above if they're not detected correctly.</p>
          <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
            <button className="btn" onClick={resetImport}>Cancel</button>
            <button className="btn primary" onClick={proceedToColumnMapping}>Next: Map Columns →</button>
          </div>
        </div>
      )}

      {step === 3 && (
        <div>
          <p style={{ fontSize: 13, color: 'var(--muted)' }}>For each column, choose which month it represents and whether it's Budget or Actual. Leave "Ignore" for columns like Variance or Remarks.</p>
          <div style={{ overflowX: 'auto' }}>
            <table>
              <thead><tr><th>Col</th><th>Header Text</th><th>Import</th><th>Month</th><th>Type</th></tr></thead>
              <tbody>
                {(rawRows[headerRow] || []).map((cell, ci) => {
                  if (ci === labelCol) return null;
                  const cm = colMaps[ci] || { skip: true };
                  return (
                    <tr key={ci}>
                      <td className="num">{ci}</td>
                      <td>{String(cell).slice(0, 30)}</td>
                      <td>
                        <select value={cm.skip ? 'ignore' : 'use'} onChange={e => { const v = e.target.value; setColMaps(prev => prev.map((c, idx) => idx === ci ? { ...c, skip: v === 'ignore' } : c)); }}>
                          <option value="ignore">Ignore</option>
                          <option value="use">Import</option>
                        </select>
                      </td>
                      <td>
                        <select disabled={cm.skip} value={cm.period || monthKeys[0]} onChange={e => setColMaps(prev => prev.map((c, idx) => idx === ci ? { ...c, period: e.target.value } : c))}>
                          {monthKeys.map(p => <option key={p} value={p}>{monthLabel(p)}</option>)}
                        </select>
                      </td>
                      <td>
                        <select disabled={cm.skip} value={cm.field || 'budget'} onChange={e => setColMaps(prev => prev.map((c, idx) => idx === ci ? { ...c, field: e.target.value } : c))}>
                          <option value="budget">Budget</option>
                          <option value="actual">Actual</option>
                        </select>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
            <button className="btn" onClick={() => setStep(2)}>← Back</button>
            <button className="btn primary" onClick={proceedToRowMapping}>Next: Map Line Items →</button>
          </div>
        </div>
      )}

      {step === 4 && (
        <div>
          <p style={{ fontSize: 13, color: 'var(--muted)' }}>Rows were auto-matched to your existing line items where possible. Rows that look like subtotals, section headers, ratio/percentage lines, or report title text (e.g. "Total Income", "Gross Profit %", company name/footer lines) are automatically left unchecked — the app calculates those itself and they shouldn't be imported as accounts. Review, adjust, or re-enable anything the guess got wrong.</p>
          <div style={{ overflowX: 'auto', maxHeight: 420, overflowY: 'auto' }}>
            <table>
              <thead><tr><th></th><th>Row Label</th><th>Section</th><th>Maps to</th><th></th></tr></thead>
              <tbody>
                {rowMaps.map((rm, ri) => rm.label ? (
                  <tr key={ri} style={{ background: rm.autoSkipped ? '#FBF4E8' : undefined }}>
                    <td><input type="checkbox" checked={rm.enabled} onChange={e => setRowMaps(prev => prev.map((r, idx) => idx === ri ? { ...r, enabled: e.target.checked } : r))} /></td>
                    <td>{rm.label}</td>
                    <td>
                      <select disabled={!rm.enabled} value={rm.sectionKey} onChange={e => setRowMaps(prev => prev.map((r, idx) => idx === ri ? { ...r, sectionKey: e.target.value, itemKey: 'new' } : r))}>
                        {Object.keys(SECTION_META).map(sec => <option key={sec} value={sec}>{SECTION_META[sec].title}</option>)}
                      </select>
                    </td>
                    <td>
                      <select disabled={!rm.enabled} value={rm.itemKey} onChange={e => setRowMaps(prev => prev.map((r, idx) => idx === ri ? { ...r, itemKey: e.target.value } : r))}>
                        <option value="new">+ New item: "{rm.label}"</option>
                        {lineItems[rm.sectionKey].map(it => <option key={it.key} value={it.key}>{it.label}</option>)}
                      </select>
                    </td>
                    <td style={{ fontSize: 11, color: 'var(--amber)' }}>{rm.autoSkipped ? 'auto-skipped: looks like a subtotal/header' : ''}</td>
                  </tr>
                ) : null)}
              </tbody>
            </table>
          </div>
          <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
            <button className="btn" onClick={() => setStep(3)}>← Back</button>
            <button className="btn primary" onClick={runImport}>Import Data</button>
          </div>
        </div>
      )}

      {step === 5 && (
        <div>
          <p style={{ fontSize: 14 }}>✅ Import complete. Check P&amp;L Entry and P&amp;L Compare to review the imported numbers.</p>
          <button className="btn primary" onClick={resetImport}>Import Another File</button>
        </div>
      )}
    </div>
  );
}

/* ---------------- Quick Review (executive one-page summary) ---------------- */

function QuickReviewPanel({ companyName, logoDataUrl, currency, rangeMonths, lineItems, monthlyData, vehicles, occupancy, baseDays }) {
  const qr = computeQuickReview(rangeMonths, monthlyData, lineItems, vehicles, occupancy, baseDays);
  const periodLabel = rangeMonths.length ? (rangeMonths.length === 1 ? monthLabel(rangeMonths[0]) : monthLabel(rangeMonths[0]) + ' – ' + monthLabel(rangeMonths[rangeMonths.length - 1])) : '—';

  if (rangeMonths.length === 0) return <div className="empty-state"><h2>No period selected</h2><p>Pick a Report From / Report To range at the top of the app.</p></div>;

  return (
    <div>
      <div className="panel" style={{ background: 'linear-gradient(135deg,#161B26,#2D6E8E)', border: 'none' }}>
        {logoDataUrl && <img src={logoDataUrl} alt="logo" style={{ height: 'auto', width: 'auto', maxHeight: '9vw', minHeight: 28, maxWidth: '30%', objectFit: 'contain', marginBottom: 8, background: '#fff', borderRadius: 6, padding: 4, display: 'block' }} />}
        <h1 style={{ fontSize: 20, color: '#fff', margin: 0 }}>{companyName}</h1>
        <p style={{ color: 'rgba(255,255,255,0.75)', margin: '4px 0 0 0', fontSize: 13 }}>{periodLabel} Performance Dashboard</p>
      </div>

      <div className="kpi-row">
        <div className="kpi-card" style={{ borderLeft: '4px solid ' + (qr.totals.netprofit_actual >= 0 ? '#3E9C6E' : '#C1503F') }}>
          <div className="label">Net Profit / Loss</div>
          <div className="value mono" style={{ fontSize: 24, color: qr.totals.netprofit_actual >= 0 ? '#3E9C6E' : '#C1503F' }}>{fmt(qr.totals.netprofit_actual, currency)}</div>
          <div className="sub" style={{ color: 'var(--muted)' }}>vs budget {fmt(qr.totals.netprofit_budget, currency)}</div>
        </div>
        <div className="kpi-card">
          <div className="label">Total Income</div>
          <div className="value mono" style={{ fontSize: 22 }}>{fmt(qr.totals.income_actual, currency)}</div>
          <div className={`sub ${qr.incomeVariance.favorable ? 'pos' : 'neg'}`}>{qr.incomeVariance.pct === null ? '—' : pctStr(qr.incomeVariance.pct)} vs budget</div>
        </div>
        <div className="kpi-card">
          <div className="label">Avg Fleet Occupancy</div>
          <div className="value mono" style={{ fontSize: 22 }}>{pctStr(qr.fleetAvgOcc)}</div>
          <div className="sub" style={{ color: 'var(--muted)' }}>{qr.above50}/{qr.totalWithData} vehicles above 50%</div>
        </div>
      </div>

      <div className="grid-2">
        <div className="panel">
          <h3>Budget vs Actual</h3>
          <table>
            <thead><tr><th>Category</th><th className="num">Budget</th><th className="num">Actual</th><th>Variance</th></tr></thead>
            <tbody>
              <tr>
                <td>Total Income</td><td className="num">{fmt(qr.totals.income_budget, currency)}</td><td className="num">{fmt(qr.totals.income_actual, currency)}</td>
                <td><span className={`badge ${qr.incomeVariance.favorable ? 'pos' : 'neg'}`}>{qr.incomeVariance.pct === null ? '—' : pctStr(qr.incomeVariance.pct)} {qr.incomeVariance.favorable ? 'Favorable' : 'Deficit'}</span></td>
              </tr>
              <tr>
                <td>Direct Expenses</td><td className="num">{fmt(qr.totals.direct_budget, currency)}</td><td className="num">{fmt(qr.totals.direct_actual, currency)}</td>
                <td><span className={`badge ${qr.directVariance.favorable ? 'pos' : 'neg'}`}>{qr.directVariance.pct === null ? '—' : pctStr(qr.directVariance.pct)} {qr.directVariance.favorable ? 'Favorable' : 'Deficit'}</span></td>
              </tr>
              <tr className="net-row">
                <td>Net Profit / Loss</td><td className="num">{fmt(qr.totals.netprofit_budget, currency)}</td><td className="num">{fmt(qr.totals.netprofit_actual, currency)}</td>
                <td><span className={`badge ${qr.netVariance.favorable ? 'pos' : 'neg'}`}>{qr.netVariance.pct === null ? '—' : pctStr(qr.netVariance.pct)} {qr.netVariance.favorable ? 'Favorable' : 'Deficit'}</span></td>
              </tr>
            </tbody>
          </table>
          {qr.topRevenue && qr.topRevenue.value > 0 && (
            <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: 12 }}>
              <b>{qr.topRevenue.label}</b> was the largest income contributor this period at {pctStr(qr.topRevenueSharePct)} of total income{qr.netVariance.favorable ? ' — a key driver of the favorable variance.' : '.'}
            </p>
          )}
        </div>
        <div className="panel" style={{ textAlign: 'center' }}>
          <h3>Fleet Occupancy</h3>
          <DonutGauge pct={qr.fleetAvgOcc} color={qr.fleetAvgOcc >= 0.5 ? '#3E9C6E' : '#C1503F'} />
          <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: 8 }}>{qr.totalWithData} vehicles with logged data this period</p>
        </div>
      </div>

      <div className="panel">
        <h3>Top Performing Models</h3>
        {qr.topModels.length === 0 ? (
          <p style={{ color: 'var(--muted)', fontSize: 13 }}>No occupancy data logged for this period yet.</p>
        ) : (
          <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
            {qr.topModels.map((m, i) => (
              <div key={i} style={{ border: '1px solid var(--line)', borderRadius: 10, padding: '12px 16px', minWidth: 160 }}>
                <div style={{ fontWeight: 700 }}>{m.name}</div>
                <div className="mono" style={{ fontSize: 20, color: m.avg >= 0.5 ? '#3E9C6E' : '#C1503F' }}>{pctStr(m.avg)}</div>
                <div style={{ fontSize: 11.5, color: 'var(--muted)' }}>avg occupancy · {m.units} unit{m.units > 1 ? 's' : ''}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- Full printable report ---------------- */

function FullReport({ companyName, logoDataUrl, currency, rangeMonths, lineItems, monthlyData, vehicles, occupancy, baseDays }) {
  const totals = rangeAggregate(rangeMonths, monthlyData, lineItems);
  const yearData = rangeMonths.map(p => { const c = computeMonth(p, monthlyData, lineItems); return { label: monthLabel(p), ...c }; });
  const occRows = vehicles.map(v => {
    const pcts = rangeMonths.map(p => { const d = (occupancy[p] || {})[v.id]; return d === undefined || d === '' ? null : num(d) / baseDays; });
    const valid = pcts.filter(x => x !== null);
    const avg = valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : null;
    return { vehicle: v, pcts, avg };
  });

  return (
    <div style={{ padding: 24 }}>
      <QuickReviewPanel companyName={companyName} logoDataUrl={logoDataUrl} currency={currency} rangeMonths={rangeMonths} lineItems={lineItems} monthlyData={monthlyData} vehicles={vehicles} occupancy={occupancy} baseDays={baseDays} />
      <hr style={{ margin: '20px 0', border: 'none', borderTop: '1px solid var(--line)' }} />
      <h1 style={{ fontSize: 22 }}>{companyName}</h1>
      <p style={{ color: 'var(--muted)', marginTop: 4 }}>Budget vs Actual &amp; Occupancy Report · {rangeMonths.map(monthLabel).join(' – ')}</p>

      <div className="kpi-row">
        <KpiCard label="Total Income" value={fmt(totals.income_actual, currency)} sub={`Budget ${fmt(totals.income_budget, currency)}`} diff={totals.income_actual - totals.income_budget} />
        <KpiCard label="Gross Profit" value={fmt(totals.gross_actual, currency)} sub={`Budget ${fmt(totals.gross_budget, currency)}`} diff={totals.gross_actual - totals.gross_budget} />
        <KpiCard label="EBITDA" value={fmt(totals.ebitda_actual, currency)} sub={`Budget ${fmt(totals.ebitda_budget, currency)}`} diff={totals.ebitda_actual - totals.ebitda_budget} />
        <KpiCard label="Net Profit" value={fmt(totals.netprofit_actual, currency)} sub={`Budget ${fmt(totals.netprofit_budget, currency)}`} diff={totals.netprofit_actual - totals.netprofit_budget} />
      </div>

      <div className="panel">
        <h3>Income &amp; Net Profit Trend</h3>
        <LineTrendSVG data={yearData} series={[
          { key: 'income_actual', label: 'Actual Income', color: '#3E9C6E' },
          { key: 'income_budget', label: 'Budget Income', color: '#3E9C6E', dashed: true },
          { key: 'netprofit_actual', label: 'Actual Net Profit', color: '#2D6E8E' },
          { key: 'netprofit_budget', label: 'Budget Net Profit', color: '#2D6E8E', dashed: true },
        ]} />
      </div>

      <PnlCompare monthKeys={rangeMonths} lineItems={lineItems} monthlyData={monthlyData} currency={currency} />

      <div className="panel">
        <h3>Occupancy Summary</h3>
        <table>
          <thead><tr><th>Car</th><th>Plate</th><th className="num">Avg Occupancy</th><th>Remarks</th></tr></thead>
          <tbody>
            {occRows.map(r => (
              <tr key={r.vehicle.id}>
                <td>{r.vehicle.name}</td><td>{r.vehicle.plate}</td>
                <td className="num">{r.avg === null ? '—' : (r.avg * 100).toFixed(0) + '%'}</td>
                <td>{r.avg === null ? '—' : (r.avg >= 0.5 ? 'OK' : 'Workout')}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
